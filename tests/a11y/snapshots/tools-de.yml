  - paragraph: Läuft lokal · Schlüssel verlassen nie das Gerät
- main:
  - heading "Werkzeuge · Embedding-/Rerank-Prüfung" [level=1]
  - paragraph: Embedding- und Rerank-Endpunkte liefern Vektoren oder Rangfolgen, keinen Chat – daher eigene Proben statt der Chat-Prüfung.
  - list:
    - listitem: "Hauptsignal Vektordimension im Vergleich zum angegebenen Modell: das Signal Nr. 1 für Etikettenschwindel."
    - listitem: Ergänzend Wiederholte Tests auf Determinismus und Unterscheidbarkeit untermauern es.
    - listitem: "Rerank Eine Probe mit bekannter Antwort: Die offensichtliche Antwort muss an erster Stelle stehen."
  - tablist "Art der Prüfung":
    - tab "Embedding-Prüfung" [selected]
    - tab "Rerank-Prüfung"
  - tabpanel "Embedding-Prüfung":
    - text: Relay-URL base_url
    - textbox "Relay-URL base_url":
      - /placeholder: https://relay.example.com/v1
    - text: API-Schlüssel Unterstützt env:VAR / file:/pfad
    - textbox "API-Schlüssel":
      - /placeholder: sk-... oder env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Schlüssel anzeigen" [pressed]
    - text: Angefragtes Modell model
    - combobox "Angefragtes Modell Anbieter":
      - option "Anbieter wählen…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "Benutzerdefiniert (vom Relay)"
    - button "Modelle abrufen" [disabled]
    - status
    - combobox "Angefragtes Modell Modell" [disabled]:
      - option "Modell wählen…" [selected]
    - button "Freie Eingabe"
    - text: Angegebenes Modell claimed_model Optional
    - textbox "Angegebenes Modell claimed_model Optional":
      - /placeholder: Leer = wie angefragtes Modell
    - text: Nur wenn das Relay es unter anderem Namen verkauft — zing prüft die Antworten gegen dieses Modell. Angegebene Dimension claimed_dimensions Optional
    - spinbutton "Angegebene Dimension claimed_dimensions Optional"
    - text: Angegebener Anbieter declared_provider Optional
    - textbox "Angegebener Anbieter declared_provider Optional":
      - /placeholder: z. B. openai / deepseek
    - text: Hilft zing, das richtige Modellprofil zu wählen, wenn der Modellname allein nicht eindeutig ist. Die Auswahl eines Modells aus der Liste füllt es aus. Protokoll
    - group "Protokoll":
      - button "Auto" [pressed]
      - button "OpenAI-kompatibel"
    - text: Embedding- und Rerank-Endpunkte sprechen nur die OpenAI-kompatible API.
    - button "Embedding-Endpunkt prüfen"
    - text: Die Anfragen werden von Ihrem lokalen zing-Server gesendet; der Schlüssel dient nur der Verbindung zum Ziel-Relay und wird nie an Dritte übertragen.
  - paragraph: "Embedding-/Rerank-Prüfungen sind Black-Box-Tests ohne Chat: Eine abweichende Dimension ist das stärkste Signal für „Etikettenschwindel“; Determinismus und Unterscheidbarkeit sind ergänzende Belege."
