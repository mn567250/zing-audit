- banner:
  - link "Aller au contenu principal":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - navigation "Navigation principale":
    - link "Audit":
      - /url: /v2/
    - link "Outils":
      - /url: /v2/tools
    - link "Historique":
      - /url: /v2/history
    - link "Surveillances":
      - /url: /v2/watches
    - link "Modèles":
      - /url: /v2/kb
  - link "Interface classique":
    - /url: "?ui=v1"
  - combobox "Thème":
    - option "Automatique"
    - option "Clair" [selected]
    - option "Sombre"
  - combobox "Langue":
    - option "English"
    - option "中文"
    - option "Français" [selected]
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - paragraph: Exécution locale · les clés ne sortent jamais
- main:
  - list "Progression de l'audit":
    - listitem: Configurer
    - listitem: Analyse
    - listitem: Rapport
  - region "Ce relais sert-il le vrai modèle ?":
    - heading "Ce relais sert-il le vrai modèle ?" [level=1]
    - paragraph: Saisissez l'adresse du relais et le modèle qu'il prétend servir. zing exécute une suite complète de tests boîte noire sur votre machine et produit un rapport de vérification lisible et étayé par des preuves.
    - text: URL du relais base_url
    - textbox "URL du relais base_url":
      - /placeholder: https://relay.example.com/v1
    - text: Clé API Accepte env:VAR / file:/chemin
    - textbox "Clé API":
      - /placeholder: sk-... ou env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Afficher la clé" [pressed]
    - text: Modèle demandé model
    - combobox "Modèle demandé fournisseur":
      - option "Choisir un fournisseur…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "Personnalisé (depuis le relais)"
    - button "Récupérer les modèles" [disabled]
    - status
    - combobox "Modèle demandé modèle" [disabled]:
      - option "Choisir un modèle…" [selected]
    - button "Saisie libre"
    - text: Modèle annoncé claimed_model Facultatif
    - textbox "Modèle annoncé claimed_model Facultatif":
      - /placeholder: Vide = identique au modèle demandé
    - text: Seulement si le relais le vend sous un autre nom — zing vérifie les réponses par rapport à ce modèle. Fournisseur déclaré declared_provider Facultatif
    - textbox "Fournisseur déclaré declared_provider Facultatif":
      - /placeholder: p. ex. openai / deepseek
    - text: Aide zing à choisir le bon profil de modèle lorsque le nom du modèle seul est ambigu. Choisir un modèle dans la liste le remplit. Protocole
    - group "Protocole":
      - button "Auto" [pressed]
      - button "OpenAI"
      - button "Anthropic"
      - button "Responses"
    - text: Suite de tests
    - group "Suite de tests":
      - button "smoke"
      - button "standard" [pressed]
      - button "deep"
      - button "full"
      - button "personnalisé"
    - text: Requêtes de la sonde de performance
    - group "Requêtes de la sonde de performance":
      - button "Streaming" [pressed]
      - button "Sans streaming"
    - text: En standard, la sonde ne s'exécute qu'avec une référence ; sinon, les requêtes de l'audit lui-même sont utilisées.
    - button "Comparer à une référence de confiance compare" [expanded]
    - paragraph: Indiquez un point d'accès du même modèle en qui vous avez confiance (p. ex. l'API officielle). zing s'en sert pour corroborer le comportement de la cible et fiabiliser les verdicts de substitution/déclassement — l'évaluation de qualité et la détection de falsification n'atteignent leur niveau maximal qu'avec une référence.
    - text: URL de référence base_url
    - textbox "URL de référence base_url":
      - /placeholder: https://api.openai.com/v1
    - text: Clé API de référence
    - textbox "Clé API de référence":
      - /placeholder: sk-... ou env:OPENAI_API_KEY
    - button "Afficher la clé"
    - text: Modèle de référence model
    - combobox "Modèle de référence fournisseur":
      - option "Choisir un fournisseur…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "Personnalisé (depuis le relais)"
    - button "Récupérer les modèles" [disabled]
    - status
    - combobox "Modèle de référence modèle" [disabled]:
      - option "Choisir un modèle…" [selected]
    - button "Saisie libre"
    - text: Protocole de référence
    - group "Protocole de référence":
      - button "Auto" [pressed]
      - button "OpenAI"
      - button "Anthropic"
      - button "Responses"
    - button "Lancer l'audit"
    - text: Les tests partent de votre serveur zing local ; la clé sert uniquement à se connecter au relais cible et n'est jamais transmise à un tiers.
    - alert
    - status
    - text: zing fournit des preuves reproductibles de risque et d'écart, pas un verdict juridique.
