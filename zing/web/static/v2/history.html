<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-en="zing — audit history">zing — 检测历史</title>
<script src="/locales.js"></script>
<script src="/lang.js"></script>
<script src="/v2/static/theme.js"></script>
<link rel="stylesheet" href="/v2/static/tokens.css" />
<link rel="stylesheet" href="/v2/static/zing.css" />
<link rel="stylesheet" href="/v2/static/filterpanel.css" />
<link rel="stylesheet" href="/v2/static/report.css" />
<link rel="stylesheet" href="/v2/static/perf.css" />
<link rel="stylesheet" href="/v2/static/chartmotion.css" />
<style>
  /* History page. Tokens only (zing.css); light + dark.
   *
   * Every group shares ONE column grid (--cols), so Risk / Score / Grade line
   * up across relays. Below 600px each row stacks instead (no h-scroll).
   *
   * Grade letter colour (by grade, not by risk):
   *   A, B -> good · C -> sky · D -> warn · E, F -> bad · none -> grey.
   * Scores (row score, trend value, sparkline) use the same families through
   * the grade thresholds of zing/scoring.py (>=80 good, >=70 sky, >=60 warn). */
  /* Columns: time (with mode / suite under it) · risk · score · grade · chevron.
     Mode sits under the date instead of in its own column so the longest date
     ("Sep 29, 2026, 3:40 PM") and risk label (DE "Abweichungen gefunden", FR
     "Tromperie sur la marchandise") of every language stay on one line. */
  .hist { --cols: minmax(0, 1.1fr) minmax(0, 1.5fr) 2.8em 4.8em 18px; --cgap: 12px; --del: 36px; }
  .local-note { display: flex; align-items: center; gap: 7px; margin: 12px 0 0; font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; }
  .local-note .zicon { width: 13px; height: 13px; flex: none; }
  .local-note code { font-size: 11.5px; color: var(--ink-muted); background: var(--sunken); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

  .hist { margin-top: 22px; overflow: hidden; }
  .hist:focus { outline: none; }
  .hist .state { padding: 26px 22px; color: var(--ink-muted); font-size: 14px; }
  .hist .state.loading { font-family: var(--mono); font-size: 13px; color: var(--ink-muted); }
  .hist .errbox { margin: 18px; }

  /* shared column header = sort controls (+ collapse / expand all groups) */
  .colhead { display: grid; grid-template-columns: 1fr calc(var(--del) * 3 + 12px); gap: 6px; padding: 10px 18px 6px; border-bottom: 1px solid var(--line); align-items: center; }
  /* same font size as .rmain, so the em columns line up with the rows */
  .colhead .cells { display: grid; grid-template-columns: var(--cols); gap: var(--cgap); padding: 0 10px; align-items: center; font-size: 13px; }
  .colhead .slabel { display: none; }
  .colhead .gall { justify-self: end; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sortb {
    display: inline-flex; align-items: center; gap: 3px; min-width: 0; max-width: 100%; padding: 4px 4px; margin: 0 -4px; cursor: pointer; justify-self: start;
    font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-muted);
    background: none; border: 0; border-radius: 6px; transition: color 0.12s, background 0.12s;
  }
  .sortb .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sortb.n .t { overflow: visible; }
  .sortb .zicon { width: 12px; height: 12px; flex: none; opacity: 0; transition: transform 0.2s; }
  .sortb:hover { color: var(--ink); background: var(--sunken); }
  .sortb[data-dir] { color: var(--ink); }
  .sortb[data-dir] .zicon { opacity: 1; }
  .sortb[data-dir="asc"] .zicon { transform: rotate(180deg); }
  /* numeric columns are narrow: their labels end at the column's right edge
     and grow to the left, Score into the free end of the wide Risk column */
  .sortb.n { justify-self: end; flex-direction: row-reverse; max-width: none; margin: 0 -4px 0 -10px; }
  .sortb[data-sort="score"] { margin-left: -120px; }

  /* group collapse toggle: the group heading's text is the button */
  .gtog {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin: -3px 0 -3px -26px; padding: 3px 6px 3px 4px; cursor: pointer;
    font: inherit; letter-spacing: inherit; color: inherit; text-align: left; background: none; border: 0; border-radius: 8px;
  }
  .gtog:hover { background: var(--sunken); }
  .gtog .t { overflow-wrap: anywhere; min-width: 0; }
  .gtog .zicon { width: 16px; height: 16px; flex: none; color: var(--ink-muted); transition: transform 0.2s; }
  .gtog[aria-expanded="false"] .zicon { transform: rotate(-90deg); }
  .gbody[hidden] { display: none; }
  .group.shut .grp-h { padding-bottom: 16px; }

  /* group */
  .grp-h { display: flex; align-items: center; gap: 14px; padding: 18px 18px 8px 28px; flex-wrap: wrap; }
  .group + .group { border-top: 1px solid var(--line); }
  /* off-screen groups skip style/layout/paint until scrolled near; their
     rendered rows stay in the DOM, so find-in-page, Tab order and the
     accessibility tree are unaffected (--gh, set per group, estimates the
     height until the real one is known; nothing in a group draws past its
     padding, so the paint containment clips no focus ring). A group with an open report keeps normal rendering (the
     containment would clip the report's popovers). Browsers without :has()
     drop the rule and render as before. */
  .group:not(:has(.panel:not([hidden]))) { content-visibility: auto; contain-intrinsic-size: auto var(--gh, 1300px); }
  .gtitle { flex: 1 1 220px; min-width: 0; }
  .gtitle h2 { font-family: var(--disp); font-weight: 600; font-size: 17px; letter-spacing: -0.3px; margin: 0; overflow-wrap: anywhere; }
  .gtitle .gu { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
  .gtitle .gu span { font-family: var(--mono); font-size: 12px; color: var(--ink-muted); overflow-wrap: anywhere; min-width: 0; }
  .gtitle .key { flex: none; }
  /* group trends: score + latency p50, each "caption / sparkline + value" */
  .trend { display: flex; align-items: stretch; gap: 16px; flex: 0 0 auto; margin-left: auto; }
  .tr { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .tr + .tr { padding-left: 16px; border-left: 1px solid var(--line); }
  .tr .tl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
  .tr .tv { display: flex; align-items: center; gap: 9px; }
  .tr .tv b { color: inherit; font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tr .tv b small { font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--ink-muted); letter-spacing: 0; margin-left: 2px; }
  .trend svg { display: block; overflow: visible; }
  .trend .area { fill: currentColor; opacity: 0.14; }
  .trend .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .trend .base { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
  .trend .dot { fill: currentColor; }

  /* filter bar: the collapsible frame is filterpanel.css / filterpanel.js */
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; align-items: end; }
  .fgrid .fq { grid-column: 1 / -1; }
  @media (min-width: 700px) { .fgrid .fq { grid-column: auto; } }
  .fgrid label { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fgrid label > span { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); overflow-wrap: anywhere; }
  .fgrid .in { font-size: 13.5px; padding: 8px 11px; border-radius: 10px; }
  .fgrid select.in { padding-right: 30px; background-position: right 16px center, right 11px center; }
  .tsel { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .tsel > span { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); margin-right: 4px; }
  .tsel button {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-family: var(--sans); font-weight: 600; font-size: 12.5px;
    color: var(--ink-muted); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-pill); padding: 5px 11px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tsel button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
  .tsel button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .tsel button[aria-pressed="true"]::before { background: currentColor; }
  .tsel button:hover:not(:disabled) { border-color: var(--line); color: var(--ink); }
  .tsel button[aria-pressed="true"]:hover:not(:disabled) { border-color: var(--ink); }
  .tsel button:disabled { cursor: not-allowed; opacity: 0.7; }
  .nomatch { text-align: center; padding: 36px 22px; color: var(--ink-muted); font-size: 14.5px; }
  .nomatch p { margin: 0 0 14px; }

  /* colour families (text) */
  .f-good { color: var(--success); } .f-sky { color: var(--info); } .f-warn { color: var(--warning); }
  .f-bad { color: var(--danger); } .f-grey { color: var(--ink-muted); }
  /* trend series without a score family: latency = sky, tokens/s = violet
     (page-local token, >= 4.5:1 on --surface in both themes) */
  .f-lat { color: var(--info); } .f-tps { color: var(--chart-3); }

  /* rows */
  .rows { list-style: none; margin: 0; padding: 0 18px 10px; }
  .row + .row { border-top: 1px dotted var(--line); }
  .rline { display: grid; grid-template-columns: 1fr var(--del) var(--del) var(--del); gap: 6px; align-items: center; }
  .rmain {
    display: grid; grid-template-columns: var(--cols); gap: var(--cgap); align-items: center; width: 100%; min-width: 0;
    text-align: left; background: none; border: 0; border-radius: 12px; padding: 11px 10px; cursor: pointer;
    font-size: 13px; color: var(--ink-muted); transition: background 0.12s;
  }
  .rmain:hover { background: var(--sunken); }
  .rmain[aria-expanded="true"] { background: var(--sunken); color: var(--ink); }
  /* areas follow the DOM order (date, risk, score, grade, mode): reading and
     Tab order match what is shown (BITV 9.1.3.2) */
  .rmain {
    grid-template-areas: "date risk score grade cv" "mode . . . cv"; row-gap: 3px;
  }
  .rmain > span { min-width: 0; }
  .c-date { grid-area: date; align-self: end; } .c-score { grid-area: score; } .c-grade { grid-area: grade; }
  .c-risk { grid-area: risk; } .c-mode { grid-area: mode; align-self: start; } .c-cv { grid-area: cv; }
  .c-date { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }
  .c-risk .badge { white-space: normal; text-align: left; line-height: 1.25; max-width: 100%; }
  .c-risk .badge .zicon { flex: none; }
  .c-score { text-align: right; font-family: var(--disp); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .c-grade { text-align: right; font-family: var(--disp); font-weight: 700; font-size: 16px; }
  .c-mode { font-family: var(--mono); font-size: 11.5px; color: var(--ink-muted); overflow-wrap: anywhere; }
  .c-mode b { font-weight: 600; color: var(--ink); }
  .c-mode .perf, .c-mode .proto { display: block; color: var(--ink-muted); margin-top: 2px; }
  .c-cv { display: inline-flex; justify-content: flex-end; color: var(--ink-muted); }
  .c-cv .zicon { width: 15px; height: 15px; transition: transform 0.2s; }
  .rmain[aria-expanded="true"] .c-cv .zicon { transform: rotate(180deg); }
  .rdel, .rsched, .rrerun {
    width: var(--del); height: var(--del); display: grid; place-items: center; border-radius: 10px; cursor: pointer;
    background: none; border: 1px solid transparent; color: var(--ink-muted); transition: color 0.12s, background 0.12s, border-color 0.12s;
  }
  .rdel .zicon, .rsched .zicon, .rrerun .zicon { width: 15px; height: 15px; }
  .rsched:not(:disabled):hover, .rrerun:hover { color: var(--primary); background: var(--sunken); border-color: var(--primary); }
  .rsched:disabled { opacity: 0.5; cursor: progress; }
  .rsched.bymon:disabled { opacity: 0.35; cursor: not-allowed; }
  .rmsg { margin: 2px 10px 10px; font-size: 12.5px; font-weight: 600; color: var(--danger); }
  .rmsg:empty { display: none; }
  .rdel:hover { color: var(--danger); background: var(--danger-tint); border-color: var(--danger); }

  /* inline confirmation (row delete + clear all) */
  .confirm {
    display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin: 2px 0 10px; padding: 10px 12px;
    border: 1px solid var(--danger); background: var(--danger-tint); border-radius: 12px; font-size: 13px; color: var(--danger); font-weight: 600;
  }
  .confirm[hidden] { display: none; }
  .confirm .msg { flex: 1 1 200px; min-width: 0; }
  .confirm .btns { display: flex; gap: 8px; }
  .btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--on-primary); }
  .btn.danger-solid:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); }

  /* expanded report */
  .panel { padding: 6px 0 14px; }
  .panel[hidden] { display: none; }
  .panel .state { padding: 14px 10px; }
  .panel .zr { box-shadow: none; }

  /* list footer: quiet clear-history */
  /* "Show more" under a group's first rows */
  .gmore { padding: 2px 28px 16px; }
  .gmore .btn { max-width: 100%; white-space: normal; text-align: center; }
  .lfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 18px 14px 28px; border-top: 1px solid var(--line); background: var(--sunken); }
  .lfoot .aside { font-size: 12px; }
  .lfoot .confirm { flex: 1 1 100%; margin: 0; }
  .clr { color: var(--ink-muted); font-weight: 600; font-size: 12.5px; }
  .clr:hover { color: var(--danger); }
  .clr .zicon { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }

  .empty-box { text-align: center; padding: 44px 22px 40px; }
  .empty-box .ic { color: var(--ink-muted); margin-bottom: 10px; }
  .empty-box .ic .zicon { width: 34px; height: 34px; }
  .empty-box p { margin: 0 0 16px; color: var(--ink-muted); font-size: 15px; }

  /* phones: stacked rows, no horizontal scroll */
  @media (max-width: 600px) {
    /* sort controls as one wrapping row of buttons */
    .colhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 14px 8px 16px; }
    .colhead .cells { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 0; }
    .colhead .slabel { display: inline; font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); }
    .sortb, .sortb.n { margin: 0; flex-direction: row; }
    .colhead .gall { margin-left: auto; }
    .gtog { margin-left: -6px; }
    .grp-h { padding: 16px 14px 6px 16px; }
    .rows { padding: 0 8px 8px; }
    .gmore { padding: 2px 16px 14px; }
    .lfoot { padding: 12px 14px; }
    .rmain {
      grid-template-columns: auto auto minmax(0, 1fr) 18px; gap: 6px 10px; padding: 11px 8px;
      grid-template-areas: "date date date cv" "risk risk risk risk" "score grade mode mode";
    }
    .c-date, .c-mode { align-self: auto; }
    .c-score, .c-grade { text-align: left; }
    .c-mode .perf, .c-mode .proto { display: inline; margin: 0; }
    .c-mode .perf::before, .c-mode .proto::before { content: " · "; }
    .rline { align-items: start; }
    .rdel, .rsched, .rrerun { margin-top: 4px; }
    .grp-h { flex-wrap: nowrap; align-items: flex-start; }
    .gtitle { flex: 1 1 auto; }
    .trend { flex-direction: column; align-items: flex-end; gap: 8px; }
    .tr { align-items: flex-end; }
    .tr + .tr { padding-left: 0; border-left: 0; }
    .trend svg { width: 84px; height: 26px; }
    .fgrid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="znav" data-page="history"></header>
  <main id="main" tabindex="-1">
    <div class="hero">
      <h1 data-en="Audit <span class='u'>history</span> &amp; trends">检测<span class='u'>历史</span>与趋势</h1>
      <p data-en="Every verification you have run on this machine. Grouped by &quot;relay + claimed model&quot;, with a health-score trend line; click any row to expand that report.">这里是你在本机跑过的每一次验真。按「中转站 + 声称模型」分组，附一条健康分趋势曲线；点任意一行可展开当时那份报告。</p>
      <p class="local-note"><span class="pico" id="lockIcon"></span><span data-en="History lives only in a local SQLite file under &lt;code&gt;~/.zing&lt;/code&gt; — nothing is uploaded.">历史只保存在 <code>~/.zing</code> 下的本地 SQLite 文件里，不会上传。</span></p>
    </div>

    <section class="card filters" id="filters" hidden></section>

    <section class="card hist" id="hist" tabindex="-1" aria-busy="true">
      <div class="state loading" data-en="Loading history…">加载历史…</div>
    </section>
    <p class="sr-only" id="sortst" role="status"></p>
  </main>
</div>
<script src="/i18n.js"></script>
<script src="/perf.js"></script>
<script src="/v2/static/chartmotion.js"></script>
<script src="/icons.js"></script>
<script src="/v2/static/nav.js"></script>
<script src="/v2/static/filterpanel.js"></script>
<script src="/v2/static/report.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var ico = function (n, o) { return window.zingIcon ? window.zingIcon(n, o || {}) : ""; };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  // T(zh, en) with {name} placeholders filled after translation
  var Tf = function (zh, en, vars) {
    return T(zh, en).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; });
  };

  var RISKC = { clean: "good", low: "sky", medium: "warn", high: "bad", inconclusive: "grey" };
  var RISKI = { clean: "check", low: "warning", medium: "warning", high: "x", inconclusive: "info" };
  var GRADEC = { A: "good", B: "good", C: "sky", D: "warn", E: "bad", F: "bad" };
  // score -> same family as the grade it maps to (scoring.py: A>=90 B>=80 C>=70 D>=60)
  var scoreC = function (s) {
    return typeof s !== "number" ? "grey" : s >= 80 ? "good" : s >= 70 ? "sky" : s >= 60 ? "warn" : "bad";
  };
  var gradeC = function (g) { return GRADEC[String(g || "").toUpperCase()] || "grey"; };
  var num = function (s) { return typeof s === "number" ? String(Math.round(s)) : "—"; };

  var host = $("#hist"), fbar = $("#filters");
  var FKEY = "zing.v2.history.filters", NONE = "__none__";
  var fromQuery; // set by loadFilters() when the URL carries filters
  var FDEF = { surface: "", host: "", model: "", suite: "", mode: "", api: "", detect: "", stream: "", risk: "", min: "", days: "", exec: "", q: "" };
  var state = { rows: null, error: null, reports: {}, open: null, confirm: null, filters: loadFilters() };
  // Rows are rendered PAGE at a time per group ("Show more" appends the next
  // page); state.shown remembers how far each group (by key) was expanded
  // across re-renders, state.groups holds the groups of the last render.
  var PAGE = 20;
  state.shown = {};
  state.groups = [];

  // per-viewer view settings (storage may be missing or throw): row order,
  // collapsed groups (by key) and whether the filter panel is open
  function loadJSON(key, def) {
    try { var v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? def : v; } catch (e) { return def; }
  }
  function saveJSON(key, v) {
    try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* ignore */ }
  }
  var SKEY = "zing.v2.history.sort", CKEY = "zing.v2.history.collapsed", OKEY = "zing.v2.history.filtersOpen";
  var SORTS = ["time", "risk", "score", "grade"];
  state.sort = (function () {
    var s = loadJSON(SKEY, null);
    return s && SORTS.indexOf(s.key) >= 0 && (s.dir === "asc" || s.dir === "desc") ? { key: s.key, dir: s.dir } : { key: "time", dir: "desc" };
  })();
  state.collapsed = (function () {
    var c = loadJSON(CKEY, {}), out = {};
    if (c && typeof c === "object") Object.keys(c).forEach(function (k) { if (c[k] === true) out[k] = true; });
    return out;
  })();
  // the collapsible frame (filterpanel.js); a link that carried filters opens it
  var panel = window.ZingFilterPanel.create(fbar, {
    storeKey: OKEY,
    open: !!fromQuery,
    onReset: function () { resetFilters(); },
  });

  $("#lockIcon").innerHTML = ico("lock");

  /* ---------------- filters ---------------- */
  // per-viewer convenience only: storage may be missing or throw
  function loadFilters() {
    var f = Object.assign({}, FDEF);
    try {
      var saved = JSON.parse(localStorage.getItem(FKEY) || "{}");
      Object.keys(FDEF).forEach(function (k) { if (typeof saved[k] === "string") f[k] = saved[k]; });
    } catch (e) { /* ignore */ }
    // links such as the monitors' "Open in history" pass filters in the query
    // string; these win over the remembered ones
    try {
      var qs = new URLSearchParams(location.search);
      var QK = ["surface", "host", "model", "suite", "api", "stream"];
      if (QK.some(function (k) { return qs.has(k); })) {
        f = Object.assign({}, FDEF); // drop stale filters that could hide the monitor's runs
        QK.forEach(function (k) { if (qs.has(k)) f[k] = qs.get(k); });
        fromQuery = true; // show what the link filtered by
        localStorage.setItem(FKEY, JSON.stringify(f));
      }
    } catch (e) { /* ignore */ }
    return f;
  }
  function saveFilters() {
    try { localStorage.setItem(FKEY, JSON.stringify(state.filters)); } catch (e) { /* ignore */ }
  }
  function isFiltered() {

  // number of filters that differ from the defaults (shown on the panel toggle)

  }
  // the active filters in words, for the line under the closed panel's toggle

  function syncFilterChrome() {

  function fmtTime(ts) {

    } catch (e) {
      return d.toLocaleString();
    }
  }

  /* ---------------- sorting ---------------- */
  // Rows are sorted inside their group; groups follow their first row, so the
  // group holding the best match of the sort comes first. Missing values sort
  // last either way; ties keep newest first.
  var RISKN = { clean: 0, inconclusive: 1, low: 2, medium: 3, high: 4 };
  var tsOf = function (r) { var t = Date.parse(r.ts); return isNaN(t) ? null : t; };
  var SORTV = {
    time: tsOf,
    risk: function (r) { return RISKN[riskOf(r)]; },
    score: function (r) { return typeof r.score === "number" ? r.score : null; },
    grade: function (r) { return GRADEN[String(r.rating || "").toUpperCase()] || null; },
  };
  var SORTL = {
    time: ["时间", "Time"], risk: ["风险", "Risk"], score: ["健康分", "Score"], grade: ["评级", "Grade"],
  };
  function byKey(fn, dir) {
    return function (a, b) {
      var x = fn(a), y = fn(b);
      if (x == null || y == null) return x == null ? (y == null ? 0 : 1) : -1;
      return dir === "asc" ? x - y : y - x;
    };

  function sortRows(rows) {
    var main = byKey(SORTV[state.sort.key], state.sort.dir), newest = byKey(tsOf, "desc");
    return rows.map(function (r, i) { return [r, i]; }).sort(function (a, b) {
      return main(a[0], b[0]) || newest(a[0], b[0]) || a[1] - b[1];

  }

    });

  // a new column starts descending (newest, most severe, best first); the

    saveJSON(SKEY, state.sort);

  function groupsOf(rows) {
    var groups = [], idx = {};
    rows.forEach(function (r) {
      var key = (r.base_url || "") + "\n" + (r.claimed_model || "");
      if (idx[key] == null) {
        idx[key] = groups.length;
        groups.push({ key: key, base_url: r.base_url, claimed_model: r.claimed_model, rows: [] });

  /* ---------------- data ---------------- */
  function load() {
    host.setAttribute("aria-busy", "true");

    // trends are drawn from the (filtered) rows without one request per group.
    return fetch("/api/history?limit=500&perf=1")
      .then(function (r) {

    if (state.open != null && !rows.some(function (r) { return String(r.id) === String(state.open); })) state.open = null;

        : Tf("共 {n} 条记录", "Saved audits: {n}", { n: state.rows.length })) + "</span>" +
      (more ? '<p class="sr-only" id="hmore" role="status"></p>' : "") +
      '<button type="button" class="linkbtn clr" id="clr" aria-expanded="' + (state.confirm === "all") + '" aria-controls="clrConfirm">' +

  function focusKey(el) {

      '<button type="button" class="btn sm" data-no="' + what + '">' + esc(T("取消", "Cancel")) + "</button></span></div>";
  }

  function groupHTML(g, gi) {
    var hid = "g" + gi, shut = !!state.collapsed[g.key];
    // rough height for content-visibility until the group is first laid out
    var gh = shut ? 100 : 100 + 58 * g.limit + (g.limit < g.rows.length ? 50 : 0);
    // the heading's text is the collapse toggle: heading navigation still
    // lands on it, and the button says whether the group's rows are shown
    // named by model AND base URL: one model on two relays gives two groups
    return '<section class="group' + (shut ? " shut" : "") + '" aria-labelledby="' + hid + " " + hid + 'u" style="--gh:' + gh + 'px"><div class="grp-h"><div class="gtitle">' +
      '<h2 id="' + hid + '"><button type="button" class="gtog" data-gkey="' + esc(g.key) + '" aria-expanded="' + !shut + '" aria-controls="gb' + gi + '" title="' +
      esc(T("声称模型", "Claimed model")) + '">' + ico("chevronDown") + '<span class="t">' +
      esc(g.claimed_model || T("(未声明模型)", "(no model declared)")) + "</span></button></h2>" +
      '<div class="gu"><code class="key">base_url</code><span id="' + hid + 'u" title="' + esc(g.base_url || "") + '">' + esc(g.base_url || "—") + "</span></div></div>" +
      trendHTML(g.rows) + "</div>" +
      '<div class="gbody" id="gb' + gi + '"' + (shut ? " hidden" : "") + '><ul class="rows">' + g.rows.slice(0, g.limit).map(rowHTML).join("") + "</ul>" +
      moreHTML(g, gi) + "</div></section>";
  }

  // "Show more" under a group whose rows are not all rendered yet; its
  // description is the group heading (several groups have such a button)
  function moreLabel(left) { return Tf("显示更多（还剩 {k} 条）", "Show more ({k} remaining)", { k: left }); }
  function moreHTML(g, gi) {
    var left = g.rows.length - g.limit;
    if (left <= 0) return "";
    return '<div class="gmore"><button type="button" class="btn sm" data-more="' + esc(g.key) + '" aria-describedby="g' + gi + '">' +
      esc(moreLabel(left)) + "</button></div>";
  }

  // append the group's next page of rows without rebuilding the list; focus
  // stays on the button while rows remain, else moves to the first new row
  function showMore(btn) {
    var key = btn.getAttribute("data-more"), g = state.groups.filter(function (x) { return x.key === key; })[0];
    var sec = btn.closest(".group"), ul = sec && sec.querySelector(".rows");
    if (!g || !ul) return;
    var from = g.limit, to = Math.min(g.rows.length, from + PAGE);
    ul.insertAdjacentHTML("beforeend", g.rows.slice(from, to).map(rowHTML).join(""));
    g.limit = to;
    state.shown[g.key] = Math.max(state.shown[g.key] || 0, to);
    var left = g.rows.length - to;
    if (left > 0) {
      btn.textContent = moreLabel(left);
    } else {
      var first = ul.querySelector('.row[data-id="' + CSS.escape(String(g.rows[from].id)) + '"] .rmain');
      if (first) first.focus();
      btn.parentNode.remove();
    }
    var live = document.getElementById("hmore");
    if (live) live.textContent = Tf("{group}：显示 {shown} / {total} 条记录", "{group}: showing {shown} of {total} audits",
      { group: (g.claimed_model || T("(未声明模型)", "(no model declared)")) + " · " + hostOf(g.base_url), shown: to, total: g.rows.length });
  }

  // small sparkline of vals (oldest -> newest) scaled to [lo, hi]; area fill
  // optional. Stroke/fill use currentColor, so the tile's colour family (on
  // .tr) colours the line and the KPI number alike.
  function sparkSVG(vals, lo, hi, label, area, W) {
    var H = 30, P = 3, rg = hi - lo || 1;
    var xs = vals.map(function (_, i) { return P + (i * (W - 2 * P)) / (vals.length - 1); });
    var ys = vals.map(function (v) { return H - P - ((Math.max(lo, Math.min(hi, v)) - lo) / rg) * (H - 2 * P); });
    var d = xs.map(function (x, i) { return (i ? "L" : "M") + x.toFixed(1) + "," + ys[i].toFixed(1); }).join(" ");
    var fill = area ? '<path class="area" d="' + d + " L" + xs[xs.length - 1].toFixed(1) + "," + (H - P) + " L" + xs[0].toFixed(1) + "," + (H - P) + ' Z"/>' : "";
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">' +
      "<title>" + esc(label) + "</title>" +
      '<line class="base" x1="0" x2="' + W + '" y1="' + (H - P) + '" y2="' + (H - P) + '"/>' + fill +
      '<path class="line" d="' + d + '"/>' +
      '<circle class="dot" cx="' + xs[xs.length - 1].toFixed(1) + '" cy="' + ys[ys.length - 1].toFixed(1) + '" r="2.5"/></svg>';
  }

  /* ---------------- configurable trends ---------------- */
  // Grade letters on a 1..6 scale for the grade sparkline (F lowest).
  var GRADEN = { A: 6, B: 5, C: 4, D: 3, E: 2, F: 1 };
  var GRADEL = ["", "F", "E", "D", "C", "B", "A"];
  // Each metric: value per row (null = none), scale (fixed or the points'
  // min..max), colour family of the latest value, KPI text.
  var METRICS = [
    { id: "score", zh: "健康分", en: "Score", area: true, lo: 0, hi: 100,
      get: function (r) { return typeof r.score === "number" ? r.score : null; },
      fam: function (v) { return scoreC(v); },
      kpi: function (v) { return String(Math.round(v)); } },
    { id: "grade", zh: "评级", en: "Grade", area: true, lo: 1, hi: 6,
      get: function (r) { return GRADEN[String(r.rating || "").toUpperCase()] || null; },
      fam: function (v) { return gradeC(GRADEL[v]); },
      kpi: function (v) { return GRADEL[v]; } },
    { id: "lat", zh: "延迟 p50", en: "Latency p50", unit: "ms", area: true,
      get: function (r) { return typeof r.latency_p50_ms === "number" ? r.latency_p50_ms : null; },
      fam: function () { return "lat"; },
      kpi: function (v) { return String(Math.round(v)); } },
    { id: "tps", zh: "输出速度", en: "Tokens/s", unit: "tok/s", area: true,
      get: function (r) { return typeof r.decode_tps_p50 === "number" ? r.decode_tps_p50 : null; },
      fam: function () { return "tps"; },
      kpi: function (v) { return String(Math.round(v)); } },
  ];
  var TKEY = "zing.v2.history.trends", TDEF = ["score", "lat"];
  state.trends = (function () {
    try {
      var t = JSON.parse(localStorage.getItem(TKEY) || "null");
      if (Array.isArray(t)) {
        t = METRICS.map(function (m) { return m.id; }).filter(function (id) { return t.indexOf(id) >= 0; });
        if (t.length) return t;
      }
    } catch (e) { /* ignore */ }
    return TDEF.slice();
  })();

  function trendPickerHTML() {
    var only = state.trends.length === 1;
    return '<div class="tsel" role="group" aria-labelledby="tselL"><span id="tselL">' + esc(T("趋势图", "Trends")) + "</span>" +
      METRICS.map(function (m) {
        var on = state.trends.indexOf(m.id) >= 0;
        return '<button type="button" data-trend="' + m.id + '" aria-pressed="' + on + '"' + (on && only ? " disabled" : "") + ">" +
          esc(T(m.zh, m.en)) + "</button>";
      }).join("") + "</div>";
  }

  function toggleTrend(id) {
    var on = state.trends.indexOf(id) >= 0;
    if (on && state.trends.length === 1) return; // keep at least one
    var next = on ? state.trends.filter(function (x) { return x !== id; }) : state.trends.concat([id]);
    state.trends = METRICS.map(function (m) { return m.id; }).filter(function (x) { return next.indexOf(x) >= 0; });
    try { localStorage.setItem(TKEY, JSON.stringify(state.trends)); } catch (e) { /* ignore */ }
    var only = state.trends.length === 1;
    Array.prototype.forEach.call(fbar.querySelectorAll("[data-trend]"), function (b) {
      var sel = state.trends.indexOf(b.getAttribute("data-trend")) >= 0;
      b.setAttribute("aria-pressed", String(sel));
      b.disabled = sel && only;
    });
    render();
  }

  // group trends from the group's (filtered) rows, oldest to newest whatever
  // the list's sort
  function trendHTML(rows) {
    var pts = rows.slice().sort(byKey(tsOf, "asc"));
    var W = state.trends.length > 2 ? 72 : 96;
    var tiles = METRICS.filter(function (m) { return state.trends.indexOf(m.id) >= 0; }).map(function (m) {
      var vals = pts.map(m.get).filter(function (v) { return v != null; });
      if (!vals.length) return "";
      var name = T(m.zh, m.en), last = vals[vals.length - 1];
      var lo = m.lo != null ? m.lo : Math.min.apply(null, vals), hi = m.hi != null ? m.hi : Math.max.apply(null, vals);
      var label;
      if (m.id === "score") {
        var first = Math.round(vals[0]), lst = Math.round(last);
        var dir = lst > first ? T("上升", "rising") : lst < first ? T("下降", "falling") : T("持平", "unchanged");
        label = Tf("健康分趋势（{n} 次检测）：从 {first} 到 {last}，{dir}。",
          "Health score trend across {n} audits: from {first} to {last}, {dir}.", { n: vals.length, first: first, last: lst, dir: dir });
      } else {
        var u = m.unit ? " " + m.unit : "";
        label = Tf("{metric}趋势（{n} 次检测）：从 {first} 到 {last}。",
          "{metric} trend across {n} audits: from {first} to {last}.",
          { metric: name, n: vals.length, first: m.kpi(vals[0]) + u, last: m.kpi(last) + u });
      }
      return '<div class="tr f-' + m.fam(last) + '"><span class="tl">' + esc(name) + '</span><div class="tv">' +
        (vals.length >= 2 ? sparkSVG(vals, lo, hi, label, !!m.area, W) : "") +
        "<b>" + esc(m.kpi(last)) + (m.unit ? "<small>" + esc(m.unit) + "</small>" : "") + "</b></div></div>";
    }).join("");
    return '<div class="trend">' + tiles + "</div>";
  }

  // a badge for every surface but chat (the default, most rows)
  function surfaceHTML(r) {
    var s = surfaceOf(r);
    return s === "chat" ? "" : ' <span class="badge machine-soft">' + esc(surfaceLabel(s)) + "</span>";
  }

  function rowHTML(r) {
    var id = String(r.id);
    var lvl = r.risk_level || "inconclusive";
    var perf = typeof r.latency_p50_ms === "number" ? r : null;
    var open = String(state.open) === id;
    return '<li class="row" data-id="' + esc(id) + '"><div class="rline">' +
      '<button type="button" class="rmain" id="r-' + esc(id) + '" aria-expanded="' + open + '" aria-controls="p-' + esc(id) + '">' +
      '<span class="c-date">' + esc(fmtTime(r.ts)) + "</span>" +
      '<span class="c-risk"><span class="badge ' + (RISKC[lvl] || "grey") + '">' + ico(RISKI[lvl] || "info") + " " +
      esc(ZING_I18N.label("RISK_LEVEL", lvl)) + "</span></span>" +
      '<span class="c-score f-' + scoreC(r.score) + '"><span class="sr-only">' + esc(T("健康分", "Score")) + " </span>" + num(r.score) + "</span>" +
      '<span class="c-grade f-' + gradeC(r.rating) + '"><span class="sr-only">' + esc(T("评级", "Grade")) + " </span>" + esc(r.rating || "–") + "</span>" +
      '<span class="c-mode"><b>' + esc(r.mode || "check") + "</b>" + surfaceHTML(r) + (byMonitor(r) ? ' <span class="badge sky">' + ico("bell") + " " + esc(T("监控", "Monitor")) + "</span>" : "") + (r.suite ? " · " + esc(r.suite) : "") + protoHTML(r) +
      (perf ? '<span class="perf" title="' + esc(T("延迟 p50", "Latency p50")) + '">p50 ' + Math.round(perf.latency_p50_ms) + " ms</span>" : "") + "</span>" +
      '<span class="c-cv" aria-hidden="true">' + ico("chevronDown") + "</span></button>" +
      rerunBtnHTML(r) + schedBtnHTML(r) +
      '<button type="button" class="rdel" aria-label="' + esc(T("删除此记录", "Delete entry")) + '" title="' + esc(T("删除此记录", "Delete entry")) +
      '" aria-expanded="' + (state.confirm === id) + '" aria-controls="c-' + esc(id) + '">' + ico("trash") + "</button></div>" +
      confirmHTML("c-" + esc(id), id, T("删除这条历史记录？", "Delete this history entry?"), T("删除", "Delete")) +
      '<p class="rmsg" id="m-' + esc(id) + '" role="status"></p>' +
      '<div class="panel" id="p-' + esc(id) + '" data-id="' + esc(id) + '" role="region" aria-labelledby="r-' + esc(id) + '" hidden></div></li>';
  }

  // protocol (auto-detected or set by hand) and the probe's request mode
  function protoHTML(r) {
    var bits = [];
    if (apiOf(r)) bits.push(esc(apiOf(r)) + (detectOf(r) ? " (" + esc(detectLabel(detectOf(r))) + ")" : ""));
    if (streamOf(r) && surfaceOf(r) === "chat") bits.push(esc(streamLabel(streamOf(r))));
    return bits.length ? '<span class="proto">' + bits.join(" · ") + "</span>" : "";
  }

  // A run a monitor produced already has its monitor: offer no second one.
  function byMonitor(r) { return !!r && r.watch_id != null; }

  // Re-run: open the audit form prefilled with this run's configuration. A
  // non-chat run preselects its surface in the audit page's endpoint-type
  // selector (?surface=embedding|rerank).
  var RERUN_SURFACES = { embedding: 1, rerank: 1 };
  function rerun(id) {
    var row = (state.rows || []).filter(function (r) { return String(r.id) === String(id); })[0];
    var s = row ? surfaceOf(row) : "chat", q = "rerun=" + encodeURIComponent(id);
    location.href = RERUN_SURFACES.hasOwnProperty(s) ? "/v2/?surface=" + s + "&" + q : "/v2/?" + q;
  }

  function rerunBtnHTML(r) {
    var label = T("重新检测", "Re-run audit");
    return '<button type="button" class="rrerun" data-rerun="' + esc(String(r.id)) + '" aria-label="' + esc(label) + '" title="' + esc(label) + '">' + ico("refresh") + "</button>";
  }

  function schedBtnHTML(r) {
    var id = String(r.id);
    if (byMonitor(r)) {
      var why = T("此记录由监控运行产生", "This run was produced by a monitor");
      return '<button type="button" class="rsched bymon" disabled aria-label="' + esc(why) + '" title="' + esc(why) + '">' + ico("bell") + "</button>";
    }
    return '<button type="button" class="rsched" data-sched="' + esc(id) + '" aria-label="' + esc(T("设为监控", "Schedule as monitor")) + '" title="' + esc(T("设为监控", "Schedule as monitor")) + '">' + ico("bell") + "</button>";
  }

  /* ---------------- report drawer ---------------- */
  function mount(panel, report) {
    var el = document.createElement("div");
    var id = panel.getAttribute("data-id");
    var row = (state.rows || []).filter(function (r) { return String(r.id) === id; })[0];
    el.className = "rep";
    panel.innerHTML = "";
    panel.appendChild(el);
    ZingReport.render(el, report, {
      actions: (byMonitor(row) ? [] : [
        { zh: "设为监控", en: "Schedule as monitor", primary: true, onClick: function () { schedule(id); } },
      ]).concat([
        { zh: "重新检测", en: "Re-run audit", onClick: function () { rerun(id); } },
      ]),
      download: { name: "zing-report-" + panel.getAttribute("data-id") },
    });
  }

  function fetchReport(panel, id) {
    panel.innerHTML = '<div class="state loading">' + esc(T("加载报告…", "Loading report…")) + "</div>";
    fetch("/api/history/" + encodeURIComponent(id) + "?trend=1")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (rep) {
        state.reports[id] = rep;
        if (panel.isConnected) mount(panel, rep);
      })
      .catch(function (e) {
        if (panel.isConnected)
          panel.innerHTML = '<div class="errbox">' + esc(T("无法加载这份报告：", "Could not load this report: ")) + esc(String((e && e.message) || e)) + "</div>";
      });
  }

  // Schedule a run: the server copies its configuration into a paused monitor
  // with no interval yet; the monitors page then asks for the interval (and the
  // API key, which history never stores) before it can be switched on.
  function schedule(id) {
    var btn = host.querySelector('[data-sched="' + id + '"]'), msg = document.getElementById("m-" + id);
    if (btn) btn.disabled = true;
    if (msg) msg.textContent = "";
    fetch("/api/watches/from-history/" + encodeURIComponent(id), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: ZING_LANG.get() }),
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || !j.id) throw new Error((j && j.error) || "HTTP " + r.status);
          location.href = "/v2/watches#w-" + j.id;
        });
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        if (msg) msg.textContent = T("无法设为监控：", "Could not schedule this run: ") + ZING_LANG.server(String((e && e.message) || e));
      });
  }

  function toggle(id) {
    var prev = state.open;
    if (prev != null) {
      var pb = document.getElementById("r-" + prev), pp = document.getElementById("p-" + prev);
      if (pb) pb.setAttribute("aria-expanded", "false");
      if (pp) { pp.hidden = true; pp.innerHTML = ""; }
    }
    state.open = String(prev) === id ? null : id;
    if (state.open == null) return;
    var b = document.getElementById("r-" + id), p = document.getElementById("p-" + id);
    b.setAttribute("aria-expanded", "true");
    p.hidden = false;
    if (state.reports[id]) mount(p, state.reports[id]);
    else fetchReport(p, id);
  }

  /* ---------------- delete / clear ---------------- */
  function setConfirm(what) {
    state.confirm = what;
    Array.prototype.forEach.call(host.querySelectorAll(".confirm"), function (c) {
      var mine = c.querySelector("[data-yes]").getAttribute("data-yes") === what;
      c.hidden = !mine;
      var m = c.querySelector(".msg"), y = c.querySelector("[data-yes]");
      m.textContent = m.getAttribute("data-msg"); // drop a previous error
      y.disabled = false;
    });
    Array.prototype.forEach.call(host.querySelectorAll("[aria-controls]"), function (b) {
      if (b.classList.contains("rdel") || b.id === "clr")
        b.setAttribute("aria-expanded", String(b.getAttribute("aria-controls") === (what === "all" ? "clrConfirm" : "c-" + what)));
    });
    if (what != null) {
      var c = document.getElementById(what === "all" ? "clrConfirm" : "c-" + what);
      var no = c && c.querySelector("[data-no]");
      if (no) no.focus();
    }
  }

  function doDelete(what) {
    var url = what === "all" ? "/api/history" : "/api/history/" + encodeURIComponent(what);
    var btn = host.querySelector('[data-yes="' + what + '"]');
    if (btn) btn.disabled = true;
    fetch(url, { method: "DELETE" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        state.confirm = null;
        if (what === "all") { state.reports = {}; state.open = null; state.shown = {}; }
        else delete state.reports[what];
        return load();
      })
      .then(function () {
        var first = host.querySelector(".rmain") || host.querySelector(".empty-box a");
        (first || host).focus();
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        var c = btn && btn.closest(".confirm");
        if (c) c.querySelector(".msg").textContent = T("删除失败：", "Could not delete: ") + String((e && e.message) || e);
      });
  }

  host.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t || !host.contains(t)) return;
    if (t.id === "nmreset") {
      resetFilters();
      focusFilters();
      return;
    }
    if (t.classList.contains("rmain")) return toggle(t.id.slice(2));
    if (t.hasAttribute("data-sort")) return setSort(t.getAttribute("data-sort"));
    if (t.hasAttribute("data-gkey")) return toggleGroup(t);
    if (t.id === "gall") return setAllGroups(t.getAttribute("data-all") === "expand");
    if (t.hasAttribute("data-more")) return showMore(t);
    if (t.hasAttribute("data-rerun")) return rerun(t.getAttribute("data-rerun"));
    if (t.hasAttribute("data-sched")) return schedule(t.getAttribute("data-sched"));
    if (t.classList.contains("rdel")) {
      var id = t.closest(".row").getAttribute("data-id");
      return setConfirm(state.confirm === id ? null : id);
    }
    if (t.id === "clr") return setConfirm(state.confirm === "all" ? null : "all");
    if (t.hasAttribute("data-no")) {
      var w = t.getAttribute("data-no");
      setConfirm(null);
      var back = w === "all" ? $("#clr") : host.querySelector('.row[data-id="' + w + '"] .rdel');
      if (back) back.focus();
      return;
    }
    if (t.hasAttribute("data-yes")) return doDelete(t.getAttribute("data-yes"));
  });
  host.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape" || state.confirm == null) return;
    var w = state.confirm;
    setConfirm(null);
    var back = w === "all" ? $("#clr") : host.querySelector('.row[data-id="' + w + '"] .rdel');
    if (back) back.focus();
  });

  // live language switch: re-render from cached data (no refetch); the open
  // report is re-rendered by report.js and carried over by render().
  window.addEventListener("zing:lang", function () { renderFilters(); render(); });

  load();
})();
</script>
</body>
</html>
