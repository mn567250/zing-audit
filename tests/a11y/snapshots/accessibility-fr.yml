      - code: /v2/history
      - code: /v2/watches
      - code: /v2/tools
      - code: /v2/kb
      - code: /v2/accessibility
  - region "Couverture":
    - heading "Couverture" [level=2]
    - heading "Comment les étapes sont testées" [level=3]
    - list:
      - listitem: Automatique 27 sur 44 · 61,4 %
      - listitem: Partiellement automatique 17 sur 44 · 38,6 %
      - listitem: Manuel 0 sur 44 · 0 %
      - listitem: Non applicable 6
    - heading "Résultats" [level=3]
    - list:
      - listitem: Réussi 27 sur 44 · 61,4 %
      - listitem: Échec 0 sur 44 · 0 %
      - listitem: Revue manuelle en attente 17 sur 44 · 38,6 %
      - listitem: Non testé 0 sur 44 · 0 %
      - listitem: Non applicable 6
    - paragraph: Les pourcentages portent sur les étapes applicables ; les étapes sur l'audio et la vidéo ne s'appliquent pas, car l'interface n'en contient pas.
    - paragraph: "Également vérifié au-delà des WCAG : Préférences de l'utilisateur : mode couleurs forcées (EN 301549 clause 11.7) — Réussi"
  - region "Étapes de test":
    - heading "Étapes de test" [level=2]
    - text: Statut
    - combobox "Statut":
      - option "Tous" [selected]
