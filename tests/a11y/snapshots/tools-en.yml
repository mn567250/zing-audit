- main:
  - heading "Toolbox · embedding / rerank verification" [level=1]
  - paragraph: Embedding and rerank endpoints return vectors or rankings, not chat, so they get dedicated probes instead of the chat audit.
  - list:
    - listitem: "Key signal Vector dimension vs. the claimed model: the #1 bait-and-switch signal."
    - listitem: Supporting Determinism and distinctness re-tests back it up.
    - listitem: "Rerank A known-answer probe: the obvious answer must rank first."
  - tablist "Verification type":
    - tab "Embedding audit" [selected]
    - tab "Rerank audit"
  - tabpanel "Embedding audit":
    - text: Relay / provider Optional
    - combobox "Relay / provider Optional":
      - option "Select a relay or provider…" [selected]
      - option "Other (enter the URL)"
    - text: Selecting one fills in its URL; for any other relay choose “Other” and enter the URL. Relay URL base_url
    - combobox "Relay URL base_url"
    - text: API key Supports env:VAR / file:/path
    - textbox "API key":
      - /placeholder: sk-... or env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Show key" [pressed]
    - text: Model to request model
    - textbox "Model to request model":
      - /placeholder: text-embedding-3-large
    - button "Refresh models" [disabled]
    - status: Select a relay or enter its URL, and zing lists its models.
    - text: Claimed model claimed_model Optional
    - combobox "Claimed model":
      - option "Same as the model to request" [selected]
    - button "Enter manually"
    - text: Only if the relay sells it under another name — zing checks the answers against this model. Claimed dimension claimed_dimensions Optional
    - spinbutton "Claimed dimension claimed_dimensions Optional"
    - text: Protocol
    - group "Protocol":
      - button "Auto" [pressed]
      - button "OpenAI-compatible"
    - text: Embedding and rerank endpoints only speak the OpenAI-compatible API.
    - button "Verify embedding endpoint"
    - text: Requests are sent from your local zing server; the key is only used to connect to the target relay and is never uploaded to any third party.
  - paragraph: "Embedding/rerank checks are black-box, non-chat tests: a dimension mismatch is the strongest \"bait-and-switch\" signal; determinism and distinctness are supporting evidence."
