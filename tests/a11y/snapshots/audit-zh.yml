- banner:
  - link "跳到主要内容":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - navigation "主导航":
    - link "检测":
      - /url: /v2/
    - link "工具":
      - /url: /v2/tools
    - link "检测历史":
      - /url: /v2/history
    - link "监控":
      - /url: /v2/watches
    - link "模型库":
      - /url: /v2/kb
  - link "经典界面":
    - /url: "?ui=v1"
  - combobox "主题":
    - option "跟随系统"
    - option "浅色" [selected]
    - option "深色"
  - combobox "语言":
    - option "English"
    - option "中文" [selected]
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - paragraph: 本地运行 · 密钥不经手
- main:
  - list "检测进度":
    - listitem: 配置
    - listitem: 检测
    - listitem: 报告
  - region "这家中转站，给的是真货吗？":
    - heading "这家中转站，给的是真货吗？" [level=1]
    - paragraph: 填入中转站地址和它声称的模型，zing 在你本地跑一整套黑盒检测，出一份能看懂、有依据的验真报告。
    - text: 中转站地址 base_url
    - textbox "中转站地址 base_url":
      - /placeholder: https://relay.example.com/v1
    - text: API 密钥 支持 env:VAR / file:/path
    - textbox "API 密钥":
      - /placeholder: sk-... 或 env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "显示密钥" [pressed]
    - text: 请求的模型 model
    - combobox "请求的模型 供应商":
      - option "选择供应商…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "自定义（从中转站获取）"
    - button "获取模型列表" [disabled]
    - status
    - combobox "请求的模型 模型" [disabled]:
      - option "选择模型…" [selected]
    - button "自定义输入"
    - text: 声称的模型 claimed_model 可选
    - textbox "声称的模型 claimed_model 可选":
      - /placeholder: 留空 = 同请求的模型
    - text: 仅当中转站以另一个名字售卖时填写 —— zing 会按这个模型核对回答。 声明的厂商 declared_provider 可选
    - textbox "声明的厂商 declared_provider 可选":
      - /placeholder: 如 openai / deepseek
    - text: 当仅凭模型名无法确定厂商时，帮助 zing 选对模型资料。从列表选择模型时会自动填写。 协议
    - group "协议":
      - button "自动" [pressed]
      - button "OpenAI"
      - button "Anthropic"
      - button "Responses"
    - text: 检测套件
    - group "检测套件":
      - button "smoke"
      - button "standard" [pressed]
      - button "deep"
      - button "full"
      - button "自定义"
    - text: 性能探测请求
    - group "性能探测请求":
      - button "流式" [pressed]
      - button "非流式"
    - text: standard 套件只在对照基线时发送探测请求；否则使用检测自身的请求。
    - button "对照可信基线 compare" [expanded]
    - paragraph: 填一个你信任的同款模型端点（如官方 API）。zing 会用它佐证目标的表现，让替换/降级判定更可靠——质量评审与篡改检测在有基线时才会升到最高级别。
    - text: 基线地址 base_url
    - textbox "基线地址 base_url":
      - /placeholder: https://api.openai.com/v1
    - text: 基线 API 密钥
    - textbox "基线 API 密钥":
      - /placeholder: sk-... 或 env:OPENAI_API_KEY
    - button "显示密钥"
    - text: 基线模型 model
    - combobox "基线模型 供应商":
      - option "选择供应商…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "自定义（从中转站获取）"
    - button "获取模型列表" [disabled]
    - status
    - combobox "基线模型 模型" [disabled]:
      - option "选择模型…" [selected]
    - button "自定义输入"
    - text: 基线协议
    - group "基线协议":
      - button "自动" [pressed]
      - button "OpenAI"
      - button "Anthropic"
      - button "Responses"
    - button "开始检测"
    - text: 检测在 你本地的 zing 服务 发起，密钥只用于连接目标中转站，不上传任何第三方。
    - alert
    - status
    - text: zing 给出的是风险与偏离的可复现证据，不是法律结论。
