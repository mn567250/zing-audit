name: CI

on:
  push:
    branches: [main, a11y/integration]
  pull_request:
    branches: [main, a11y/integration]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,tokenizers,web]'

      - name: Lint (ruff)
        run: ruff check zing tests

      - name: Type-check (mypy)
        run: mypy zing

      - name: Test (pytest)
        run: pytest -q

  a11y:
    # Browser accessibility tests of web UI v2 (BITV 2.0 / EN 301 549 /
    # WCAG 2.1 AA), see docs/ACCESSIBILITY.md. Informational for now:
    # continue-on-error keeps known violations from failing the run. Drop it
    # (and make the check required) once the suite is green.
    name: accessibility (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # only whether the secret exists; the key itself is passed to one step
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,a11y]' pytest-xdist
          playwright install --with-deps chromium
      - name: Test (pytest -m a11y)
        env:
          # per-step results for the BITV conformance report (tests/a11y/results.py)
          ZING_A11Y_RESULTS: a11y-results.json
        run: pytest tests/a11y -m a11y -n auto -q -p no:cacheprovider
      - name: Conformance report (bitv-report.json)
        if: always()
        run: python -m tests.a11y.conformance --results a11y-results.json --out bitv-report.json
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y-report*.json
            a11y-results.json
            bitv-report.json
          if-no-files-found: ignore
      # Optional advisory LLM review of texts (tests/a11y/README.md); runs
      # only when the ANTHROPIC_API_KEY secret is configured, never blocks.
      - name: LLM review (advisory)
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m tests.a11y.llm_review --out a11y-llm-review.json
      - name: Upload LLM review
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a11y-llm-review
          path: a11y-llm-review.json
          if-no-files-found: ignore

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: python -m pip install --upgrade build && python -m build
      - name: Verify the wheel imports and loads the knowledge base
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/zing --version
          /tmp/verify/bin/zing kb >/dev/null
