    - definition: 1109 exécutés, 1109 réussis, 0 échoués, 0 ignorés
    - term: Langues
    - definition: English, Deutsch, Español, Français, Italiano, Português, 中文
    - term: Thèmes
    - definition: Clair, Sombre
    - term: Pages
