- main:
  - heading "检测历史与趋势" [level=1]
  - paragraph: 这里是你在本机跑过的每一次验真。按「中转站 + 声称模型」分组，附一条健康分趋势曲线；点任意一行可展开当时那份报告。
  - paragraph:
    - text: 历史只保存在
    - code: ~/.zing
    - text: 下的本地 SQLite 文件里，不会上传。
  - region "筛选":
