      - option "Manuell"
      - option "Überwachung"
    - group "Trends":
      - text: Trends
      - button "Score" [pressed]
      - button "Note"
      - button "Latenz p50" [pressed]
      - button "Tokens/s"
    - text: 15 von 15 Prüfungen
