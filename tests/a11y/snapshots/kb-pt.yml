- banner:
  - link "Saltar para o conteúdo principal":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - navigation "Navegação principal":
    - link "Auditoria":
      - /url: /v2/
    - link "Ferramentas":
      - /url: /v2/tools
    - link "Histórico":
      - /url: /v2/history
    - link "Monitores":
      - /url: /v2/watches
    - link "Modelos":
      - /url: /v2/kb
  - link "Interface clássica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automático"
    - option "Claro" [selected]
    - option "Escuro"
  - combobox "Idioma":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português" [selected]
    - option "Italiano"
    - option "Deutsch"
  - paragraph: Execução local · as chaves nunca saem
- main:
  - heading "A base de conhecimento usada pelo zing" [level=1]
  - paragraph:
    - text: "Cada auditoria compara um relay com o perfil do modelo que ele declara: janela de contexto, limite de saída, capacidades, identidade e impressões comportamentais. Navegue pelos perfis aqui e adicione seus próprios modelos — sem arquivos YAML nem instalação editável. Suas entradas ficam em kb.db nesta máquina e são usadas tanto pela interface web quanto pelo"
    - code: zing check
    - text: .
  - region "Adicionar um modelo":
    - heading "Adicionar um modelo" [level=2]
    - paragraph: Deixe um assistente de IA pesquisar o modelo e verifique a resposta aqui antes de salvá-la.
    - heading "1 Copiar o prompt de pesquisa" [level=3]
    - text: ID do modelo id
    - textbox "ID do modelo id":
      - /placeholder: "ex.: example-large-2"
    - text: Provedor Opcional
    - textbox "Provedor Opcional":
      - /placeholder: p. ex. openai / deepseek
    - button "Copiar prompt"
    - status
    - group:
      - text: Mostrar o prompt
      - textbox "Prompt"
    - paragraph: Cole-o no assistente de IA de sua escolha. Ele responde com um documento YAML.
    - heading "2 Enviar ou colar o YAML" [level=3]
    - text: YAML do perfil
    - textbox "YAML do perfil":
      - /placeholder: "provider: …\nmodels:\n- id: …"
    - text: Escolher um arquivo .yaml
    - heading "3 Verificar e salvar" [level=3]
    - paragraph: A verificação valida o esquema e os limites, sinaliza expressões regulares inseguras, lista cada prompt que o zing enviaria aos relays e mostra quais IDs de modelo seriam resolvidos de outra forma. Nada é salvo até você salvar.
    - button "Verificação"
    - button "Salvar na base" [disabled]
  - region "Qual perfil um ID de modelo usa?":
    - heading "Qual perfil um ID de modelo usa?" [level=2]
    - textbox "ID do modelo":
      - /placeholder: "ex.: gpt-4o"
    - button "Consultar"
    - status
  - heading "Suas entradas" [level=2]
  - link "Exportar como YAML":
    - /url: /api/kb/export
  - paragraph: Ainda não há entradas suas. Use os passos acima para adicionar seu primeiro modelo.
  - heading "Todos os perfis 98 modelos" [level=2]
  - searchbox "Filtrar"
