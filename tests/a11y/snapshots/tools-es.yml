- banner:
  - link "Saltar al contenido principal":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - navigation "Navegación principal":
    - link "Auditoría":
      - /url: /v2/
    - link "Herramientas":
      - /url: /v2/tools
    - link "Historial":
      - /url: /v2/history
    - link "Monitores":
      - /url: /v2/watches
    - link "Modelos":
      - /url: /v2/kb
  - link "Interfaz clásica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automático"
    - option "Claro" [selected]
    - option "Oscuro"
  - combobox "Idioma":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español" [selected]
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - paragraph: Se ejecuta en local · las claves nunca salen
- main:
  - heading "Herramientas · verificación de embeddings / rerank" [level=1]
  - paragraph: Los endpoints de embeddings y rerank devuelven vectores o clasificaciones, no chat, así que tienen sondas propias en lugar de la auditoría de chat.
  - list:
    - listitem: "Señal clave Dimensión de los vectores frente al modelo declarado: la señal n.º 1 de gato por liebre."
    - listitem: Complementario Las repeticiones de determinismo y distinción lo respaldan.
    - listitem: "Rerank Una sonda de respuesta conocida: la respuesta obvia debe quedar primera."
  - tablist "Tipo de verificación":
    - tab "Auditoría de embeddings" [selected]
    - tab "Auditoría de rerank"
  - tabpanel "Auditoría de embeddings":
    - text: URL del intermediario base_url
    - textbox "URL del intermediario base_url":
      - /placeholder: https://relay.example.com/v1
    - text: Clave de API Admite env:VAR / file:/ruta
    - textbox "Clave de API":
      - /placeholder: sk-... o env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Mostrar clave" [pressed]
    - text: Modelo solicitado model
    - combobox "Modelo solicitado proveedor":
      - option "Seleccione proveedor…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "Personalizado (desde el relay)"
    - button "Obtener modelos" [disabled]
    - status
    - combobox "Modelo solicitado modelo" [disabled]:
      - option "Seleccione modelo…" [selected]
    - button "Entrada personalizada"
    - text: Modelo declarado claimed_model Opcional
    - textbox "Modelo declarado claimed_model Opcional":
      - /placeholder: Vacío = igual que el modelo solicitado
    - text: Solo si el intermediario lo vende con otro nombre — zing contrasta las respuestas con este modelo. Dimensión declarada claimed_dimensions Opcional
    - spinbutton "Dimensión declarada claimed_dimensions Opcional"
    - text: Proveedor declarado declared_provider Opcional
    - textbox "Proveedor declarado declared_provider Opcional":
      - /placeholder: p. ej. openai / deepseek
    - text: Ayuda a zing a elegir el perfil de modelo correcto cuando el nombre del modelo por sí solo es ambiguo. Elegir un modelo de la lista lo rellena. Protocolo
    - group "Protocolo":
      - button "Auto" [pressed]
      - button "Compatible con OpenAI"
    - text: Los endpoints de embeddings y rerank solo hablan la API compatible con OpenAI.
    - button "Verificar endpoint de embeddings"
    - text: Las peticiones se envían desde su servidor zing local; la clave solo se usa para conectar con el intermediario objetivo y nunca se envía a terceros.
  - paragraph: "Las comprobaciones de embeddings/rerank son pruebas de caja negra sin chat: una dimensión incorrecta es la señal más fuerte de «gato por liebre»; el determinismo y la distinción son evidencias de apoyo."
