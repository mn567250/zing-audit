  - region "Declaração de acessibilidade":
    - heading "Declaração de acessibilidade" [level=2]
    - heading "Estado de conformidade" [level=3]
    - paragraph: A interface web v2 do zing é parcialmente conforme com a BITV 2.0, a EN 301 549 e as WCAG 2.1 nível AA.
    - heading "Limitações conhecidas" [level=3]
    - paragraph: "Estes passos ainda não foram testados:"
    - list:
      - listitem: 9.1.3.2 Sequência com significado
      - listitem: 9.1.3.3 Características sensoriais
      - listitem: 9.1.4.5 Imagens de texto
      - listitem: 9.2.1.4 Atalhos de teclado por caráter
      - listitem: 9.2.2.1 Tempo ajustável
      - listitem: 9.2.3.1 Três flashes ou abaixo do limite
      - listitem: 9.2.4.5 Várias formas
      - listitem: 9.2.5.1 Gestos de ponteiro
      - listitem: 9.2.5.2 Cancelamento de ponteiro
      - listitem: 9.2.5.4 Atuação por movimento
      - listitem: 9.3.2.2 Na introdução de dados
      - listitem: 9.3.3.4 Prevenção de erros (legais, financeiros, de dados)
      - listitem: 9.4.1.1 Análise sintática
      - listitem: 9.4.1.3 Mensagens de estado
    - paragraph: "A parte automatizada destes passos é aprovada; o resto ainda precisa de uma revisão manual:"
    - list:
      - listitem: 9.1.1.1 Conteúdo não textual
      - listitem: 9.1.3.1 Informações e relações
      - listitem: 9.1.4.1 Utilização da cor
      - listitem: 9.1.4.11 Contraste não textual
      - listitem: 9.2.4.3 Ordem do foco
      - listitem: 9.2.4.4 Finalidade da ligação (em contexto)
      - listitem: 9.2.4.6 Cabeçalhos e etiquetas
      - listitem: 9.3.3.1 Identificação de erros
      - listitem: 9.3.3.2 Etiquetas ou instruções
      - listitem: 9.3.3.3 Sugestão de erro
    - heading "Como foi avaliado" [level=3]
    - paragraph:
      - text: "Autoavaliação: a cada alteração, o conjunto de testes automatizados em"
      - code: tests/a11y
      - text: verifica cada página da interface web v2 num navegador real (Chromium, com axe-core e verificações próprias) em todos os idiomas da interface e nos temas claro e escuro. Cada teste indica os passos de teste que decide.
    - paragraph: "Última execução dos testes: 4 de outubro de 2026 às 18:04. Ainda não foi feita uma revisão manual, incluindo leitores de ecrã."
    - heading "Comentários" [level=3]
    - paragraph:
      - text: "Encontrou uma barreira ou algo é difícil de usar com tecnologias de apoio? Diga-nos:"
      - link "comunicar um problema de acessibilidade no GitHub":
        - /url: https://github.com/cenbonew/zing/issues
