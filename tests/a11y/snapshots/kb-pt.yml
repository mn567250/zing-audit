      - /url: /v2/kb
  - paragraph: Execução local · as chaves nunca saem
- main:
  - heading "A base de conhecimento usada pelo zing" [level=1]
  - paragraph:
    - text: "Cada auditoria compara um relay com o perfil do modelo que ele declara: janela de contexto, limite de saída, capacidades, identidade e impressões comportamentais. Aqui encontra cada modelo, provedor e relay que o zing conhece — os incluídos e os seus — e pode ativar ou desativar cada um ou adicionar os seus. As suas alterações são guardadas em kb.db nesta máquina e usadas tanto pela interface web como pelo"
    - code: zing check
    - text: .
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: ID do modelo
    - combobox "ID do modelo":
      - option "Todos" [selected]
    - text: Provedor
    - combobox "Provedor":
      - option "Todos" [selected]
      - option "Anthropic (Claude)"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
    - text: Relay
    - combobox "Relay":
      - option "Todos" [selected]
      - option "Example Relay"
    - text: Origem
    - combobox "Origem":
      - option "Todos" [selected]
      - option "Incluído"
      - option "Seu"
    - status: A mostrar 98 de 98 modelos · 7 de 7 provedores · 1 de 1 relays
  - link "Exportar as suas entradas como YAML":
    - /url: /api/kb/export
  - tablist "Secções da base de conhecimento":
    - tab "Modelos" [selected]
    - tab "Provedores"
    - tab "Relays"
  - tabpanel "Modelos":
    - heading "Todos os modelos 98 modelos" [level=2]
    - paragraph: "Os perfis de modelo com que as auditorias comparam. Um modelo desativado deixa de ser resolvido: as suas auditorias correm sem perfil."
    - group:
      - text: Adicionar um modelo
      - paragraph: Deixe um assistente de IA pesquisar o modelo e verifique a resposta aqui antes de salvá-la.
      - heading "1 Copiar o prompt de pesquisa" [level=3]
      - text: ID do modelo id
      - textbox "ID do modelo id":
        - /placeholder: "ex.: example-large-2"
      - text: Provedor Opcional
      - textbox "Provedor Opcional":
        - /placeholder: p. ex. openai / deepseek
      - button "Copiar prompt"
      - status
      - group:
        - text: Mostrar o prompt
        - textbox "Prompt"
      - paragraph: Cole-o no assistente de IA de sua escolha. Ele responde com um documento YAML.
      - heading "2 Enviar ou colar o YAML" [level=3]
      - text: YAML do perfil
      - textbox "YAML do perfil":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Escolher um arquivo .yaml
      - heading "3 Verificar e salvar" [level=3]
      - paragraph: A verificação valida o esquema e os limites, sinaliza expressões regulares inseguras, lista cada prompt que o zing enviaria aos relays e mostra quais IDs de modelo seriam resolvidos de outra forma. Nada é salvo até você salvar.
      - button "Verificação"
      - button "Salvar na base" [disabled]
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 14 modelos
      - list:
        - listitem:
          - code: claude-opus-4-8
          - text: Incluído Contexto 1000000 Saída máx. 128000 Aliases
          - code: claude-opus-4-8
          - text: ","
          - code: opus
          - text: ","
          - code: opus 4.8
          - text: ","
          - code: most powerful
          - switch "claude-opus-4-8 Ativo" [checked]
          - emphasis: Ativo
        # … more items of the same shape
    # … more items of the same shape
