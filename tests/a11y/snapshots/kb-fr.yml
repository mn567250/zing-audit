  - paragraph: Exécution locale · les clés ne sortent jamais
- main:
  - heading "La base de connaissances utilisée par zing" [level=1]
  - paragraph:
    - text: "Chaque audit compare un relais au profil du modèle qu’il annonce : fenêtre de contexte, limite de sortie, capacités, identité et empreintes comportementales. Parcourez les profils ici et ajoutez vos propres modèles — sans fichiers YAML ni installation modifiable. Vos entrées sont enregistrées dans kb.db sur cette machine et utilisées aussi bien par l’interface web que par"
    - code: zing check
    - text: .
  - region "Ajouter un modèle":
    - heading "Ajouter un modèle" [level=2]
    - paragraph: Laissez un assistant IA se renseigner sur le modèle, puis vérifiez sa réponse ici avant qu’elle soit enregistrée.
    - heading "1 Copier le prompt de recherche" [level=3]
    - text: Identifiant du modèle id
    - textbox "Identifiant du modèle id":
      - /placeholder: p. ex. example-large-2
    - text: Fournisseur Facultatif
    - textbox "Fournisseur Facultatif":
      - /placeholder: p. ex. openai / deepseek
    - button "Copier le prompt"
    - status
    - group:
      - text: Afficher le prompt
      - textbox "Prompt"
    - paragraph: Collez-le dans l’assistant IA de votre choix. Il répond avec un document YAML.
    - heading "2 Importer ou coller le YAML" [level=3]
    - text: YAML du profil
    - textbox "YAML du profil":
      - /placeholder: "provider: …\nmodels:\n- id: …"
    - text: Choisir un fichier .yaml
    - heading "3 Vérifier et enregistrer" [level=3]
    - paragraph: La vérification valide le schéma et les limites, signale les expressions régulières dangereuses, liste chaque prompt que zing enverrait aux relais et montre quels identifiants de modèle seraient résolus différemment. Rien n’est enregistré avant que vous n’enregistriez.
    - button "Contrôle"
    - button "Enregistrer dans la base" [disabled]
  - region "Quel profil un identifiant de modèle utilise-t-il ?":
    - heading "Quel profil un identifiant de modèle utilise-t-il ?" [level=2]
    - textbox "Identifiant du modèle":
      - /placeholder: p. ex. gpt-4o
    - button "Rechercher"
    - status
  - heading "Vos entrées" [level=2]
  - link "Exporter en YAML":
    - /url: /api/kb/export
  - paragraph: Aucune entrée personnelle pour l’instant. Suivez les étapes ci-dessus pour ajouter votre premier modèle.
  - heading "Tous les profils 98 modèles" [level=2]
