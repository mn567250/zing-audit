- banner:
  - link "Saltar al contenido principal":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "Interfaz clásica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automático"
    - option "Claro" [selected]
    - option "Oscuro"
  - combobox "Animación":
    - option "Animación activada" [selected]
    - option "Animación desactivada"
  - combobox "Idioma":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español" [selected]
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "Accesibilidad":
    - /url: /v2/accessibility
  - navigation "Navegación principal":
    - link "Auditoría":
      - /url: /v2/
    - link "Historial":
      - /url: /v2/history
    - link "Analítica":
      - /url: /v2/analytics
    - link "Monitores":
      - /url: /v2/watches
    - link "Conocimiento":
      - /url: /v2/kb
  - paragraph: Se ejecuta en local · las claves nunca salen
- main:
  - heading "La base de conocimiento con la que audita zing" [level=1]
  - paragraph:
    - text: "Cada auditoría compara un relay con el perfil del modelo que declara: ventana de contexto, límite de salida, capacidades, identidad y huellas de comportamiento. Aquí encuentras cada modelo, proveedor y relay que zing conoce —los incluidos y los tuyos— y puedes activar o desactivar cada uno o añadir los tuyos. Tus cambios se guardan en kb.db en este equipo y los usan tanto la interfaz web como"
    - code: zing check
    - text: .
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: ID del modelo
    - combobox "ID del modelo":
      - option "Todos" [selected]
    - text: Proveedor
    - combobox "Proveedor":
      - option "Todos" [selected]
      - option "Anthropic (Claude)"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
    - text: Relay
    - combobox "Relay":
      - option "Todos" [selected]
      - option "Example Relay"
    - text: Origen
    - combobox "Origen":
      - option "Todos" [selected]
      - option "Incluido"
      - option "Tuyo"
    - status: Se muestran 98 de 98 modelos · 7 de 7 proveedores · 1 de 1 relays
  - link "Exportar tus entradas como YAML":
    - /url: /api/kb/export
  - tablist "Secciones de la base de conocimiento":
    - tab "Modelos" [selected]
    - tab "Proveedores"
    - tab "Relays"
  - tabpanel "Modelos":
    - heading "Todos los modelos 98 modelos" [level=2]
    - paragraph: "Los perfiles de modelo con los que comparan las auditorías. Un modelo desactivado ya no se resuelve: sus auditorías se ejecutan sin perfil."
    - group:
      - text: Añadir un modelo
      - paragraph: Deja que un asistente de IA investigue el modelo y comprueba aquí su respuesta antes de guardarla.
      - heading "1 Copiar el prompt de investigación" [level=3]
      - text: ID del modelo id
      - textbox "ID del modelo id":
        - /placeholder: p. ej. example-large-2
      - text: Proveedor Opcional
      - textbox "Proveedor Opcional":
        - /placeholder: p. ej. openai / deepseek
      - button "Copiar prompt"
      - status
      - group:
        - text: Mostrar el prompt
        - textbox "Prompt"
      - paragraph: Pégalo en el asistente de IA que prefieras. Responde con un documento YAML.
      - heading "2 Subir o pegar el YAML" [level=3]
      - text: YAML del perfil
      - textbox "YAML del perfil":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Elegir un archivo .yaml
      - heading "3 Comprobar y guardar" [level=3]
      - paragraph: La comprobación valida el esquema y los límites, marca expresiones regulares inseguras, lista cada prompt que zing enviaría a los relays y muestra qué ID de modelo se resolverían de otra forma. No se guarda nada hasta que guardes.
      - button "Comprobación"
      - button "Guardar en la base" [disabled]
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 14 modelos
      - list:
        - listitem:
          - code: claude-opus-4-8
          - text: Incluido Contexto 1000000 Salida máx. 128000 Alias
          - code: claude-opus-4-8
          - text: ","
          - code: opus
          - text: ","
          - code: opus 4.8
          - text: ","
          - code: most powerful
          - switch "claude-opus-4-8 Activo" [checked]
          - emphasis: Activo
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph:
    - text: zing · verificación de relays · los perfiles incluidos están en
    - code: zing/knowledge/data
    - text: ;
    - code: ZING_KB_DIR
    - text: y tus entradas se superponen
