      - table "Étapes de test BITV / EN 301549 avec niveau d'automatisation et résultat":
        - caption: Étapes de test BITV / EN 301549 avec niveau d'automatisation et résultat
        - rowgroup:
          - row "Étape Titre Niveau Automatisation Statut":
            - columnheader "Étape"
            - columnheader "Titre"
            - columnheader "Niveau"
            - columnheader "Automatisation"
            - columnheader "Statut"
        - rowgroup:
          - row "9.1.1.1 A Partiellement automatique Revue manuelle en attente":
