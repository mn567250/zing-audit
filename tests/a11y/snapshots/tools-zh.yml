- banner:
  - link "跳到主要内容":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "经典界面":
    - /url: "?ui=v1"
  - combobox "主题":
    - option "跟随系统"
    - option "浅色" [selected]
    - option "深色"
  - combobox "语言":
    - option "English"
    - option "中文" [selected]
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - navigation "主导航":
    - link "检测":
      - /url: /v2/
    - link "工具":
      - /url: /v2/tools
    - link "检测历史":
      - /url: /v2/history
    - link "监控":
      - /url: /v2/watches
    - link "模型库":
      - /url: /v2/kb
  - paragraph: 本地运行 · 密钥不经手
- main:
  - heading "工具箱 · 嵌入 / 重排验真" [level=1]
  - paragraph: 嵌入和重排端点返回的是向量或排名而非对话，因此不走对话检测，而用专门的探针核验。
  - list:
    - listitem: 关键信号 对照所声称模型的向量维度：货不对板的头号信号。
    - listitem: 辅助 确定性与可区分性复测作为佐证。
    - listitem: 重排 用已知答案探针：显而易见的答案必须排在首位。
  - tablist "验真类型":
    - tab "嵌入审计" [selected]
    - tab "重排审计"
  - tabpanel "嵌入审计":
    - text: 中转站地址 base_url
    - textbox "中转站地址 base_url":
      - /placeholder: https://relay.example.com/v1
    - text: API 密钥 支持 env:VAR / file:/path
    - textbox "API 密钥":
      - /placeholder: sk-... 或 env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "显示密钥" [pressed]
    - text: 请求的模型 model
    - combobox "请求的模型 供应商":
      - option "选择供应商…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "自定义（从中转站获取）"
    - button "获取模型列表" [disabled]
    - status
    - combobox "请求的模型 模型" [disabled]:
      - option "选择模型…" [selected]
    - button "自定义输入"
    - text: 声称的模型 claimed_model 可选
    - textbox "声称的模型 claimed_model 可选":
      - /placeholder: 留空 = 同请求的模型
    - text: 仅当中转站以另一个名字售卖时填写 —— zing 会按这个模型核对回答。 声称维度 claimed_dimensions 可选
    - spinbutton "声称维度 claimed_dimensions 可选"
    - text: 声明的厂商 declared_provider 可选
    - textbox "声明的厂商 declared_provider 可选":
      - /placeholder: 如 openai / deepseek
    - text: 当仅凭模型名无法确定厂商时，帮助 zing 选对模型资料。从列表选择模型时会自动填写。 协议
    - group "协议":
      - button "自动" [pressed]
      - button "OpenAI 兼容"
    - text: 嵌入与重排端点只走 OpenAI 兼容接口。
    - button "核验嵌入端点"
    - text: 请求在 你本地的 zing 服务 发起，密钥只用于连接目标中转站，不上传任何第三方。
  - paragraph: 嵌入/重排是黑盒非对话检测：维度不符是最强的“货不对板”信号；确定性与可区分性是辅助证据。
- contentinfo:
  - paragraph:
    - link "无障碍":
      - /url: /v2/accessibility
