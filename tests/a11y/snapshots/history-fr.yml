- main:
  - heading "Historique et tendances des audits" [level=1]
  - paragraph: Toutes les vérifications lancées sur cette machine, regroupées par « relais + modèle annoncé », avec une courbe d'évolution du score de santé ; cliquez sur une ligne pour déplier le rapport.
  - paragraph:
    - text: L'historique reste uniquement dans un fichier SQLite local sous
    - code: ~/.zing
    - text: — rien n'est transmis.
  - region "Filtres":
    - button "Filtres" [expanded]
    - text: Rechercher
    - searchbox "Rechercher"
    - text: Type de point d'accès
    - combobox "Type de point d'accès":
      - option "Tous" [selected]
      - option "Chat"
    - text: Relais / fournisseur
    - combobox "Relais / fournisseur":
