  - paragraph: Execução local · as chaves nunca saem
- main:
  - heading "Ferramentas · verificação de embeddings / rerank" [level=1]
  - paragraph: Os endpoints de embeddings e rerank devolvem vetores ou classificações, não chat, por isso têm sondas próprias em vez da auditoria de chat.
  - list:
    - listitem: "Sinal-chave Dimensão dos vetores face ao modelo declarado: o sinal n.º 1 de gato por lebre."
    - listitem: Complementar Os testes repetidos de determinismo e distinção confirmam-no.
    - listitem: "Rerank Uma sonda de resposta conhecida: a resposta óbvia tem de ficar em primeiro."
  - tablist "Tipo de verificação":
    - tab "Auditoria de embeddings" [selected]
    - tab "Auditoria de rerank"
  - tabpanel "Auditoria de embeddings":
    - text: Relay / provedor Opcional
    - combobox "Relay / provedor Opcional":
      - option "Selecione um relay ou provedor…" [selected]
      - option "Outro (introduzir o URL)"
    - text: Ao selecionar um, o URL é preenchido; para qualquer outro relay escolha «Outro» e introduza o URL. URL do intermediário base_url
    - combobox "URL do intermediário base_url"
    - text: Chave de API Aceita env:VAR / file:/caminho
    - textbox "Chave de API":
      - /placeholder: sk-... ou env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Mostrar chave" [pressed]
    - text: Modelo pedido model
    - textbox "Modelo pedido model":
      - /placeholder: text-embedding-3-large
    - button "Atualizar modelos" [disabled]
    - status: Selecione um relay ou introduza o seu URL, e o zing lista os seus modelos.
    - text: Modelo declarado claimed_model Opcional
    - combobox "Modelo declarado":
      - option "Igual ao modelo pedido" [selected]
    - button "Introduzir manualmente"
    - text: Só se o intermediário o vender com outro nome — o zing confronta as respostas com este modelo. Dimensão declarada claimed_dimensions Opcional
    - spinbutton "Dimensão declarada claimed_dimensions Opcional"
    - text: Protocolo
    - group "Protocolo":
      - button "Auto" [pressed]
      - button "Compatível com OpenAI"
    - text: Os endpoints de embeddings e rerank só falam a API compatível com OpenAI.
    - button "Verificar endpoint de embeddings"
    - text: Os pedidos são enviados a partir do seu servidor zing local; a chave só é usada para ligar ao intermediário alvo e nunca é enviada a terceiros.
  - paragraph: "As verificações de embeddings/rerank são testes de caixa preta sem chat: uma dimensão errada é o sinal mais forte de «gato por lebre»; o determinismo e a distinção são evidências de apoio."
