<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-en="zing — audit history">zing — 检测历史</title>
<script src="/locales.js"></script>
<script src="/lang.js"></script>
<script src="/v2/static/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/v2/static/zing.css" />
<link rel="stylesheet" href="/v2/static/report.css" />
<link rel="stylesheet" href="/v2/static/perf.css" />
<style>
  /* History page. Tokens only (zing.css); light + dark.
   *
   * Every group shares ONE column grid (--cols), so Risk / Score / Grade line
   * up across relays. Below 600px each row stacks instead (no h-scroll).
   *
   * Grade letter colour (by grade, not by risk):
   *   A, B -> good · C -> sky · D -> warn · E, F -> bad · none -> grey.
   * Scores (row score, trend value, sparkline) use the same families through
   * the grade thresholds of zing/scoring.py (>=80 good, >=70 sky, >=60 warn). */
  /* Columns: time (with mode / suite under it) · risk · score · grade · chevron.
     Mode sits under the date instead of in its own column so the longest date
     ("Sep 29, 2026, 3:40 PM") and risk label (DE "Abweichungen gefunden", FR
     "Tromperie sur la marchandise") of every language stay on one line. */
  .hist { --cols: minmax(0, 1.1fr) minmax(0, 1.5fr) 2.8em 2.6em 18px; --cgap: 12px; --del: 36px; }
  .local-note { display: flex; align-items: center; gap: 7px; margin: 12px 0 0; font-size: 12.5px; color: var(--faint); line-height: 1.5; }
  .local-note .zicon { width: 13px; height: 13px; flex: none; }
  .local-note code { font-size: 11.5px; color: var(--ink2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

  /* in progress: background audits and running monitors (/api/jobs) */
  .jobs { margin-top: 22px; padding: 16px 18px 14px; }
  .jobs[hidden] { display: none; }
  .jobs h2 { font-family: var(--disp); font-weight: 600; font-size: 16px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  .jobs .jh { font-size: 12.5px; color: var(--faint); margin: 0 0 10px; line-height: 1.5; }
  .jlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .job { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .job .jmain { flex: 1 1 260px; min-width: 0; }
  .job .jt { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
  .job .jt .key { margin-left: 6px; }
  .job .ju { font-family: var(--mono); font-size: 12px; color: var(--ink2); overflow-wrap: anywhere; margin-top: 2px; }
  .job .js { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
  .job .js b { color: var(--ink); }
  .job.err .js { color: var(--bad); }
  .job .jprog { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--sky); }
  .job .jprog .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--skybg); overflow: hidden; }
  .job .jprog .bar > span { display: block; height: 100%; background: var(--sky); border-radius: 3px; transition: width .4s ease; }
  .job .jprog .bar.q > span { width: 30% !important; opacity: .5; animation: job-wait 1.6s ease-in-out infinite alternate; }
  @keyframes job-wait { from { margin-left: 0; } to { margin-left: 70%; } }
  .job .jprog b { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .job .jact { display: flex; gap: 6px; flex-wrap: wrap; }

  .hist { margin-top: 22px; overflow: hidden; }
  .hist:focus { outline: none; }
  .hist .state { padding: 26px 22px; color: var(--ink2); font-size: 14px; }
  .hist .state.loading { font-family: var(--mono); font-size: 13px; color: var(--faint); }
  .hist .errbox { margin: 18px; }

  /* shared column header */
  .colhead { display: grid; grid-template-columns: 1fr calc(var(--del) * 3 + 12px); gap: 6px; padding: 12px 18px 8px; border-bottom: 1px solid var(--line); }
  .colhead .cells { display: grid; grid-template-columns: var(--cols); gap: var(--cgap); padding: 0 10px; }
  .colhead span { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .colhead .n { text-align: right; }

  /* group */
  .grp-h { display: flex; align-items: center; gap: 14px; padding: 18px 18px 8px 28px; flex-wrap: wrap; }
  .group + .group { border-top: 1px solid var(--line); }
  .gtitle { flex: 1 1 220px; min-width: 0; }
  .gtitle h2 { font-family: var(--disp); font-weight: 600; font-size: 17px; letter-spacing: -0.3px; margin: 0; overflow-wrap: anywhere; }
  .gtitle .gu { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
  .gtitle .gu span { font-family: var(--mono); font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .gtitle .key { flex: none; }
  /* group trends: score + latency p50, each "caption / sparkline + value" */
  .trend { display: flex; align-items: stretch; gap: 16px; flex: 0 0 auto; margin-left: auto; }
  .tr { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .tr + .tr { padding-left: 16px; border-left: 1px solid var(--line); }
  .tr .tl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .tr .tv { display: flex; align-items: center; gap: 9px; }
  .tr .tv b { color: inherit; font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tr .tv b small { font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: 0; margin-left: 2px; }
  .trend svg { display: block; overflow: visible; }
  .trend .area { fill: currentColor; opacity: 0.14; }
  .trend .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .trend .base { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 3; }
  .trend .dot { fill: currentColor; }

  /* filter bar */
  .filters { margin-top: 22px; padding: 14px 18px 16px; }
  .filters[hidden] { display: none; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; align-items: end; }
  .fgrid .fq { grid-column: 1 / -1; }
  @media (min-width: 700px) { .fgrid .fq { grid-column: auto; } }
  .fgrid label { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fgrid label > span { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fgrid .in { font-size: 13.5px; padding: 8px 11px; border-radius: 10px; }
  .fgrid select.in { padding-right: 30px; background-position: right 16px center, right 11px center; }
  .tsel { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .tsel > span { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
  .tsel button {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-family: var(--sans); font-weight: 600; font-size: 12.5px;
    color: var(--ink2); background: var(--field); border: 1.5px solid var(--line); border-radius: var(--r-pill); padding: 5px 11px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tsel button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
  .tsel button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .tsel button[aria-pressed="true"]::before { background: currentColor; }
  .tsel button:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
  .tsel button[aria-pressed="true"]:hover:not(:disabled) { border-color: var(--ink); }
  .tsel button:disabled { cursor: not-allowed; opacity: 0.7; }
  .ffoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
  .ffoot .linkbtn { font-size: 12.5px; font-weight: 600; }
  .ffoot .linkbtn[hidden] { display: none; }
  .nomatch { text-align: center; padding: 36px 22px; color: var(--ink2); font-size: 14.5px; }
  .nomatch p { margin: 0 0 14px; }

  /* colour families (text) */
  .f-good { color: var(--good); } .f-sky { color: var(--sky); } .f-warn { color: var(--warn); }
  .f-bad { color: var(--bad); } .f-grey { color: var(--grey); }
  /* trend series without a score family: latency = sky, tokens/s = violet
     (page-local token, >= 4.5:1 on --card in both themes) */
  .hist { --m-tps: #6d45b8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hist { --m-tps: #b99cf2; } }
  :root[data-theme="dark"] .hist { --m-tps: #b99cf2; }
  .f-lat { color: var(--sky); } .f-tps { color: var(--m-tps); }

  /* rows */
  .rows { list-style: none; margin: 0; padding: 0 18px 10px; }
  .row + .row { border-top: 1px dotted var(--line); }
  .rline { display: grid; grid-template-columns: 1fr var(--del) var(--del) var(--del); gap: 6px; align-items: center; }
  .rmain {
    display: grid; grid-template-columns: var(--cols); gap: var(--cgap); align-items: center; width: 100%; min-width: 0;
    text-align: left; background: none; border: 0; border-radius: 12px; padding: 11px 10px; cursor: pointer;
    font-size: 13px; color: var(--ink2); transition: background 0.12s;
  }
  .rmain:hover { background: var(--surface-2); }
  .rmain[aria-expanded="true"] { background: var(--surface-2); color: var(--ink); }
  .rmain {
    grid-template-areas: "date risk score grade cv" "mode risk score grade cv"; row-gap: 3px;
  }
  .rmain > span { min-width: 0; }
  .c-date { grid-area: date; align-self: end; } .c-score { grid-area: score; } .c-grade { grid-area: grade; }
  .c-risk { grid-area: risk; } .c-mode { grid-area: mode; align-self: start; } .c-cv { grid-area: cv; }
  .c-date { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }
  .c-risk .badge { white-space: normal; text-align: left; line-height: 1.25; max-width: 100%; }
  .c-risk .badge .zicon { flex: none; }
  .c-score { text-align: right; font-family: var(--disp); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .c-grade { text-align: right; font-family: var(--disp); font-weight: 700; font-size: 16px; }
  .c-mode { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); overflow-wrap: anywhere; }
  .c-mode b { font-weight: 600; color: var(--ink); }
  .c-mode .perf, .c-mode .proto { display: block; color: var(--faint); margin-top: 2px; }
  .c-cv { display: inline-flex; justify-content: flex-end; color: var(--faint); }
  .c-cv .zicon { width: 15px; height: 15px; transition: transform 0.2s; }
  .rmain[aria-expanded="true"] .c-cv .zicon { transform: rotate(180deg); }
  .rdel, .rsched, .rrerun {
    width: var(--del); height: var(--del); display: grid; place-items: center; border-radius: 10px; cursor: pointer;
    background: none; border: 1px solid transparent; color: var(--faint); transition: color 0.12s, background 0.12s, border-color 0.12s;
  }
  .rdel .zicon, .rsched .zicon, .rrerun .zicon { width: 15px; height: 15px; }
  .rsched:not(:disabled):hover, .rrerun:hover { color: var(--teal); background: var(--surface-2); border-color: var(--teal); }
  .rsched:disabled { opacity: 0.5; cursor: progress; }
  .rsched.bymon:disabled { opacity: 0.35; cursor: not-allowed; }
  .rmsg { margin: 2px 10px 10px; font-size: 12.5px; font-weight: 600; color: var(--bad); }
  .rmsg:empty { display: none; }
  .rdel:hover { color: var(--bad); background: var(--badbg); border-color: var(--bad); }

  /* inline confirmation (row delete + clear all) */
  .confirm {
    display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin: 2px 0 10px; padding: 10px 12px;
    border: 1px solid var(--bad); background: var(--badbg); border-radius: 12px; font-size: 13px; color: var(--bad); font-weight: 600;
  }
  .confirm[hidden] { display: none; }
  .confirm .msg { flex: 1 1 200px; min-width: 0; }
  .confirm .btns { display: flex; gap: 8px; }
  .btn.danger-solid { background: var(--bad-fill); border-color: var(--bad-fill); color: var(--on-ink); }
  .btn.danger-solid:hover:not(:disabled) { background: var(--bad); border-color: var(--bad); }

  /* expanded report */
  .panel { padding: 6px 0 14px; }
  .panel[hidden] { display: none; }
  .panel .state { padding: 14px 10px; }
  .panel .zr { box-shadow: none; }

  /* list footer: quiet clear-history */
  .lfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 18px 14px 28px; border-top: 1px solid var(--line); background: var(--surface-2); }
  .lfoot .aside { font-size: 12px; }
  .lfoot .confirm { flex: 1 1 100%; margin: 0; }
  .clr { color: var(--faint); font-weight: 600; font-size: 12.5px; }
  .clr:hover { color: var(--bad); }
  .clr .zicon { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }

  .empty-box { text-align: center; padding: 44px 22px 40px; }
  .empty-box .ic { color: var(--faint); margin-bottom: 10px; }
  .empty-box .ic .zicon { width: 34px; height: 34px; }
  .empty-box p { margin: 0 0 16px; color: var(--ink2); font-size: 15px; }

  /* phones: stacked rows, no horizontal scroll */
  @media (max-width: 600px) {
    .colhead { display: none; }
    .grp-h { padding: 16px 14px 6px 16px; }
    .rows { padding: 0 8px 8px; }
    .lfoot { padding: 12px 14px; }
    .rmain {
      grid-template-columns: minmax(0, 1fr) auto auto 18px; gap: 6px 10px; padding: 11px 8px;
      grid-template-areas: "date score grade cv" "risk risk risk risk" "mode mode mode mode";
    }
    .c-date, .c-mode { align-self: auto; }
    .c-mode .perf, .c-mode .proto { display: inline; margin: 0; }
    .c-mode .perf::before, .c-mode .proto::before { content: " · "; }
    .rline { align-items: start; }
    .rdel, .rsched, .rrerun { margin-top: 4px; }
    .grp-h { flex-wrap: nowrap; align-items: flex-start; }
    .gtitle { flex: 1 1 auto; }
    .trend { flex-direction: column; align-items: flex-end; gap: 8px; }
    .tr { align-items: flex-end; }
    .tr + .tr { padding-left: 0; border-left: 0; }
    .trend svg { width: 84px; height: 26px; }
    .filters { padding: 12px 14px 14px; }
    .fgrid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="znav" data-page="history"></header>
  <main>
    <div class="hero">
      <h1 data-en="Audit <span class='u'>history</span> &amp; trends">检测<span class='u'>历史</span>与趋势</h1>
      <p data-en="Every verification you have run on this machine. Grouped by &quot;relay + claimed model&quot;, with a health-score trend line; click any row to expand that report.">这里是你在本机跑过的每一次验真。按「中转站 + 声称模型」分组，附一条健康分趋势曲线；点任意一行可展开当时那份报告。</p>
      <p class="local-note"><span class="pico" id="lockIcon"></span><span data-en="History lives only in a local SQLite file under &lt;code&gt;~/.zing&lt;/code&gt; — nothing is uploaded.">历史只保存在 <code>~/.zing</code> 下的本地 SQLite 文件里，不会上传。</span></p>
    </div>

    <section class="card jobs" id="jobs" aria-labelledby="jobs-h" hidden>
      <h2 id="jobs-h"><span class="pico" id="jobsIcon"></span><span data-en="In progress">进行中</span></h2>
      <p class="jh" data-en="Audits keep running when you leave the audit page. Audits of the same relay run one after another, so they never skew each other's results.">离开检测页后检测仍会继续运行。同一中转站的检测会依次排队运行，互不干扰检测结果。</p>
      <ul class="jlist" id="jlist"></ul>
    </section>

    <section class="card filters" id="filters" hidden></section>

    <section class="card hist" id="hist" tabindex="-1" aria-busy="true">
      <div class="state loading" data-en="Loading history…">加载历史…</div>
    </section>
  </main>
</div>
<script src="/i18n.js"></script>
<script src="/perf.js"></script>
<script src="/icons.js"></script>
<script src="/v2/static/nav.js"></script>
<script src="/v2/static/report.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var ico = function (n, o) { return window.zingIcon ? window.zingIcon(n, o || {}) : ""; };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  // T(zh, en) with {name} placeholders filled after translation
  var Tf = function (zh, en, vars) {
    return T(zh, en).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; });
  };

  var RISKC = { clean: "good", low: "sky", medium: "warn", high: "bad", inconclusive: "grey" };
  var RISKI = { clean: "check", low: "warning", medium: "warning", high: "x", inconclusive: "info" };
  var GRADEC = { A: "good", B: "good", C: "sky", D: "warn", E: "bad", F: "bad" };
  // score -> same family as the grade it maps to (scoring.py: A>=90 B>=80 C>=70 D>=60)
  var scoreC = function (s) {
    return typeof s !== "number" ? "grey" : s >= 80 ? "good" : s >= 70 ? "sky" : s >= 60 ? "warn" : "bad";
  };
  var gradeC = function (g) { return GRADEC[String(g || "").toUpperCase()] || "grey"; };
  var num = function (s) { return typeof s === "number" ? String(Math.round(s)) : "—"; };

  var host = $("#hist"), fbar = $("#filters");
  var FKEY = "zing.v2.history.filters", NONE = "__none__";
  var FDEF = { host: "", model: "", suite: "", mode: "", api: "", detect: "", stream: "", risk: "", min: "", days: "", q: "" };
  var state = { rows: null, error: null, reports: {}, open: null, confirm: null, filters: loadFilters() };

  $("#lockIcon").innerHTML = ico("lock");

  /* ---------------- filters ---------------- */
  // per-viewer convenience only: storage may be missing or throw
  function loadFilters() {
    var f = Object.assign({}, FDEF);
    try {
      var saved = JSON.parse(localStorage.getItem(FKEY) || "{}");
      Object.keys(FDEF).forEach(function (k) { if (typeof saved[k] === "string") f[k] = saved[k]; });
    } catch (e) { /* ignore */ }
    // links such as the monitors' "Open in history" pass filters in the query
    // string; these win over the remembered ones
    try {
      var qs = new URLSearchParams(location.search);
      var QK = ["host", "model", "suite", "api", "stream"];
      if (QK.some(function (k) { return qs.has(k); })) {
        f = Object.assign({}, FDEF); // drop stale filters that could hide the monitor's runs
        QK.forEach(function (k) { if (qs.has(k)) f[k] = qs.get(k); });
        localStorage.setItem(FKEY, JSON.stringify(f));
      }
    } catch (e) { /* ignore */ }
    return f;
  }
  function saveFilters() {
    try { localStorage.setItem(FKEY, JSON.stringify(state.filters)); } catch (e) { /* ignore */ }
  }
  function isFiltered() {
    return Object.keys(FDEF).some(function (k) { return state.filters[k] !== FDEF[k]; });
  }
  function hostOf(u) {
    try { return new URL(u).host || String(u || ""); } catch (e) { return String(u || ""); }
  }
  function modeOf(r) { return r.mode || "check"; }
  // protocol / detection / probe request mode; "" for runs saved before they were recorded
  function apiOf(r) { return r.api || ""; }
  function detectOf(r) { return r.api_auto == null ? "" : r.api_auto ? "auto" : "manual"; }
  function streamOf(r) { return r.stream_mode || ""; }
  var STREAM = {
    stream: ["流式", "Streaming"],
    non_stream: ["非流式", "Non-streaming"],
    both: ["流式 + 非流式", "Streaming + non-streaming"],
  };
  var streamLabel = function (v) { return STREAM[v] ? T(STREAM[v][0], STREAM[v][1]) : v; };
  var detectLabel = function (v) { return v === "auto" ? T("自动识别", "auto-detected") : T("手动指定", "set manually"); };
  // a filter value that matches the "(unknown)" option or one exact value
  function fmatch(want, have) { return !want || (want === NONE ? !have : have === want); }
  function riskOf(r) { return r.risk_level || "inconclusive"; }

  function filtered(rows) {
    var f = state.filters;
    var min = f.min === "" ? null : Number(f.min);
    var since = f.days ? Date.now() - Number(f.days) * 864e5 : null;
    var q = f.q.trim().toLowerCase();
    return rows.filter(function (r) {
      if (f.host && hostOf(r.base_url) !== f.host) return false;
      if (f.model && (r.claimed_model || "") !== f.model) return false;
      if (f.suite && (f.suite === NONE ? !!r.suite : r.suite !== f.suite)) return false;
      if (f.mode && modeOf(r) !== f.mode) return false;
      if (!fmatch(f.api, apiOf(r)) || !fmatch(f.detect, detectOf(r)) || !fmatch(f.stream, streamOf(r))) return false;
      if (f.risk && riskOf(r) !== f.risk) return false;
      if (min != null && !isNaN(min) && !(typeof r.score === "number" && r.score >= min)) return false;
      if (since != null) {
        var t = Date.parse(r.ts);
        if (isNaN(t) || t < since) return false;
      }
      if (q && [r.base_url, r.claimed_model, r.model, r.suite, modeOf(r), apiOf(r),
        detectOf(r) && detectLabel(detectOf(r)), streamOf(r) && streamLabel(streamOf(r))].join(" ").toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  // distinct values of fn(row), sorted; the current selection stays listed even when no row has it
  function distinct(fn, current) {
    var seen = {}, out = [];
    (state.rows || []).forEach(function (r) {
      var v = fn(r);
      if (v !== "" && v != null && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    if (current && current !== NONE && !seen[current]) out.push(current);
    return out.sort(function (a, b) { return String(a).localeCompare(String(b)); });
  }

  function selectHTML(key, label, opts) {
    var cur = state.filters[key];
    return '<label><span>' + esc(label) + '</span><select class="in" data-f="' + key + '">' +
      '<option value="">' + esc(T("全部", "All")) + "</option>" +
      opts.map(function (o) {
        return '<option value="' + esc(o.v) + '"' + (o.v === cur ? " selected" : "") + ">" + esc(o.t) + "</option>";
      }).join("") + "</select></label>";
  }
  var asOpts = function (vals) { return vals.map(function (v) { return { v: v, t: v }; }); };

  function renderFilters() {
    if (state.error != null || !state.rows || !state.rows.length) {
      fbar.hidden = true;
      fbar.innerHTML = "";
      return;
    }
    var f = state.filters;
    var focusSel = document.activeElement && fbar.contains(document.activeElement) && document.activeElement.getAttribute("data-f");
    var suites = asOpts(distinct(function (r) { return r.suite || ""; }, f.suite));
    if ((state.rows || []).some(function (r) { return !r.suite; }) || f.suite === NONE) suites.push({ v: NONE, t: T("（无套件）", "(no suite)") });
    // options of a protocol / detection / mode filter, plus "(unknown)" when an
    // older run lacks the value
    var withNone = function (opts, fn, cur) {
      if (state.rows.some(function (r) { return !fn(r); }) || cur === NONE) opts.push({ v: NONE, t: T("（未知）", "(unknown)") });
      return opts;
    };
    var apis = withNone(asOpts(distinct(apiOf, f.api)), apiOf, f.api);
    var detects = withNone(distinct(detectOf, f.detect).map(function (v) { return { v: v, t: detectLabel(v) }; }), detectOf, f.detect);
    var streams = withNone(["stream", "non_stream", "both"].filter(function (v) {
      return v === f.stream || state.rows.some(function (r) { return streamOf(r) === v; });
    }).map(function (v) { return { v: v, t: streamLabel(v) }; }), streamOf, f.stream);
    var risks = ["clean", "low", "medium", "high", "inconclusive"].filter(function (l) {
      return l === f.risk || state.rows.some(function (r) { return riskOf(r) === l; });
    });
    fbar.setAttribute("aria-label", T("筛选", "Filters"));
    fbar.hidden = false;
    fbar.innerHTML = '<div class="fgrid">' +
      '<label class="fq"><span>' + esc(T("搜索", "Search")) + '</span><input class="in" type="search" data-f="q" value="' + esc(f.q) +
      '" placeholder="' + esc(T("中转站、模型、套件、协议…", "Relay, model, suite, protocol…")) + '" autocomplete="off" /></label>' +
      selectHTML("host", T("中转站", "Relay / provider"), asOpts(distinct(function (r) { return hostOf(r.base_url); }, f.host))) +
      selectHTML("model", T("声称模型", "Claimed model"), asOpts(distinct(function (r) { return r.claimed_model || ""; }, f.model))) +
      selectHTML("suite", T("套件", "Suite"), suites) +
      selectHTML("mode", T("模式", "Mode"), asOpts(distinct(modeOf, f.mode))) +
      selectHTML("api", T("协议", "Protocol"), apis) +
      selectHTML("detect", T("协议识别", "Protocol detection"), detects) +
      selectHTML("stream", T("探测请求", "Probe requests"), streams) +
      selectHTML("risk", T("风险", "Risk"), risks.map(function (l) { return { v: l, t: ZING_I18N.label("RISK_LEVEL", l) }; })) +
      '<label><span>' + esc(T("最低健康分", "Min. score")) + '</span><input class="in" type="number" inputmode="numeric" min="0" max="100" step="1" data-f="min" value="' +
      esc(f.min) + '" placeholder="0" /></label>' +
      selectHTML("days", T("时间范围", "Period"), [
        { v: "7", t: T("最近 7 天", "Last 7 days") },
        { v: "30", t: T("最近 30 天", "Last 30 days") },
        { v: "90", t: T("最近 90 天", "Last 90 days") },
      ]) +
      "</div>" + trendPickerHTML() + '<div class="ffoot"><span id="fcount" aria-live="polite"></span>' +
      '<button type="button" class="linkbtn" id="freset"' + (isFiltered() ? "" : " hidden") + ">" + esc(T("重置筛选", "Reset filters")) + "</button></div>";
    if (focusSel) {
      var el = fbar.querySelector('[data-f="' + focusSel + '"]');
      if (el) el.focus();
    }
  }

  function resetFilters() {
    state.filters = Object.assign({}, FDEF);
    saveFilters();
    renderFilters();
    render();
  }

  function onFilter(ev) {
    var k = ev.target.getAttribute("data-f");
    // a text field fires "change" again on blur; re-rendering then would swap
    // out the button being clicked, so only react to real changes
    if (!k || state.filters[k] === String(ev.target.value)) return;
    state.filters[k] = String(ev.target.value);
    saveFilters();
    var rb = $("#freset");
    if (rb) rb.hidden = !isFiltered();
    render();
  }
  fbar.addEventListener("input", onFilter);
  fbar.addEventListener("change", onFilter);
  fbar.addEventListener("click", function (ev) {
    var tb = ev.target.closest("[data-trend]");
    if (tb) return toggleTrend(tb.getAttribute("data-trend"));
    if (ev.target.closest("#freset")) {
      resetFilters();
      var first = fbar.querySelector("[data-f]");
      if (first) first.focus();
    }
  });

  function fmtTime(ts) {
    if (!ts) return "—";
    var d = new Date(ts);
    if (isNaN(d)) return String(ts);
    try {
      return d.toLocaleString(ZING_LANG.locale(), { dateStyle: "medium", timeStyle: "short" });
    } catch (e) {
      return d.toLocaleString();
    }
  }

  function groupsOf(rows) {
    var groups = [], idx = {};
    rows.forEach(function (r) {
      var key = (r.base_url || "") + "\n" + (r.claimed_model || "");
      if (idx[key] == null) {
        idx[key] = groups.length;
        groups.push({ key: key, base_url: r.base_url, claimed_model: r.claimed_model, rows: [] });
      }
      groups[idx[key]].rows.push(r);
    });
    return groups;
  }

  /* ---------------- data ---------------- */
  function load() {
    host.setAttribute("aria-busy", "true");
    // perf=1: every row carries its p50 latency / decode speed, so the group
    // trends are drawn from the (filtered) rows without one request per group.
    return fetch("/api/history?limit=500&perf=1")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (rows) {
        state.rows = Array.isArray(rows) ? rows : [];
        state.error = null;
        renderFilters();
        render();
      })
      .catch(function (e) {
        state.error = String((e && e.message) || e);
        renderFilters();
        render();
      })
      .then(function () { host.setAttribute("aria-busy", "false"); });
  }

  /* ---------------- rendering ---------------- */
  function render() {
    // keep mounted report elements (with their open evidence) across re-renders
    var keep = {};
    Array.prototype.forEach.call(host.querySelectorAll(".panel[data-id]"), function (p) {
      if (p.firstElementChild && p.firstElementChild.classList.contains("rep")) keep[p.getAttribute("data-id")] = p.firstElementChild;
    });
    var focusSel = focusKey(document.activeElement);

    if (state.error != null) {
      host.innerHTML = '<div class="errbox" role="alert">' + esc(T("无法读取历史：", "Could not read history: ")) + esc(state.error) +
        "<br>" + esc(T("请确认本地 zing 服务在运行。", "Make sure the local zing service is running.")) + "</div>";
      return;
    }
    if (!state.rows) return;
    if (!state.rows.length) {
      host.innerHTML = '<div class="empty-box"><div class="ic">' + ico("folder") + "</div><p>" +
        esc(T("还没有检测记录。", "No audits recorded yet.")) + '</p><a class="btn pri" href="/v2/">' +
        esc(T("去跑第一次检测", "Run your first audit")) + " " + ico("arrowRight") + "</a></div>";
      return;
    }

    var rows = filtered(state.rows);
    var fc = $("#fcount");
    if (fc) fc.textContent = Tf("显示 {shown} / {n} 条记录", "Showing {shown} of {n} audits", { shown: rows.length, n: state.rows.length });
    if (state.open != null && !rows.some(function (r) { return String(r.id) === String(state.open); })) state.open = null;
    if (state.confirm != null && state.confirm !== "all" && !rows.some(function (r) { return String(r.id) === state.confirm; })) state.confirm = null;
    if (!rows.length) {
      host.innerHTML = '<div class="nomatch"><p>' + esc(T("没有符合筛选条件的检测记录。", "No audits match these filters.")) +
        '</p><button type="button" class="btn sm" id="nmreset">' + esc(T("重置筛选", "Reset filters")) + "</button></div>";
      return;
    }

    var groups = groupsOf(rows);
    host.innerHTML =
      '<div class="colhead" aria-hidden="true"><div class="cells">' +
      "<span>" + esc(T("时间", "Time")) + "</span>" +
      "<span>" + esc(T("风险", "Risk")) + "</span>" +
      '<span class="n">' + esc(T("健康分", "Score")) + "</span>" +
      '<span class="n">' + esc(T("评级", "Grade")) + "</span>" +
      "<span></span></div><span></span></div>" +
      groups.map(groupHTML).join("") +
      '<div class="lfoot">' +
      '<span class="aside">' + esc(isFiltered()
        ? Tf("显示 {shown} / {n} 条记录", "Showing {shown} of {n} audits", { shown: rows.length, n: state.rows.length })
        : Tf("共 {n} 条记录", "Saved audits: {n}", { n: state.rows.length })) + "</span>" +
      '<button type="button" class="linkbtn clr" id="clr" aria-expanded="' + (state.confirm === "all") + '" aria-controls="clrConfirm">' +
      ico("trash") + esc(T("清空历史", "Clear history")) + "</button>" +
      confirmHTML("clrConfirm", "all", T("确定清空全部检测历史？此操作不可撤销。", "Clear the entire audit history? This cannot be undone."), T("清空历史", "Clear history")) +
      "</div>";

    // re-mount the open report
    if (state.open != null) {
      var panel = host.querySelector('.panel[data-id="' + state.open + '"]');
      if (panel) {
        panel.hidden = false;
        if (keep[state.open]) panel.appendChild(keep[state.open]);
        else if (state.reports[state.open]) mount(panel, state.reports[state.open]);
        else fetchReport(panel, state.open);
      }
    }
    if (focusSel) {
      var f = host.querySelector(focusSel);
      if (f) f.focus();
    }
  }

  function focusKey(el) {
    if (!el || !host.contains(el)) return null;
    if (el.id) return "#" + CSS.escape(el.id);
    var row = el.closest(".row");
    if (row && el.classList.contains("rdel")) return '.row[data-id="' + row.getAttribute("data-id") + '"] .rdel';
    if (row && el.classList.contains("rrerun")) return '.row[data-id="' + row.getAttribute("data-id") + '"] .rrerun';
    if (row && el.classList.contains("rsched")) return '.row[data-id="' + row.getAttribute("data-id") + '"] .rsched';
    return null;
  }

  function confirmHTML(id, what, msg, okLabel) {
    return '<div class="confirm" id="' + id + '" role="group" aria-label="' + esc(msg) + '"' + (state.confirm === what ? "" : " hidden") + ">" +
      '<span class="msg" data-msg="' + esc(msg) + '">' + esc(msg) + "</span>" +
      '<span class="btns"><button type="button" class="btn sm danger-solid" data-yes="' + what + '">' + esc(okLabel) + "</button>" +
      '<button type="button" class="btn sm" data-no="' + what + '">' + esc(T("取消", "Cancel")) + "</button></span></div>";
  }

  function groupHTML(g, gi) {
    var hid = "g" + gi;
    return '<section class="group" aria-labelledby="' + hid + '"><div class="grp-h"><div class="gtitle">' +
      '<h2 id="' + hid + '" title="' + esc(T("声称模型", "Claimed model")) + '">' +
      esc(g.claimed_model || T("(未声明模型)", "(no model declared)")) + "</h2>" +
      '<div class="gu"><code class="key">base_url</code><span title="' + esc(g.base_url || "") + '">' + esc(g.base_url || "—") + "</span></div></div>" +
      trendHTML(g.rows) + "</div>" +
      '<ul class="rows">' + g.rows.map(rowHTML).join("") + "</ul></section>";
  }

  // small sparkline of vals (oldest -> newest) scaled to [lo, hi]; area fill
  // optional. Stroke/fill use currentColor, so the tile's colour family (on
  // .tr) colours the line and the KPI number alike.
  function sparkSVG(vals, lo, hi, label, area, W) {
    var H = 30, P = 3, rg = hi - lo || 1;
    var xs = vals.map(function (_, i) { return P + (i * (W - 2 * P)) / (vals.length - 1); });
    var ys = vals.map(function (v) { return H - P - ((Math.max(lo, Math.min(hi, v)) - lo) / rg) * (H - 2 * P); });
    var d = xs.map(function (x, i) { return (i ? "L" : "M") + x.toFixed(1) + "," + ys[i].toFixed(1); }).join(" ");
    var fill = area ? '<path class="area" d="' + d + " L" + xs[xs.length - 1].toFixed(1) + "," + (H - P) + " L" + xs[0].toFixed(1) + "," + (H - P) + ' Z"/>' : "";
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">' +
      "<title>" + esc(label) + "</title>" +
      '<line class="base" x1="0" x2="' + W + '" y1="' + (H - P) + '" y2="' + (H - P) + '"/>' + fill +
      '<path class="line" d="' + d + '"/>' +
      '<circle class="dot" cx="' + xs[xs.length - 1].toFixed(1) + '" cy="' + ys[ys.length - 1].toFixed(1) + '" r="2.5"/></svg>';
  }

  /* ---------------- configurable trends ---------------- */
  // Grade letters on a 1..6 scale for the grade sparkline (F lowest).
  var GRADEN = { A: 6, B: 5, C: 4, D: 3, E: 2, F: 1 };
  var GRADEL = ["", "F", "E", "D", "C", "B", "A"];
  // Each metric: value per row (null = none), scale (fixed or the points'
  // min..max), colour family of the latest value, KPI text.
  var METRICS = [
    { id: "score", zh: "健康分", en: "Score", area: true, lo: 0, hi: 100,
      get: function (r) { return typeof r.score === "number" ? r.score : null; },
      fam: function (v) { return scoreC(v); },
      kpi: function (v) { return String(Math.round(v)); } },
    { id: "grade", zh: "评级", en: "Grade", area: true, lo: 1, hi: 6,
      get: function (r) { return GRADEN[String(r.rating || "").toUpperCase()] || null; },
      fam: function (v) { return gradeC(GRADEL[v]); },
      kpi: function (v) { return GRADEL[v]; } },
    { id: "lat", zh: "延迟 p50", en: "Latency p50", unit: "ms", area: true,
      get: function (r) { return typeof r.latency_p50_ms === "number" ? r.latency_p50_ms : null; },
      fam: function () { return "lat"; },
      kpi: function (v) { return String(Math.round(v)); } },
    { id: "tps", zh: "输出速度", en: "Tokens/s", unit: "tok/s", area: true,
      get: function (r) { return typeof r.decode_tps_p50 === "number" ? r.decode_tps_p50 : null; },
      fam: function () { return "tps"; },
      kpi: function (v) { return String(Math.round(v)); } },
  ];
  var TKEY = "zing.v2.history.trends", TDEF = ["score", "lat"];
  state.trends = (function () {
    try {
      var t = JSON.parse(localStorage.getItem(TKEY) || "null");
      if (Array.isArray(t)) {
        t = METRICS.map(function (m) { return m.id; }).filter(function (id) { return t.indexOf(id) >= 0; });
        if (t.length) return t;
      }
    } catch (e) { /* ignore */ }
    return TDEF.slice();
  })();

  function trendPickerHTML() {
    var only = state.trends.length === 1;
    return '<div class="tsel" role="group" aria-labelledby="tselL"><span id="tselL">' + esc(T("趋势图", "Trends")) + "</span>" +
      METRICS.map(function (m) {
        var on = state.trends.indexOf(m.id) >= 0;
        return '<button type="button" data-trend="' + m.id + '" aria-pressed="' + on + '"' + (on && only ? " disabled" : "") + ">" +
          esc(T(m.zh, m.en)) + "</button>";
      }).join("") + "</div>";
  }

  function toggleTrend(id) {
    var on = state.trends.indexOf(id) >= 0;
    if (on && state.trends.length === 1) return; // keep at least one
    var next = on ? state.trends.filter(function (x) { return x !== id; }) : state.trends.concat([id]);
    state.trends = METRICS.map(function (m) { return m.id; }).filter(function (x) { return next.indexOf(x) >= 0; });
    try { localStorage.setItem(TKEY, JSON.stringify(state.trends)); } catch (e) { /* ignore */ }
    var only = state.trends.length === 1;
    Array.prototype.forEach.call(fbar.querySelectorAll("[data-trend]"), function (b) {
      var sel = state.trends.indexOf(b.getAttribute("data-trend")) >= 0;
      b.setAttribute("aria-pressed", String(sel));
      b.disabled = sel && only;
    });
    render();
  }

  // group trends from the group's (filtered) rows, which arrive newest first
  function trendHTML(rows) {
    var pts = rows.slice().reverse();
    var W = state.trends.length > 2 ? 72 : 96;
    var tiles = METRICS.filter(function (m) { return state.trends.indexOf(m.id) >= 0; }).map(function (m) {
      var vals = pts.map(m.get).filter(function (v) { return v != null; });
      if (!vals.length) return "";
      var name = T(m.zh, m.en), last = vals[vals.length - 1];
      var lo = m.lo != null ? m.lo : Math.min.apply(null, vals), hi = m.hi != null ? m.hi : Math.max.apply(null, vals);
      var label;
      if (m.id === "score") {
        var first = Math.round(vals[0]), lst = Math.round(last);
        var dir = lst > first ? T("上升", "rising") : lst < first ? T("下降", "falling") : T("持平", "unchanged");
        label = Tf("健康分趋势（{n} 次检测）：从 {first} 到 {last}，{dir}。",
          "Health score trend across {n} audits: from {first} to {last}, {dir}.", { n: vals.length, first: first, last: lst, dir: dir });
      } else {
        var u = m.unit ? " " + m.unit : "";
        label = Tf("{metric}趋势（{n} 次检测）：从 {first} 到 {last}。",
          "{metric} trend across {n} audits: from {first} to {last}.",
          { metric: name, n: vals.length, first: m.kpi(vals[0]) + u, last: m.kpi(last) + u });
      }
      return '<div class="tr f-' + m.fam(last) + '"><span class="tl">' + esc(name) + '</span><div class="tv">' +
        (vals.length >= 2 ? sparkSVG(vals, lo, hi, label, !!m.area, W) : "") +
        "<b>" + esc(m.kpi(last)) + (m.unit ? "<small>" + esc(m.unit) + "</small>" : "") + "</b></div></div>";
    }).join("");
    return '<div class="trend">' + tiles + "</div>";
  }

  function rowHTML(r) {
    var id = String(r.id);
    var lvl = r.risk_level || "inconclusive";
    var perf = typeof r.latency_p50_ms === "number" ? r : null;
    var open = String(state.open) === id;
    return '<li class="row" data-id="' + esc(id) + '"><div class="rline">' +
      '<button type="button" class="rmain" id="r-' + esc(id) + '" aria-expanded="' + open + '" aria-controls="p-' + esc(id) + '">' +
      '<span class="c-date">' + esc(fmtTime(r.ts)) + "</span>" +
      '<span class="c-risk"><span class="badge ' + (RISKC[lvl] || "grey") + '">' + ico(RISKI[lvl] || "info") + " " +
      esc(ZING_I18N.label("RISK_LEVEL", lvl)) + "</span></span>" +
      '<span class="c-score f-' + scoreC(r.score) + '"><span class="sr-only">' + esc(T("健康分", "Score")) + " </span>" + num(r.score) + "</span>" +
      '<span class="c-grade f-' + gradeC(r.rating) + '"><span class="sr-only">' + esc(T("评级", "Grade")) + " </span>" + esc(r.rating || "–") + "</span>" +
      '<span class="c-mode"><b>' + esc(r.mode || "check") + "</b>" + (r.suite ? " · " + esc(r.suite) : "") + protoHTML(r) +
      (perf ? '<span class="perf" title="' + esc(T("延迟 p50", "Latency p50")) + '">p50 ' + Math.round(perf.latency_p50_ms) + " ms</span>" : "") + "</span>" +
      '<span class="c-cv" aria-hidden="true">' + ico("chevronDown") + "</span></button>" +
      rerunBtnHTML(r) + schedBtnHTML(r) +
      '<button type="button" class="rdel" aria-label="' + esc(T("删除此记录", "Delete entry")) + '" title="' + esc(T("删除此记录", "Delete entry")) +
      '" aria-expanded="' + (state.confirm === id) + '" aria-controls="c-' + esc(id) + '">' + ico("trash") + "</button></div>" +
      confirmHTML("c-" + esc(id), id, T("删除这条历史记录？", "Delete this history entry?"), T("删除", "Delete")) +
      '<p class="rmsg" id="m-' + esc(id) + '" role="status"></p>' +
      '<div class="panel" id="p-' + esc(id) + '" data-id="' + esc(id) + '" role="region" aria-labelledby="r-' + esc(id) + '" hidden></div></li>';
  }

  // protocol (auto-detected or set by hand) and the probe's request mode
  function protoHTML(r) {
    var bits = [];
    if (apiOf(r)) bits.push(esc(apiOf(r)) + (detectOf(r) ? " (" + esc(detectLabel(detectOf(r))) + ")" : ""));
    if (streamOf(r)) bits.push(esc(streamLabel(streamOf(r))));
    return bits.length ? '<span class="proto">' + bits.join(" · ") + "</span>" : "";
  }

  // A run a monitor produced already has its monitor: offer no second one.
  function byMonitor(r) { return !!r && r.watch_id != null; }

  // Re-run: open the audit form prefilled with this run's configuration.
  function rerun(id) { location.href = "/v2/?rerun=" + encodeURIComponent(id); }

  function rerunBtnHTML(r) {
    var label = T("重新检测", "Re-run audit");
    return '<button type="button" class="rrerun" data-rerun="' + esc(String(r.id)) + '" aria-label="' + esc(label) + '" title="' + esc(label) + '">' + ico("refresh") + "</button>";
  }

  function schedBtnHTML(r) {
    var id = String(r.id);
    if (byMonitor(r)) {
      var why = T("此记录由监控运行产生", "This run was produced by a monitor");
      return '<button type="button" class="rsched bymon" disabled aria-label="' + esc(why) + '" title="' + esc(why) + '">' + ico("bell") + "</button>";
    }
    return '<button type="button" class="rsched" data-sched="' + esc(id) + '" aria-label="' + esc(T("设为监控", "Schedule as monitor")) + '" title="' + esc(T("设为监控", "Schedule as monitor")) + '">' + ico("bell") + "</button>";
  }

  /* ---------------- report drawer ---------------- */
  function mount(panel, report) {
    var el = document.createElement("div");
    var id = panel.getAttribute("data-id");
    var row = (state.rows || []).filter(function (r) { return String(r.id) === id; })[0];
    el.className = "rep";
    panel.innerHTML = "";
    panel.appendChild(el);
    ZingReport.render(el, report, {
      actions: (byMonitor(row) ? [] : [
        { zh: "设为监控", en: "Schedule as monitor", primary: true, onClick: function () { schedule(id); } },
      ]).concat([
        { zh: "重新检测", en: "Re-run audit", onClick: function () { rerun(id); } },
      ]),
      download: { name: "zing-report-" + panel.getAttribute("data-id") },
    });
  }

  function fetchReport(panel, id) {
    panel.innerHTML = '<div class="state loading">' + esc(T("加载报告…", "Loading report…")) + "</div>";
    fetch("/api/history/" + encodeURIComponent(id))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (rep) {
        state.reports[id] = rep;
        if (panel.isConnected) mount(panel, rep);
      })
      .catch(function (e) {
        if (panel.isConnected)
          panel.innerHTML = '<div class="errbox">' + esc(T("无法加载这份报告：", "Could not load this report: ")) + esc(String((e && e.message) || e)) + "</div>";
      });
  }

  // Schedule a run: the server copies its configuration into a paused monitor
  // with no interval yet; the monitors page then asks for the interval (and the
  // API key, which history never stores) before it can be switched on.
  function schedule(id) {
    var btn = host.querySelector('[data-sched="' + id + '"]'), msg = document.getElementById("m-" + id);
    if (btn) btn.disabled = true;
    if (msg) msg.textContent = "";
    fetch("/api/watches/from-history/" + encodeURIComponent(id), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: ZING_LANG.get() }),
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || !j.id) throw new Error((j && j.error) || "HTTP " + r.status);
          location.href = "/v2/watches#w-" + j.id;
        });
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        if (msg) msg.textContent = T("无法设为监控：", "Could not schedule this run: ") + ZING_LANG.server(String((e && e.message) || e));
      });
  }

  function toggle(id) {
    var prev = state.open;
    if (prev != null) {
      var pb = document.getElementById("r-" + prev), pp = document.getElementById("p-" + prev);
      if (pb) pb.setAttribute("aria-expanded", "false");
      if (pp) { pp.hidden = true; pp.innerHTML = ""; }
    }
    state.open = String(prev) === id ? null : id;
    if (state.open == null) return;
    var b = document.getElementById("r-" + id), p = document.getElementById("p-" + id);
    b.setAttribute("aria-expanded", "true");
    p.hidden = false;
    if (state.reports[id]) mount(p, state.reports[id]);
    else fetchReport(p, id);
  }

  /* ---------------- delete / clear ---------------- */
  function setConfirm(what) {
    state.confirm = what;
    Array.prototype.forEach.call(host.querySelectorAll(".confirm"), function (c) {
      var mine = c.querySelector("[data-yes]").getAttribute("data-yes") === what;
      c.hidden = !mine;
      var m = c.querySelector(".msg"), y = c.querySelector("[data-yes]");
      m.textContent = m.getAttribute("data-msg"); // drop a previous error
      y.disabled = false;
    });
    Array.prototype.forEach.call(host.querySelectorAll("[aria-controls]"), function (b) {
      if (b.classList.contains("rdel") || b.id === "clr")
        b.setAttribute("aria-expanded", String(b.getAttribute("aria-controls") === (what === "all" ? "clrConfirm" : "c-" + what)));
    });
    if (what != null) {
      var c = document.getElementById(what === "all" ? "clrConfirm" : "c-" + what);
      var no = c && c.querySelector("[data-no]");
      if (no) no.focus();
    }
  }

  function doDelete(what) {
    var url = what === "all" ? "/api/history" : "/api/history/" + encodeURIComponent(what);
    var btn = host.querySelector('[data-yes="' + what + '"]');
    if (btn) btn.disabled = true;
    fetch(url, { method: "DELETE" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        state.confirm = null;
        if (what === "all") { state.reports = {}; state.open = null; }
        else delete state.reports[what];
        return load();
      })
      .then(function () {
        var first = host.querySelector(".rmain") || host.querySelector(".empty-box a");
        (first || host).focus();
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        var c = btn && btn.closest(".confirm");
        if (c) c.querySelector(".msg").textContent = T("删除失败：", "Could not delete: ") + String((e && e.message) || e);
      });
  }

  host.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t || !host.contains(t)) return;
    if (t.id === "nmreset") {
      resetFilters();
      var fq = fbar.querySelector("[data-f]");
      if (fq) fq.focus();
      return;
    }
    if (t.classList.contains("rmain")) return toggle(t.id.slice(2));
    if (t.hasAttribute("data-rerun")) return rerun(t.getAttribute("data-rerun"));
    if (t.hasAttribute("data-sched")) return schedule(t.getAttribute("data-sched"));
    if (t.classList.contains("rdel")) {
      var id = t.closest(".row").getAttribute("data-id");
      return setConfirm(state.confirm === id ? null : id);
    }
    if (t.id === "clr") return setConfirm(state.confirm === "all" ? null : "all");
    if (t.hasAttribute("data-no")) {
      var w = t.getAttribute("data-no");
      setConfirm(null);
      var back = w === "all" ? $("#clr") : host.querySelector('.row[data-id="' + w + '"] .rdel');
      if (back) back.focus();
      return;
    }
    if (t.hasAttribute("data-yes")) return doDelete(t.getAttribute("data-yes"));
  });
  host.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape" || state.confirm == null) return;
    var w = state.confirm;
    setConfirm(null);
    var back = w === "all" ? $("#clr") : host.querySelector('.row[data-id="' + w + '"] .rdel');
    if (back) back.focus();
  });

  /* ---------------- in progress (background audits, running monitors) ---------------- */
  // Polled while anything is queued or running; when a run finishes the
  // history list below is reloaded so its report shows up there.
  var jobsBox = $("#jobs"), jlist = $("#jlist");
  var jobs = { rows: [], timer: null, active: {}, msg: {} };
  $("#jobsIcon").innerHTML = ico("play");
  function isActive(j) { return j.status === "queued" || j.status === "running"; }
  function loadJobs() {
    clearTimeout(jobs.timer);
    return fetch("/api/jobs")
      .then(function (r) { return r.ok ? r.json() : { jobs: [] }; })
      .then(function (d) {
        var rows = (d && d.jobs) || [];
        var now = {}, finished = false;
        rows.forEach(function (j) { if (isActive(j)) now[j.id] = true; });
        Object.keys(jobs.active).forEach(function (id) { if (!now[id]) finished = true; });
        jobs.active = now;
        // failed audits never reach the history list: keep them here (the
        // server drops them after a while); cancelled and finished ones go
        jobs.rows = rows.filter(function (j) { return isActive(j) || j.status === "error"; });
        renderJobs();
        if (finished) load();
      })
      .catch(function () {})
      .then(function () {
        if (Object.keys(jobs.active).length) jobs.timer = setTimeout(loadJobs, 2000);
      });
  }
  function jobStateHTML(j) {
    if (j.status === "queued") {
      var hosts = (j.waiting_for || []).join(", ");
      return esc(hosts
        ? Tf("排队中：{h} 正在进行另一项检测", "Queued: another audit is using {h}", { h: hosts })
        : T("排队中：等待空闲的检测位", "Queued: waiting for a free audit slot"));
    }
    if (j.status === "error") return esc(T("检测失败：", "Audit failed: ")) + esc(srvT(j.error || ""));
    var line = "<b>" + esc(T("正在运行", "Running now")) + "</b>";
    if (j.total) line += " · " + esc(Tf("已完成 {n} / {total} 项检测", "{n} of {total} checks done", { n: j.done || 0, total: j.total }));
    if (j.started) line += " · " + esc(fmtTime(new Date(j.started * 1000).toISOString()));
    return line;
  }
  function srvT(s) { return window.ZING_LANG ? ZING_LANG.server(s) : s; }
  function jobHTML(j) {
    var mon = j.kind === "monitor";
    var title = j.claimed_model || j.model || "?";
    var pct = Math.max(0, Math.min(100, Number(j.progress) || 0));
    var label = Tf("{name} 的运行进度", "Progress of {name}", { name: title });
    var prog = isActive(j)
      ? '<div class="jprog"><div class="bar' + (j.status === "queued" ? " q" : "") + '" role="progressbar" aria-valuemin="0" aria-valuemax="100"' +
        (j.status === "queued" ? "" : ' aria-valuenow="' + pct + '"') + ' aria-label="' + esc(label) + '"><span style="width:' + pct + '%"></span></div>' +
        "<b>" + (j.status === "queued" ? "" : pct + "%") + "</b></div>"
      : "";
    var live = isActive(j)
      ? '<a class="btn sm pri" href="/v2/?job=' + encodeURIComponent(j.id) + '">' + ico("eye") + esc(T("实时查看", "Watch live")) + "</a>"
      : "";
    var open = (mon
      ? '<a class="btn sm" href="/v2/watches#w-' + esc(j.watch_id) + '">' + ico("bell") + esc(T("打开监控", "Open monitor")) + "</a>"
      : "") + live;
    var cancel = isActive(j)
      ? '<button type="button" class="btn sm danger" data-jcancel="' + esc(j.id) + '">' + ico("x") + esc(T("取消", "Cancel")) + "</button>"
      : "";
    return '<li class="job' + (j.status === "error" ? " err" : "") + '" data-job="' + esc(j.id) + '"><div class="jmain">' +
      '<div class="jt">' + esc(title) + ' <span class="key">' + esc(j.suite || "standard") + "</span>" +
      (j.api ? ' <span class="key">' + esc(j.api) + (j.api_auto ? " (" + esc(detectLabel("auto")) + ")" : "") + "</span>" : "") +
      (j.stream_mode ? ' <span class="key">' + esc(streamLabel(j.stream_mode)) + "</span>" : "") +
      (mon ? ' <span class="key">' + esc(T("监控", "Monitor")) + "</span>" : "") + "</div>" +
      '<div class="ju">' + esc(j.base_url || "") + "</div>" +
      '<div class="js" role="status">' + jobStateHTML(j) + (jobs.msg[j.id] ? " · " + esc(jobs.msg[j.id]()) : "") + "</div>" +
      prog + '</div><div class="jact">' + open + cancel + "</div></li>";
  }
  function renderJobs() {
    jobsBox.hidden = !jobs.rows.length;
    var focusId = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-jcancel");
    jlist.innerHTML = jobs.rows.map(jobHTML).join("");
    if (focusId) {
      var again = jlist.querySelector('[data-jcancel="' + focusId + '"]');
      if (again) again.focus();
    }
  }
  jlist.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-jcancel]");
    if (!b) return;
    var id = b.getAttribute("data-jcancel");
    var row = jobs.rows.filter(function (j) { return j.id === id; })[0];
    var url = row && row.kind === "monitor"
      ? "/api/watches/" + encodeURIComponent(row.watch_id) + "/cancel"
      : "/api/jobs/" + encodeURIComponent(id) + "/cancel";
    b.disabled = true;
    fetch(url, { method: "POST" })
      .then(function (r) {
        if (!r.ok) jobs.msg[id] = function () { return T("无法取消运行，请重试。", "Could not cancel the run — please try again."); };
      })
      .catch(function () {})
      .then(loadJobs);
  });

  // live language switch: re-render from cached data (no refetch); the open
  // report is re-rendered by report.js and carried over by render().
  window.addEventListener("zing:lang", function () { renderFilters(); render(); renderJobs(); });
  loadJobs();

  load();
})();
</script>
</body>
</html>
