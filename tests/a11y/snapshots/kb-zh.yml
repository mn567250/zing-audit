- banner:
  - link "跳到主要内容":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "经典界面":
    - /url: "?ui=v1"
  - combobox "主题":
    - option "跟随系统"
    - option "浅色" [selected]
    - option "深色"
  - combobox "动画":
    - option "动画开" [selected]
    - option "动画关"
  - combobox "语言":
    - option "English"
    - option "中文" [selected]
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "无障碍":
    - /url: /v2/accessibility
  - navigation "主导航":
    - link "检测":
      - /url: /v2/
    - link "检测历史":
      - /url: /v2/history
    - link "分析":
      - /url: /v2/analytics
    - link "监控":
      - /url: /v2/watches
    - link "知识库":
      - /url: /v2/kb
  - paragraph: 本地运行 · 密钥不经手
- main:
  - heading "zing 用来比对的知识库" [level=1]
  - paragraph:
    - text: 每次检测都会把中转站与其声称模型的资料比对：上下文窗口、输出上限、能力、身份与行为指纹。这里列出 zing 已知的全部模型、厂商与中转站——内置的和你的——你可以逐项启用或停用，也可以添加自己的条目。你的更改保存在本机的 kb.db 中，网页界面和
    - code: zing check
    - text: 都会使用。
  - region "筛选":
    - button "筛选" [expanded]
    - text: 模型 ID
    - combobox "模型 ID":
      - option "全部" [selected]
    - text: 厂商
    - combobox "厂商":
      - option "全部" [selected]
      - option "Anthropic (Claude)"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
    - text: 中转站
    - combobox "中转站":
      - option "全部" [selected]
      - option "Example Relay"
    - text: 来源
    - combobox "来源":
      - option "全部" [selected]
      - option "内置"
      - option "你的"
    - status: 显示 98/98 个模型 · 7/7 个厂商 · 1/1 个中转站
  - link "将你的条目导出为 YAML":
    - /url: /api/kb/export
  - tablist "知识库分类":
    - tab "模型" [selected]
    - tab "厂商"
    - tab "中转站"
  - tabpanel "模型":
    - heading "全部模型 98 个模型" [level=2]
    - paragraph: 检测时用来比对的模型资料。停用的模型不再参与匹配：检测它时将没有资料可比对。
    - group:
      - text: 添加模型
      - paragraph: 让 AI 助手调研该模型，然后在这里检查它的回答，再保存。
      - heading "1 复制调研提示词" [level=3]
      - text: 模型 ID id
      - textbox "模型 ID id":
        - /placeholder: 例如 example-large-2
      - text: 厂商 可选
      - textbox "厂商 可选":
        - /placeholder: 例如 openai / deepseek
      - button "复制提示词"
      - status
      - group:
        - text: 查看提示词
        - textbox "提示词"
      - paragraph: 把它粘贴到你选择的 AI 助手中，它会返回一份 YAML 文档。
      - heading "2 上传或粘贴 YAML" [level=3]
      - text: 资料 YAML
      - textbox "资料 YAML":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: 选择 .yaml 文件
      - heading "3 检查并保存" [level=3]
      - paragraph: 检查会校验结构与上限、标记不安全的正则表达式、列出 zing 将发送给中转站的所有提示词，并显示哪些模型 ID 的匹配结果会改变。保存之前不会写入任何内容。
      - button "检查"
      - button "保存到知识库" [disabled]
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 14 个模型
      - list:
        - listitem:
          - code: claude-opus-4-8
          - text: 内置 上下文 1000000 最大输出 128000 别名
          - code: claude-opus-4-8
          - text: ","
          - code: opus
          - text: ","
          - code: opus 4.8
          - text: ","
          - code: most powerful
          - switch "claude-opus-4-8 启用中" [checked]
          - emphasis: 启用中
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph:
    - text: zing · 中转站验真 · 内置资料位于
    - code: zing/knowledge/data
    - text: ；
    - code: ZING_KB_DIR
    - text: 与你的条目叠加在其上
