      - code: tests/a11y
      - text: controlla ogni pagina dell'interfaccia web v2 in un browser reale (Chromium, con axe-core e controlli propri) in ogni lingua dell'interfaccia e nel tema chiaro e scuro. Ogni test indica i passi di verifica che decide.
    - paragraph: "Ultima esecuzione dei test: <report date>. Una revisione dei testi di claude-opus-5-5 è registrata come revisione manuale dei passi che copre."
    - heading "Segnalazioni" [level=3]
    - paragraph:
