- main:
  - heading "Audit history & trends" [level=1]
  - paragraph: Every verification you have run on this machine. Grouped by "relay + claimed model", with a health-score trend line; click any row to expand that report.
  - paragraph:
    - text: History lives only in a local SQLite file under
    - code: ~/.zing
    - text: — nothing is uploaded.
  - region "Filters":
    - button "Filters" [expanded]
