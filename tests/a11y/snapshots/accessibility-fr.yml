        - rowgroup:
          - row "9.1.1.1 A Partiellement automatique Réussi":
            - rowheader "9.1.1.1"
            - cell:
              - group:
                - text: Contenu non textuel
                - paragraph: "Comment c'est testé : Les images, icônes, SVG et contrôles ont une alternative textuelle. La pertinence de chaque alternative est jugée par une personne."
                - paragraph: "Tests automatisés : 30 exécutés, 30 réussis, 0 échoués, 180 ignorés"
                - paragraph:
                  - code: test_wcag_rules_as_loaded
                  - code: test_wcag_rules_every_tab_panel
                  - code: test_wcag_rules_expanded
                - paragraph: "Revue par claude-opus-5-5 (en anglais) : ok"
            - cell "A"
            - cell "Partiellement automatique"
            - cell "Réussi"
          # … more rows of the same shape
  - region "Déclaration d'accessibilité":
    - heading "Déclaration d'accessibilité" [level=2]
    - heading "État de conformité" [level=3]
    - paragraph: L'interface web v2 de zing est partiellement conforme au BITV 2.0, à l'EN 301549 et aux WCAG 2.1 niveau AA.
    - heading "Limites connues" [level=3]
    - paragraph: "La partie automatisée de ces étapes est réussie ; le reste nécessite encore une revue manuelle :"
    - list:
      - listitem: 9.1.3.1 Information et relations
      - listitem: 9.1.3.2 Ordre séquentiel logique
      - listitem: 9.1.4.1 Utilisation de la couleur
      - listitem: 9.1.4.11 Contraste du contenu non textuel
      - listitem: 9.1.4.13 Contenu au survol ou au focus
      - listitem: 9.2.2.2 Mettre en pause, arrêter, masquer
      - listitem: 9.2.4.3 Parcours du focus
      - listitem: 9.2.5.1 Gestes de pointeur
      - listitem: 9.3.2.2 À la saisie
      - listitem: 9.3.3.1 Identification des erreurs
      - listitem: 9.4.1.3 Messages d'état
    - heading "Méthode d'évaluation" [level=3]
    - paragraph:
      - text: "Auto-évaluation : à chaque modification, la suite de tests automatisés de"
      - code: tests/a11y
      - text: vérifie chaque page de l'interface web v2 dans un vrai navigateur (Chromium, avec axe-core et des vérifications propres) dans chaque langue de l'interface et dans les thèmes clair et sombre. Chaque test indique les étapes de test qu'il tranche.
    - paragraph: "Dernière exécution des tests : <report date>. Une revue des textes par claude-opus-5-5 est enregistrée comme revue manuelle des étapes qu’elle couvre."
    - heading "Retour" [level=3]
    - paragraph:
      - text: "Vous avez trouvé un obstacle, ou quelque chose est difficile à utiliser avec une technologie d'assistance ? Dites-le-nous :"
      - link "signaler un problème d'accessibilité sur GitHub":
        - /url: https://github.com/cenbonew/zing/issues
