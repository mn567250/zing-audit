    - text: zing.
  - link "Interface clássica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automático"
    - option "Claro" [selected]
    - option "Escuro"
  - combobox "Animação":
    - option "Animação ligada" [selected]
    - option "Animação desligada"
  - combobox "Idioma":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português" [selected]
    - option "Italiano"
    - option "Deutsch"
  - link "Acessibilidade":
    - /url: /v2/accessibility
  - navigation "Navegação principal":
    - link "Auditoria":
      - /url: /v2/
    - link "Histórico":
      - /url: /v2/history
    - link "Análises":
      - /url: /v2/analytics
    - link "Monitores":
      - /url: /v2/watches
