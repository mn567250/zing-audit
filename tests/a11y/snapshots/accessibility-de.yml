            - cell "A"
            - cell "Teilweise automatisch"
            - cell "Manuelle Prüfung ausstehend"
          # … more rows of the same shape
  - region "Erklärung zur Barrierefreiheit":
    - heading "Erklärung zur Barrierefreiheit" [level=2]
    - heading "Stand der Vereinbarkeit" [level=3]
    - paragraph: Die Web-Oberfläche v2 von zing ist mit BITV 2.0, EN 301549 und WCAG 2.1 Stufe AA teilweise vereinbar.
    - heading "Bekannte Einschränkungen" [level=3]
    - paragraph: "Der automatisierte Teil dieser Schritte ist bestanden; der Rest braucht noch eine manuelle Prüfung:"
    - list:
      - listitem: 9.1.1.1 Nicht-Text-Inhalt
      - listitem: 9.1.3.1 Info und Beziehungen
      - listitem: 9.1.3.2 Bedeutungstragende Reihenfolge
      - listitem: 9.1.3.3 Sensorische Eigenschaften
      - listitem: 9.1.4.1 Benutzung von Farbe
      - listitem: 9.1.4.11 Nicht-Text-Kontrast
      - listitem: 9.1.4.13 Eingeblendeter Inhalt bei Hover oder Fokus
      - listitem: 9.2.2.2 Pausieren, beenden, ausblenden
      - listitem: 9.2.4.3 Fokus-Reihenfolge
      - listitem: 9.2.4.4 Linkzweck (im Kontext)
      - listitem: 9.2.4.6 Überschriften und Beschriftungen
      - listitem: 9.2.5.1 Zeigergesten
      - listitem: 9.3.2.2 Bei Eingabe
      - listitem: 9.3.3.1 Fehlererkennung
      - listitem: 9.3.3.2 Beschriftungen oder Anweisungen
      - listitem: 9.3.3.3 Fehlerempfehlung
      - listitem: 9.4.1.3 Statusmeldungen
    - heading "Wie bewertet wurde" [level=3]
    - paragraph:
      - text: "Selbstbewertung: Bei jeder Änderung prüft die automatisierte Testsuite in"
      - code: tests/a11y
      - text: jede Seite der Web-Oberfläche v2 in einem echten Browser (Chromium, mit axe-core und eigenen Prüfungen) in jeder Sprache der Oberfläche sowie im hellen und im dunklen Design. Jeder Test nennt die Prüfschritte, die er entscheidet.
    - paragraph: "Letzter Testlauf: <report date>. Eine manuelle Prüfung, auch mit Screenreadern, wurde noch nicht durchgeführt."
    - heading "Rückmeldung" [level=3]
    - paragraph:
      - text: "Sind Sie auf eine Barriere gestoßen oder ist etwas mit assistiven Technologien schwer zu bedienen? Bitte sagen Sie es uns:"
      - link "Barriere auf GitHub melden":
        - /url: https://github.com/cenbonew/zing/issues
