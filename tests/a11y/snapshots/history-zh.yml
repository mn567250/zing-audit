      - option "127.0.0.1:9099"
      - option "gateway.a-very-long-relay-hostname.example.org"
      - option "relay.example.com"
    - text: 声称模型
    - combobox "声称模型":
      - option "全部" [selected]
      - option "gpt-4o"
      - option "model-a"
      - option "model-b"
    - text: 套件
    - combobox "套件":
      - option "全部" [selected]
      - option "standard"
    - text: 模式
    - combobox "模式":
      - option "全部" [selected]
      - option "check"
