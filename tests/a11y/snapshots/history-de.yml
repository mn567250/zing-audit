- main:
  - heading "Prüfverlauf & Trends" [level=1]
  - paragraph: Jede Prüfung, die Sie auf diesem Rechner ausgeführt haben, gruppiert nach „Relay + angegebenes Modell“, mit einer Trendlinie des Health-Scores; klicken Sie auf eine Zeile, um den Bericht aufzuklappen.
  - paragraph:
    - text: Der Verlauf liegt nur in einer lokalen SQLite-Datei unter
    - code: ~/.zing
    - text: — nichts wird hochgeladen.
  - region "Filter":
    - button "Filter" [expanded]
    - text: Suche
    - searchbox "Suche"
    - text: Endpunkttyp
    - combobox "Endpunkttyp":
      - option "Alle" [selected]
      - option "Chat"
    - text: Relay / Anbieter
    - combobox "Relay / Anbieter":
      - option "Alle" [selected]
      - option "127.0.0.1:9099"
      - option "gateway.a-very-long-relay-hostname.example.org"
      - option "relay.example.com"
    - text: Angegebenes Modell
    - combobox "Angegebenes Modell":
      - option "Alle" [selected]
      - option "gpt-4o"
      - option "model-a"
      - option "model-b"
    - text: Suite
    - combobox "Suite":
      - option "Alle" [selected]
      - option "standard"
    - text: Modus
    - combobox "Modus":
      - option "Alle" [selected]
      - option "check"
    - text: Protokoll
    - combobox "Protokoll":
      - option "Alle" [selected]
      - option "openai"
      - option "(unbekannt)"
    - text: Protokollerkennung
    - combobox "Protokollerkennung":
      - option "Alle" [selected]
      - option "(unbekannt)"
    - text: Messanfragen
    - combobox "Messanfragen":
      - option "Alle" [selected]
      - option "Streaming"
      - option "(unbekannt)"
    - text: Risiko
    - combobox "Risiko":
      - option "Alle" [selected]
      - option "Konsistent (wahrscheinlich echt)"
      - option "Weitgehend vertrauenswürdig"
      - option "Etikettenschwindel"
    - text: Min. Score
    - spinbutton "Min. Score"
    - text: Zeitraum
    - combobox "Zeitraum":
      - option "Alle" [selected]
      - option "Letzte 7 Tage"
      - option "Letzte 30 Tage"
      - option "Letzte 90 Tage"
    - text: Ausführung
    - combobox "Ausführung":
