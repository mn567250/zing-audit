  - paragraph: Se ejecuta en local · las claves nunca salen
- main:
  - heading "La base de conocimiento con la que audita zing" [level=1]
  - paragraph:
    - text: "Cada auditoría compara un relay con el perfil del modelo que declara: ventana de contexto, límite de salida, capacidades, identidad y huellas de comportamiento. Explora aquí los perfiles y añade tus propios modelos, sin archivos YAML ni instalación editable. Tus entradas se guardan en kb.db en este equipo y las usan tanto la interfaz web como"
    - code: zing check
    - text: .
  - region "Añadir un modelo":
    - heading "Añadir un modelo" [level=2]
    - paragraph: Deja que un asistente de IA investigue el modelo y comprueba aquí su respuesta antes de guardarla.
    - heading "1 Copiar el prompt de investigación" [level=3]
    - text: ID del modelo id
    - textbox "ID del modelo id":
      - /placeholder: p. ej. example-large-2
    - text: Proveedor Opcional
    - textbox "Proveedor Opcional":
      - /placeholder: p. ej. openai / deepseek
    - button "Copiar prompt"
    - status
    - group:
      - text: Mostrar el prompt
      - textbox "Prompt"
    - paragraph: Pégalo en el asistente de IA que prefieras. Responde con un documento YAML.
    - heading "2 Subir o pegar el YAML" [level=3]
    - text: YAML del perfil
    - textbox "YAML del perfil":
      - /placeholder: "provider: …\nmodels:\n- id: …"
    - text: Elegir un archivo .yaml
    - heading "3 Comprobar y guardar" [level=3]
    - paragraph: La comprobación valida el esquema y los límites, marca expresiones regulares inseguras, lista cada prompt que zing enviaría a los relays y muestra qué ID de modelo se resolverían de otra forma. No se guarda nada hasta que guardes.
    - button "Comprobación"
    - button "Guardar en la base" [disabled]
  - region "¿Qué perfil usa un ID de modelo?":
    - heading "¿Qué perfil usa un ID de modelo?" [level=2]
    - textbox "ID del modelo":
      - /placeholder: p. ej. gpt-4o
    - button "Consultar"
    - status
  - heading "Tus entradas" [level=2]
  - link "Exportar como YAML":
    - /url: /api/kb/export
  - paragraph: Aún no tienes entradas propias. Usa los pasos de arriba para añadir tu primer modelo.
