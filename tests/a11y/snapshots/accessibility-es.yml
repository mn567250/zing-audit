    - heading "Estado de conformidad" [level=3]
    - paragraph: La interfaz web v2 de zing es parcialmente conforme con BITV 2.0, EN 301 549 y WCAG 2.1 nivel AA.
    - heading "Limitaciones conocidas" [level=3]
    - paragraph: "La parte automatizada de estos pasos se supera; el resto aún necesita una revisión manual:"
