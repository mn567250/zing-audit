- main:
  - heading "无障碍符合性报告" [level=1]
  - paragraph: 这里列出 BITV 2.0 与 EN 301549（第 9 章，即 WCAG 2.1 A 级与 AA 级）的每个检查步骤：它是如何测试的，以及自动化无障碍测试的最新结果。
  - region "结论":
    - heading "结论" [level=2]
    - paragraph: 部分符合
    - paragraph: 适用的 44 个步骤中：33 个通过，0 个未通过，11 个待人工审核，0 个尚未测试。
    - term: 生成时间
    - definition: <report date>
    - term: 提交
    - definition:
      - code: <id>
    - term: zing 版本
    - definition: 0.20.0
    - term: axe-core 版本
    - definition: 4.13.0
    - term: 测试
    - definition: 1297 个已运行，1297 个通过，0 个失败，0 个跳过
    - term: 语言
    - definition: English, Deutsch, Español, Français, Italiano, Português, 中文
    - term: 主题
    - definition: 浅色, 深色
    - term: 页面
    - definition:
      - code: /v2/
      - code: /v2/history
      - code: /v2/watches
      - code: /v2/tools
      - code: /v2/kb
      - code: /v2/analytics
      - code: /v2/accessibility
  - region "覆盖范围":
    - heading "覆盖范围" [level=2]
    - heading "总体结果" [level=3]
    - paragraph: 75 % 通过 共 44 项
    - list:
      - listitem: 不适用 6 / 50 · 12 %
      - listitem: 通过 33 / 44 · 75 %
      - listitem: 未通过 0 / 44 · 0 %
      - listitem: 待人工审核 11 / 44 · 25 %
      - listitem: 未测试 0 / 44 · 0 %
    - heading "机器 仅测试套件" [level=3]
    - list:
      - listitem: 自动 27 / 44 · 61.4 %
    - heading "人工 仅由人审核" [level=3]
    - list:
      - listitem: 人工 0 / 44 · 0 %
    - heading "机器 人工 先测试套件，再由人审核" [level=3]
    - list:
      - listitem: 部分自动 17 / 44 · 38.6 %
      - listitem: 已审核 6 / 17 待人工审核 11 / 17
    - paragraph: 圆环显示全部 50 个步骤。音频和视频相关的步骤不适用，因为界面中没有音频和视频；其余数字均基于 44 个适用的步骤。
    - paragraph: WCAG 之外还检查了： 用户偏好设置：强制颜色模式（EN 301549 第 11.7 条） — 通过
  - region "检查步骤":
    - heading "检查步骤" [level=2]
    - text: 搜索
    - searchbox "搜索"
    - text: 级别
    - combobox "级别":
      - option "全部" [selected]
      - option "A"
      - option "AA"
    - text: 自动化程度
    - combobox "自动化程度":
      - option "全部" [selected]
      - option "自动"
      - option "部分自动"
      - option "人工"
      - option "不适用"
    - text: 状态
    - combobox "状态":
      - option "全部" [selected]
      - option "通过"
      - option "未通过"
      - option "待人工审核"
      - option "未测试"
      - option "不适用"
    - status: 显示 50 / 50 个步骤
    - region "BITV / EN 301549 检查步骤及其自动化程度与结果":
      - table "BITV / EN 301549 检查步骤及其自动化程度与结果":
        - caption: BITV / EN 301549 检查步骤及其自动化程度与结果
        - rowgroup:
          - row "步骤 标题 级别 自动化程度 状态":
            - columnheader "步骤"
            - columnheader "标题"
            - columnheader "级别"
            - columnheader "自动化程度"
            - columnheader "状态"
        - rowgroup:
          - row "9.1.1.1 A 部分自动 通过":
            - rowheader "9.1.1.1"
            - cell:
              - group:
                - text: 非文本内容
                - paragraph: 测试方式： 图像、图标、SVG 和控件都有文本替代。每个替代文本是否有意义由人工判断。
                - paragraph: 自动化测试： 30 个已运行，30 个通过，0 个失败，180 个跳过
                - paragraph:
                  - code: test_wcag_rules_as_loaded
                  - code: test_wcag_rules_every_tab_panel
                  - code: test_wcag_rules_expanded
                - paragraph: claude-opus-5-5 审核（英文）： ok
            - cell "A"
            - cell "部分自动"
            - cell "通过"
          # … more rows of the same shape
  - region "无障碍声明":
    - heading "无障碍声明" [level=2]
    - heading "符合状态" [level=3]
    - paragraph: zing 网页界面 v2 与 BITV 2.0、EN 301549 和 WCAG 2.1 AA 级部分符合。
    - heading "已知限制" [level=3]
    - paragraph: 以下步骤的自动化部分已通过，其余部分仍需人工审核：
    - list:
      - listitem: 9.1.3.1 信息和关系
      - listitem: 9.1.3.2 有意义的顺序
      - listitem: 9.1.4.1 颜色的使用
      - listitem: 9.1.4.11 非文本对比度
      - listitem: 9.1.4.13 悬停或聚焦时的内容
      - listitem: 9.2.2.2 暂停、停止、隐藏
      - listitem: 9.2.4.3 焦点顺序
      - listitem: 9.2.5.1 指针手势
      - listitem: 9.3.2.2 输入时
      - listitem: 9.3.3.1 错误识别
      - listitem: 9.4.1.3 状态消息
    - heading "评估方式" [level=3]
    - paragraph:
      - text: 自我评估：每次变更时，
      - code: tests/a11y
      - text: 中的自动化测试套件都会在真实浏览器（Chromium，使用 axe-core 和自有检查）中，以每种界面语言、浅色与深色主题检查网页界面 v2 的每个页面。每个测试都标明它所判定的检查步骤。
    - paragraph: 最近一次测试：<report date>。claude-opus-5-5 对文本的审核已记录为其所涵盖步骤的人工审核。
    - heading "反馈" [level=3]
    - paragraph:
      - text: 发现了障碍，或者某些功能难以通过辅助技术使用？请告诉我们：
      - link "在 GitHub 上报告无障碍问题":
        - /url: https://github.com/cenbonew/zing/issues
- contentinfo:
  - paragraph:
    - text: zing · 中转站验真 · 本报告由
    - code: tests/a11y
    - text: 中的自动化无障碍测试生成
