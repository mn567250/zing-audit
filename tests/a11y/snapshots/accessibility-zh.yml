      - text: 中的自动化测试套件都会在真实浏览器（Chromium，使用 axe-core 和自有检查）中，以每种界面语言、浅色与深色主题检查网页界面 v2 的每个页面。每个测试都标明它所判定的检查步骤。
    - paragraph: 最近一次测试：2026年10月4日 19:42。尚未进行包括屏幕阅读器在内的人工审核。
