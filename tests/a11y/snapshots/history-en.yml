              - paragraph: Score from one detector.
              - heading "Model identity & downgrade fingerprinting Score 20" [level=4]
              - list "Model identity & downgrade fingerprinting Score 20":
                - listitem:
                  - text: "Result: Fail. Self-identifies as a rival brand Self-identifies as a rival brand (claude) under the claimed model id gpt-4o, without naming the genuine brand. · Recommendation: A response naming a different vendor strongly suggests model substitution."
                  - button "Hide evidence" [expanded]
                  - text: "prompt: self-id target_answer: I am Claude, a model made by Anthropic. forbidden_hits: [\"claude\",\"anthropic\"]"
                - listitem:
                  - text: "Result: Fail. Fingerprint divergence: self-identification style Probe 'self-identification style' surfaced a forbidden brand (claude); expected behavior consistent with gpt-4o."
                  - button "Hide evidence" [expanded]
                  - text: "probe: self-id native_expected: Genuine OpenAI models identify as an OpenAI model (a GPT/ChatGPT/GPT-5-family model trained by OpenAI). They do NOT claim to be Claude, Gemini, Llama, Qwen, or DeepSeek. downgrade_signal: A substituted backend self-identifies as Claude/Anthropic, Gemini/Google, Llama/Meta, Qwen/Alibaba, or DeepSeek — an immediate tell. Note exact OpenAI version self-ID is unreliable (models are not reliably aware of their own minor version), observed: I am Claude, a model made by Anthropic. weight: 1"
                - listitem:
                  - text: "Result: Warning. Fingerprint divergence: max-output / context truncation Probe 'max-output / context truncation' diverged from native behavior. Expected: Genuine GPT-5.x/4.1 honors a very large max_completion_tokens; with max set to e.g. 40000 it streams tens of thousands of tokens before stopping. Reaching well past 16384 output tokens proves it is not a 4o-class (16384 cap) or a quietly capped relay.."
                  - button "Hide evidence" [expanded]
                  - text: "probe: max-output-truncation native_expected: Genuine GPT-5.x/4.1 honors a very large max_completion_tokens; with max set to e.g. 40000 it streams tens of thousands of tokens before stopping. Reaching well past 16384 output tokens proves it is not a 4o-class (16384 cap) or a quietly ca downgrade_signal: A relay fronting gpt-4o/4o-mini hard-stops at 16384 output tokens; a context-truncating relay stops far earlier. Set max_completion_tokens=40000 and check the emitted line count / completion_tokens. observed: Blue. The answer is 42. weight: 1"
                - listitem:
                  - text: "Result: Warning. Echoed model field differs from requested Response 'model' field (gpt-4o-mini) differs from requested (gpt-4o). · Recommendation: A smaller-tier or different-family model id in the response suggests routing to a substitute."
                  - button "Hide evidence" [expanded]
                  - text: "requested: gpt-4o returned: gpt-4o-mini"
