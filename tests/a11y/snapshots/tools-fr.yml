  - paragraph: Exécution locale · les clés ne sortent jamais
- main:
  - heading "Boîte à outils · vérification embedding / rerank" [level=1]
  - paragraph: "Les endpoints d'embedding et de rerank renvoient des vecteurs ou des classements, pas du chat : ils ont donc leurs propres sondes au lieu de l'audit de chat."
  - list:
    - listitem: "Signal clé Dimension des vecteurs face au modèle annoncé : le signal n° 1 de tromperie sur la marchandise."
    - listitem: Complément Des tests répétés de déterminisme et de distinction le confirment.
    - listitem: "Rerank Une sonde à réponse connue : la réponse évidente doit arriver en tête."
  - tablist "Type de vérification":
    - tab "Audit d'embedding" [selected]
    - tab "Audit de rerank"
  - tabpanel "Audit d'embedding":
    - text: Relais / fournisseur Facultatif
    - combobox "Relais / fournisseur Facultatif":
      - option "Sélectionnez un relais ou un fournisseur…" [selected]
      - option "Autre (saisir l'URL)"
    - text: En choisir un remplit son URL ; pour tout autre relais, choisissez « Autre » et saisissez l'URL. URL du relais base_url
    - combobox "URL du relais base_url"
    - text: Clé API Accepte env:VAR / file:/chemin
    - textbox "Clé API":
      - /placeholder: sk-... ou env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Afficher la clé" [pressed]
    - text: Modèle demandé model
    - textbox "Modèle demandé model":
      - /placeholder: text-embedding-3-large
    - button "Actualiser les modèles" [disabled]
    - status: Sélectionnez un relais ou saisissez son URL, et zing liste ses modèles.
    - text: Modèle annoncé claimed_model Facultatif
    - combobox "Modèle annoncé claimed_model Facultatif":
      - option "Identique au modèle demandé" [selected]
    - button "Saisir manuellement"
    - text: Seulement si le relais le vend sous un autre nom — zing vérifie les réponses par rapport à ce modèle. Dimension annoncée claimed_dimensions Facultatif
    - spinbutton "Dimension annoncée claimed_dimensions Facultatif"
    - text: Protocole
    - group "Protocole":
      - button "Auto" [pressed]
      - button "Compatible OpenAI"
    - text: Les endpoints d'embedding et de rerank ne parlent que l'API compatible OpenAI.
    - button "Vérifier le point d'accès d'embedding"
    - text: Les requêtes partent de votre serveur zing local ; la clé sert uniquement à se connecter au relais cible et n'est jamais transmise à un tiers.
  - paragraph: "Les contrôles embedding/rerank sont des tests boîte noire hors chat : une dimension incorrecte est le signal de « tromperie » le plus fort ; le déterminisme et la distinction sont des preuves complémentaires."
- contentinfo:
  - paragraph:
    - link "Accessibilité":
      - /url: /v2/accessibility
