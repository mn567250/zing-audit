- main:
  - heading "Accessibility conformance report" [level=1]
  - paragraph: "Every test step of BITV 2.0 and EN 301549 (chapter 9, the same as WCAG 2.1 level A and AA): how it is tested and the latest result of the automated accessibility tests."
  - region "Status":
    - heading "Status" [level=2]
    - paragraph: Partially conformant
    - paragraph: Of 44 applicable steps, 27 pass, 0 fail, 17 await a manual review and 0 are not tested yet.
    - term: Generated
    - definition: <report date>
    - term: Commit
    - definition:
      - code: <id>
    - term: zing version
    - definition: 0.18.0
    - term: axe-core version
    - definition: 4.13.0
    - term: Tests
    - definition: 1115 run, 1115 passed, 0 failed, 0 skipped
    - term: Languages
    - definition: English, Deutsch, Español, Français, Italiano, Português, 中文
    - term: Themes
    - definition: Light, Dark
    - term: Pages
    - definition:
      - code: /v2/
      - code: /v2/history
      - code: /v2/watches
      - code: /v2/tools
      - code: /v2/kb
      - code: /v2/accessibility
  - region "Coverage":
    - heading "Coverage" [level=2]
    - heading "How the steps are tested" [level=3]
    - list:
      - listitem: Automatic 27 of 44 · 61.4 %
      - listitem: Partly automatic 17 of 44 · 38.6 %
      - listitem: Manual 0 of 44 · 0 %
      - listitem: Not applicable 6
    - heading "Results" [level=3]
    - list:
      - listitem: Pass 27 of 44 · 61.4 %
      - listitem: Fail 0 of 44 · 0 %
      - listitem: Manual review pending 17 of 44 · 38.6 %
      - listitem: Not tested 0 of 44 · 0 %
      - listitem: Not applicable 6
    - paragraph: Percentages are of the applicable steps; steps about audio and video do not apply because the UI has none.
    - paragraph: "Also checked beyond WCAG: User preferences: forced colours mode (EN 301549 clause 11.7) — Pass"
  - region "Test steps":
    - heading "Test steps" [level=2]
    - text: Status
    - combobox "Status":
      - option "All" [selected]
      - option "Fail"
      - option "Pass"
      - option "Manual review pending"
      - option "Not tested"
      - option "Not applicable"
    - text: Automation
    - combobox "Automation":
      - option "All" [selected]
      - option "Automatic"
      - option "Partly automatic"
      - option "Manual"
      - option "Not applicable"
    - text: Search
    - searchbox "Search"
    - status: Showing 50 of 50 steps
    - region "BITV / EN 301549 test steps with automation level and result":
      - table "BITV / EN 301549 test steps with automation level and result":
        - caption: BITV / EN 301549 test steps with automation level and result
        - rowgroup:
          - row "Step Title Level Automation Status":
            - columnheader "Step"
            - columnheader "Title"
            - columnheader "Level"
            - columnheader "Automation"
            - columnheader "Status"
        - rowgroup:
          - row "9.1.1.1 A Partly automatic Manual review pending":
            - rowheader "9.1.1.1"
            - cell:
              - group:
                - text: Non-text Content
                - paragraph: "How it is tested: Images, icons, SVGs and controls have a text alternative. Whether each alternative is meaningful is judged by a person."
                - paragraph: "Automated tests: 14 run, 14 passed, 0 failed, 166 skipped"
                - paragraph:
                  - code: test_wcag_rules_as_loaded
                  - code: test_wcag_rules_every_tab_panel
                  - code: test_wcag_rules_expanded
            - cell "A"
            - cell "Partly automatic"
            - cell "Manual review pending"
          # … more rows of the same shape
  - region "Accessibility statement":
    - heading "Accessibility statement" [level=2]
    - heading "Conformance status" [level=3]
    - paragraph: Web UI v2 of zing is partially conformant with BITV 2.0, EN 301549 and WCAG 2.1 level AA.
    - heading "Known limitations" [level=3]
    - paragraph: "The automated part of these steps passes; the rest still needs a manual review:"
    - list:
      - listitem: 9.1.1.1 Non-text Content
      - listitem: 9.1.3.1 Info and Relationships
      - listitem: 9.1.3.2 Meaningful Sequence
      - listitem: 9.1.3.3 Sensory Characteristics
      - listitem: 9.1.4.1 Use of Color
      - listitem: 9.1.4.11 Non-text Contrast
      - listitem: 9.1.4.13 Content on Hover or Focus
      - listitem: 9.2.2.2 Pause, Stop, Hide
      - listitem: 9.2.4.3 Focus Order
      - listitem: 9.2.4.4 Link Purpose (In Context)
      - listitem: 9.2.4.6 Headings and Labels
      - listitem: 9.2.5.1 Pointer Gestures
      - listitem: 9.3.2.2 On Input
      - listitem: 9.3.3.1 Error Identification
      - listitem: 9.3.3.2 Labels or Instructions
      - listitem: 9.3.3.3 Error Suggestion
      - listitem: 9.4.1.3 Status Messages
    - heading "How it was assessed" [level=3]
    - paragraph:
      - text: "Self-assessment: on every change, the automated test suite in"
      - code: tests/a11y
      - text: checks every page of web UI v2 in a real browser (Chromium, with axe-core and checks of its own) in every UI language and in the light and the dark theme. Each test names the test steps it decides.
    - paragraph: "Last test run: <report date>. A manual review, including screen readers, has not been made yet."
    - heading "Feedback" [level=3]
    - paragraph:
      - text: "Did you find a barrier, or is something hard to use with assistive technology? Please tell us:"
      - link "report an accessibility issue on GitHub":
        - /url: https://github.com/cenbonew/zing/issues
- contentinfo:
  - paragraph:
    - text: zing · relay reality check · this report is generated from the automated accessibility tests in
