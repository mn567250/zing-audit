- banner:
  - link "Vai al contenuto principale":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "Interfaccia classica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automatico"
    - option "Chiaro" [selected]
    - option "Scuro"
  - combobox "Lingua":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano" [selected]
    - option "Deutsch"
  - navigation "Navigazione principale":
    - link "Verifica":
      - /url: /v2/
    - link "Strumenti":
      - /url: /v2/tools
    - link "Cronologia":
      - /url: /v2/history
    - link "Monitor":
      - /url: /v2/watches
    - link "Modelli":
      - /url: /v2/kb
  - paragraph: Esecuzione locale · le chiavi non escono mai
- main:
  - heading "Strumenti · verifica di embedding / rerank" [level=1]
  - paragraph: "Gli endpoint di embedding e rerank restituiscono vettori o classifiche, non chat: per questo hanno sonde dedicate invece della verifica chat."
  - list:
    - listitem: "Segnale chiave Dimensione dei vettori rispetto al modello dichiarato: il segnale n. 1 di merce non conforme."
    - listitem: Supporto Le ripetizioni di determinismo e distinzione lo confermano.
    - listitem: "Rerank Una sonda a risposta nota: la risposta ovvia deve risultare prima."
  - tablist "Tipo di verifica":
    - tab "Verifica embedding" [selected]
    - tab "Verifica rerank"
  - tabpanel "Verifica embedding":
    - text: URL dell'intermediario base_url
    - textbox "URL dell'intermediario base_url":
      - /placeholder: https://relay.example.com/v1
    - text: Chiave API Supporta env:VAR / file:/percorso
    - textbox "Chiave API":
      - /placeholder: sk-... o env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Mostra chiave" [pressed]
    - text: Modello richiesto model
    - combobox "Modello richiesto fornitore":
      - option "Seleziona fornitore…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "Personalizzato (dal relay)"
    - button "Recupera modelli" [disabled]
    - status
    - combobox "Modello richiesto modello" [disabled]:
      - option "Seleziona modello…" [selected]
    - button "Inserimento libero"
    - text: Modello dichiarato claimed_model Facoltativo
    - textbox "Modello dichiarato claimed_model Facoltativo":
      - /placeholder: Vuoto = come il modello richiesto
    - text: Solo se l'intermediario lo vende con un altro nome — zing confronta le risposte con questo modello. Dimensione dichiarata claimed_dimensions Facoltativo
    - spinbutton "Dimensione dichiarata claimed_dimensions Facoltativo"
    - text: Fornitore dichiarato declared_provider Facoltativo
    - textbox "Fornitore dichiarato declared_provider Facoltativo":
      - /placeholder: ad es. openai / deepseek
    - text: Aiuta zing a scegliere il profilo di modello giusto quando il solo nome del modello è ambiguo. Scegliere un modello dall'elenco lo compila. Protocollo
    - group "Protocollo":
      - button "Auto" [pressed]
      - button "Compatibile OpenAI"
    - text: Gli endpoint di embedding e rerank parlano solo l'API compatibile OpenAI.
    - button "Verifica endpoint di embedding"
    - text: Le richieste partono dal tuo server zing locale; la chiave serve solo a collegarsi all'intermediario di destinazione e non viene mai inviata a terzi.
  - paragraph: "I controlli di embedding/rerank sono test black-box senza chat: una dimensione errata è il segnale più forte di «merce non conforme»; determinismo e distinzione sono prove di supporto."
- contentinfo:
  - paragraph:
    - link "Accessibilità":
