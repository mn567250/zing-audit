<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-en="zing — monitors">zing — 监控</title>
<script src="/locales.js"></script>
<script src="/lang.js"></script>
<script src="/v2/static/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/v2/static/zing.css" />
<link rel="stylesheet" href="/v2/static/fields.css" />
<style>
  /* ---- monitors page (v2) — page-only rules; colours via zing.css tokens ---- */
  /* inline field errors */
  .in[aria-invalid="true"] { border-color: var(--bad); }
  .in[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px var(--badbg); }
  .ferr { margin: 6px 0 0; font-size: 12.5px; font-weight: 600; color: var(--bad); line-height: 1.45; }
  .ferr[hidden] { display: none; }
  /* number input with a unit suffix */
  .unit-in { position: relative; }
  .unit-in .in { padding-right: 96px; }
  .unit-in .unit {
    position: absolute; top: 0; bottom: 0; right: 14px; display: flex; align-items: center;
    font-size: 13px; font-weight: 600; color: var(--ink2); pointer-events: none;
    max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sw-t { font-style: normal; }
  /* the unit suffix sits where the native spinner would */
  .unit-in input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .unit-in input[type="number"]::-webkit-inner-spin-button,
  .unit-in input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .edit .unit-in .in { padding-right: 76px; }
  .edit .unit-in .unit { right: 10px; font-size: 12px; }
  .switch:has(input:disabled) { cursor: not-allowed; opacity: 0.55; }

  /* monitor cards */
  .mons { display: flex; flex-direction: column; gap: 12px; }
  .mon { padding: 18px 20px; min-width: 0; }
  @media (max-width: 520px) { .mon { padding: 16px; } }
  /* paused: a dashed card edge instead of fading the body (opacity pushed its
     text below 4.5:1, WCAG 1.4.3); the state itself is spelled out by the switch */
  .mon.off { border-style: dashed; border-color: var(--line-strong); }
  .mon.flash { animation: mon-flash 1.6s ease-out; }
  @keyframes mon-flash { from { box-shadow: 0 0 0 3px var(--focus-ring), var(--shadow-card); } }
  .mon-top { display: flex; align-items: flex-start; gap: 10px 14px; flex-wrap: wrap; }
  .mon-title { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; min-width: 0; flex: 1 1 220px; }
  .mon-name {
    font-family: var(--disp); font-weight: 600; font-size: 17px; letter-spacing: -0.3px; margin: 0;
    overflow-wrap: anywhere; min-width: 0;
  }
  .mon-top .switch { flex: 0 0 auto; margin-left: auto; }
  .mon-url { font-family: var(--mono); font-size: 12.5px; color: var(--ink2); margin-top: 6px; overflow-wrap: anywhere; }
  .mon-meta {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 16px;
    margin: 14px 0 0; padding: 14px 0 0; border-top: 1px dashed var(--line-strong);
  }
  /* each item spans a label row and a value row of the parent grid (subgrid),
     so a label that wraps (DE "Sprache der Warnungen") moves its whole row down
     and every value in the row still starts on the same line */
  .mon-meta > div { min-width: 0; display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 4px; align-content: start; }
  .mon-meta dt {
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--faint); margin: 0;
    align-self: end;
  }
  /* an open inline editor gets the whole row, so its field and Save / Cancel fit */
  .mon-meta > div:has(.edit) { grid-column: 1 / -1; }
  .mon-meta dd .edit { max-width: 440px; }
  .mon-meta dd { margin: 0; font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; line-height: 1.45; }
  .mon-meta dd code {
    font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px;
  }
  .mon-meta dd .aside { display: block; margin-top: 2px; }
  .mon-meta select.in { font-size: 13px; padding: 6px 30px 6px 10px; border-radius: 10px; background-position: right 15px center, right 10px center; }
  .mon-last {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 14px;
    font-size: 13px; color: var(--ink2);
  }
  .mon-last b { color: var(--ink); }
  .mon-last a { font-weight: 700; font-size: 12.5px; text-decoration: none; }
  .mon-last a:hover { text-decoration: underline; }
  .mon-msg { margin-top: 10px; font-size: 13px; font-weight: 600; line-height: 1.45; }
  .mon-msg:empty { display: none; }
  .mon-msg.ok { color: var(--good); }
  .mon-msg.bad { color: var(--bad); }
  .mon-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .mon-act .ask { font-size: 13px; font-weight: 600; color: var(--bad); margin-right: 4px; }
  .mon-prog { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--sky); }
  .mon-prog .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--skybg); overflow: hidden; }
  .mon-prog .bar > span { display: block; height: 100%; background: var(--sky); border-radius: 3px; transition: width .4s ease; }
  .mon-prog b { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .spin { display: inline-flex; animation: mon-spin 1s linear infinite; }
  @keyframes mon-spin { to { transform: rotate(360deg); } }
  #list-title:focus { outline: none; }
  .mon-meta dd .edit { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .mon-meta dd .edit .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mon-meta dd .edit .in { font-size: 13px; padding: 7px 10px; border-radius: 10px; }
  .mon-meta dd .link { margin-left: 6px; }
  /* negative block margins: the pen button does not make its line taller, so
     "Stored ✎" starts on the same line as the plain values beside it */
  .mon-meta dd .link.icon-only { padding: 6px; line-height: 0; vertical-align: middle; margin-block: -6px; }
  .mon-meta dd .link.icon-only .zicon { width: 16px; height: 16px; }
  /* draft: a watch scheduled from a history run that still needs its interval / key */
  .setup {
    margin-top: 14px; padding: 14px 16px; border-radius: 14px;
    background: var(--warnbg); border: 1px solid var(--warn);
  }
  .setup h4 { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .setup > p { margin: 0 0 12px; font-size: 13px; color: var(--ink2); line-height: 1.5; }
  .setup .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; align-items: start; }
  .setup .lab { font-size: 12.5px; }
  .setup .go { margin-top: 12px; }
  .empty.boxed { border: 1.5px dashed var(--line-strong); border-radius: 18px; }
  .empty p { margin: 8px 0 0; }
  .empty a { font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header class="znav" data-page="monitors" data-trust></header>
  <main id="main" tabindex="-1">
    <div class="hero">
      <h1 data-en="Put a <span class='u'>scheduled sentinel</span> on your relay">给中转站设个<span class="u">定时哨兵</span></h1>
      <p data-en="Every monitor re-runs an audit you already ran, on your machine, at the interval you set. To add one, open a run in <a href='/v2/history'>History</a> and choose <b>Schedule as monitor</b> — then set its interval here and switch it on. When the risk crosses your threshold or gets worse than last time, zing alerts your webhooks (Slack / Feishu / DingTalk / generic JSON).">每个监控都会在你本地、按设定的间隔重跑一次你已经跑过的检测。添加方式：在<a href="/v2/history">检测历史</a>中打开一次运行，选择<b>设为监控</b>，然后在这里设置间隔并启用。一旦风险越线或较上次恶化，zing 就向你配置的 Webhook（Slack / 飞书 / 钉钉 / 通用 JSON）推送告警。</p>
    </div>

    <!-- the master key that encrypts the stored API keys -->
    <div id="mk-bar" aria-live="polite"></div>

    <!-- list -->
    <h2 class="section-title" id="list-title" tabindex="-1" style="margin-top:24px"><span data-en="Configured monitors">已配置的监控</span> <span class="count" id="count"></span></h2>
    <div class="mons" id="list" aria-live="polite"><p class="empty" data-en="Loading…">加载中…</p></div>
    <p class="reassure"><span class="pico" id="lock-icon"></span> <span data-en="Everything <b>runs locally</b>. The API key is stored <b>encrypted</b>, only in the local database under <b>~/.zing</b> on this machine; it <b>never</b> appears in the monitor list and is never sent to the browser. The master key that decrypts it is <b>never written to disk</b>: you keep it, and enter it after each restart.">全程<b>本地运行</b>。API Key 仅<b>加密</b>保存在本机 <b>~/.zing</b> 的本地数据库里，<b>绝不</b>出现在监控列表里、也不会发给浏览器。用于解密的主密钥<b>从不写入磁盘</b>：由你保管，每次重启后再输入。</span></p>
  </main>
  <footer><p class="foot" data-en="zing · relay reality check · monitors are scheduled in the background by the <code>zing serve</code> process">zing · 中转站验真 · 监控由 <code>zing serve</code> 进程在后台调度</p></footer>
</div>
<script src="/i18n.js"></script>
<script src="/icons.js"></script>
<script src="/secretfield.js"></script>
<script src="/v2/static/masterkey.js"></script>
<script src="/v2/static/nav.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var L = window.ZING_LANG;

  function icon(name, opts) {
    return typeof window.zingIcon === "function" ? window.zingIcon(name, opts) : "";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // T(zh, en) with {name} placeholders filled after translation.
  function Tf(zh, en, vals) {
    var s = T(zh, en);
    Object.keys(vals || {}).forEach(function (k) {
      s = s.split("{" + k + "}").join(String(vals[k]));
    });
    return s;
  }

  // ---- vocabulary ------------------------------------------------------- //
  var THRESHOLD = {
    low: ["低及以上", "Low and above"],
    medium: ["中及以上", "Medium and above"],
    high: ["仅高", "High only"],
  };
  var RISK_CLASS = { clean: "good", low: "sky", medium: "warn", high: "bad", inconclusive: "grey" };

  function riskLabel(v) {
    return window.ZING_I18N ? window.ZING_I18N.label("RISK_LEVEL", v) : v;
  }
  function fmtEvery(sec) {
    sec = Number(sec) || 0;
    if (sec >= 3600 && sec % 3600 === 0) return Tf("每 {n} 小时", "every {n} h", { n: sec / 3600 });
    if (sec >= 60 && sec % 60 === 0) return Tf("每 {n} 分钟", "every {n} min", { n: sec / 60 });
    return Tf("每 {n} 秒", "every {n} s", { n: sec });
  }
  function fmtTime(ts) {
    if (!ts) return T("从未运行", "Never run");
    try {
      return new Date(ts * 1000).toLocaleString(L.locale(), { dateStyle: "medium", timeStyle: "short" });
    } catch (e) {
      return new Date(ts * 1000).toLocaleString();
    }
  }
  function fmtScore(v) {
    var n = Number(v);
    return isFinite(n) ? String(Math.round(n)) : "—";
  }
  function langOptions(selected) {
    return L.langs().map(function (l) {
      return '<option value="' + esc(l.code) + '"' + (l.code === selected ? " selected" : "") + ">" + esc(l.label) + "</option>";
    }).join("");
  }
  function thresholdOptions(selected) {
    return ["low", "medium", "high"].map(function (v) {
      return '<option value="' + v + '"' + (v === selected ? " selected" : "") + ">" + esc(T(THRESHOLD[v][0], THRESHOLD[v][1])) + "</option>";
    }).join("");
  }
  function isHttpUrl(s) {
    return /^https?:\/\/\S+$/i.test(s);
  }
  function hooksText(n) {
    if (!n) return T("无 Webhook", "No webhooks");
    if (n === 1) return T("1 个 Webhook", "1 webhook");
    return Tf("{n} 个 Webhook", "{n} webhooks", { n: n });
  }

  // ---- list state --------------------------------------------------------- //
  var watches = null; // last list from the server
  var loadErr = false;
  // per-monitor transient UI state:
  //   running, confirm, busy, msg (fn), msgKind,
  //   edit: null | "interval" | "key" | "hooks"   (an open inline editor)
  //   vals: {interval, key, hooks}                 (typed values, kept across re-renders)
  //   errs: {interval, key, hooks}                 (fn → message)
  var ui = {};
  function st(id) { return ui[id] || (ui[id] = { vals: {}, errs: {} }); }

  // A watch scheduled from a history run starts without an interval, so it
  // needs one before it runs. The key is optional, exactly as on the audit page
  // (self-hosted relays such as Ollama or LM Studio need none): history never
  // stores it, so the setup box offers it once, but never requires it.
  function needsInterval(w) { return w.interval_sec == null; }
  function needsSetup(w) { return needsInterval(w); }

  function minutesOf(raw) {
    raw = String(raw == null ? "" : raw).trim();
    if (!/^\d+$/.test(raw)) return null;
    var n = parseInt(raw, 10);
    return n >= 1 ? n : null;
  }
  function hooksOf(raw) {
    return String(raw == null ? "" : raw).split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function checkInterval(raw) {
    return minutesOf(raw) == null
      ? function () { return T("请选择运行间隔。", "Choose how often it runs."); }
      : null;
  }
  // The intervals offered (minutes). A monitor never runs more often than one
  // run takes: the server rounds the measured run time up to one of these.
  var STEPS = [5, 10, 15, 20, 30, 60, 120, 180, 240, 360, 480, 720, 1440];
  function minMinutes(w) { return Math.max(1, Math.round((w.min_interval_sec || 300) / 60)); }
  function fmtDuration(sec) {
    sec = Number(sec) || 0;
    if (sec < 60) return Tf("{n} 秒", "{n} s", { n: Math.max(1, Math.round(sec)) });
    if (sec < 3600) return Tf("{n} 分钟", "{n} min", { n: Math.round(sec / 6) / 10 });
    return Tf("{n} 小时", "{n} h", { n: Math.round(sec / 360) / 10 });
  }
  function checkKey(raw) {
    return String(raw == null ? "" : raw).trim()
      ? null
      : function () { return T("请填写 API 密钥（或 env:变量名）。", "Enter the API key (or env:VAR)."); };
  }
  function checkHooks(raw) {
    var lines = hooksOf(raw);
    for (var i = 0; i < lines.length; i++) {
      if (!isHttpUrl(lines[i])) {
        var line = i + 1;
        return function () {
          return Tf("第 {n} 行不是以 http:// 或 https:// 开头的地址。", "Line {n} is not a URL starting with http:// or https://.", { n: line });
        };
      }
    }
    return null;
  }

  // ---- card pieces -------------------------------------------------------- //
  function isRunning(w) { return !!(w.running || st(w.id).running); }
  function badge(w) {
    if (isRunning(w)) return '<span class="badge sky"><span class="spin">' + icon("refresh") + "</span> " + esc(T("运行中", "Running")) + "</span>";
    if (needsSetup(w)) return '<span class="badge warn">' + esc(T("待设置", "Needs setup")) + "</span>";
    if (w.last_risk) {
      return '<span class="badge ' + (RISK_CLASS[w.last_risk] || "grey") + '">' + esc(riskLabel(w.last_risk)) + "</span>";
    }
    if (w.last_run_ts) return '<span class="badge grey">' + esc(T("无结果", "No result")) + "</span>";
    return '<span class="badge grey">' + esc(T("尚未运行", "Not run yet")) + "</span>";
  }
  function meta(dt, dd) {
    return "<div><dt>" + esc(dt) + "</dt><dd>" + dd + "</dd></div>";
  }
  function err(id, fn) {
    return '<p class="ferr" id="' + id + '"' + (fn ? "" : " hidden") + ">" + (fn ? esc(fn()) : "") + "</p>";
  }
  function invalid(fn) { return fn ? ' aria-invalid="true"' : ""; }
  // Own copy of the pen glyph: a browser-cached older /icons.js has no "pen", which left an empty button.
  var PEN_SVG = '<svg class="zicon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>';
  function linkBtn(act, id, label) {
    return '<button type="button" class="btn sm link icon-only" data-act="' + act + '" data-id="' + id + '" aria-label="' + esc(label) + '" title="' + esc(label) + '">' + PEN_SVG + "</button>";
  }
  function saveCancel(act, id) {
    return '<div class="row">' +
      '<button type="button" class="btn sm pri" data-act="save-' + act + '" data-id="' + id + '">' + icon("check") + esc(T("保存", "Save")) + "</button>" +
      '<button type="button" class="btn sm" data-act="cancel" data-id="' + id + '">' + esc(T("取消", "Cancel")) + "</button></div>";
  }
  // The interval picker: the draft's setup and the configured card's editor share it.
  function intervalInput(w, s, small) {
    var v = s.vals.interval != null ? s.vals.interval : (w.interval_sec ? String(Math.round(w.interval_sec / 60)) : "");
    var floor = minMinutes(w);
    var steps = STEPS.filter(function (m) { return m >= floor; });
    if (!steps.length) steps = [STEPS[STEPS.length - 1]];
    var opts = "";
    if (!minutesOf(v)) opts += '<option value="" selected>' + esc(T("请选择…", "Choose…")) + "</option>";
    // an interval set before (outside the steps, or now below the run time) stays selectable as is
    if (minutesOf(v) && steps.indexOf(minutesOf(v)) < 0) {
      opts += '<option value="' + esc(v) + '" selected>' + esc(fmtEvery(minutesOf(v) * 60)) + "</option>";
    }
    steps.forEach(function (m) {
      opts += '<option value="' + m + '"' + (minutesOf(v) === m ? " selected" : "") + ">" + esc(fmtEvery(m * 60)) + "</option>";
    });
    var hint = w.run_duration_sec
      ? Tf("上次完整运行耗时 {d}，因此最短间隔为{every}。", "One full run took {d}, so it runs at most {every}.",
          { d: fmtDuration(w.run_duration_sec), every: fmtEvery(floor * 60) })
      : "";
    return '<select class="in" id="iv-' + w.id + '" data-act="f-interval" data-id="' + w.id + '"' +
      (small ? ' aria-label="' + esc(T("检测间隔", "Check interval")) + '"' : "") +
      ' aria-describedby="ivh-' + w.id + " ive-" + w.id + '"' + invalid(s.errs.interval) + ">" + opts + "</select>" +
      '<p class="hint" id="ivh-' + w.id + '">' + esc(hint) + "</p>" + err("ive-" + w.id, s.errs.interval);
  }
  // The key field, paired with the relay URL (a hidden username field) so the
  // browser's password manager can fill the key saved from the audit page.
  function keyInput(w, s, small) {
    return '<input class="sr-only" type="text" tabindex="-1" aria-hidden="true" readonly autocomplete="username"' +
      ' id="ku-' + w.id + '" value="' + esc(w.base_url || "") + '">' +
      '<input class="in mono" type="password" id="k-' + w.id + '" data-secret="ku-' + w.id + '" data-act="f-key" data-id="' + w.id + '"' +
      ' autocomplete="current-password" spellcheck="false" autocapitalize="off"' +
      ' placeholder="' + esc(T("sk-... 或 env:ZING_API_KEY", "sk-... or env:ZING_API_KEY")) + '"' +
      (small ? ' aria-label="' + esc(T("API 密钥", "API key")) + '"' : "") +
      ' value="' + esc(s.vals.key || "") + '" aria-describedby="ke-' + w.id + '"' + invalid(s.errs.key) + ">" +
      err("ke-" + w.id, s.errs.key);
  }

  function setupBox(w, s) {
    var fields = "";
    if (needsInterval(w)) {
      fields += '<div><label class="lab" for="iv-' + w.id + '">' + esc(T("检测间隔", "Check interval")) + "</label>" + intervalInput(w, s) + "</div>";
    }
    if (w.source_report_id != null && !w.has_key) {
      fields += '<div><label class="lab" for="k-' + w.id + '">' + esc(T("API 密钥", "API key")) + ' <span class="opt">' + esc(T("（可选）", "(optional)")) + "</span></label>" + keyInput(w, s) +
        '<p class="hint">' + esc(T("检测历史不保存密钥。本地或自托管模型可留空。", "History never stores the key. Leave it empty for a local or self-hosted model.")) + "</p></div>";
    }
    return '<form class="setup" data-id="' + w.id + '" novalidate aria-labelledby="su-' + w.id + '">' +
      '<h4 id="su-' + w.id + '">' + esc(T("设置后即可启用", "Finish setup to switch it on")) + "</h4>" +
      "<p>" + esc(T("配置取自检测历史中的那次运行。设置运行间隔后启用即可。", "The configuration comes from the run in History. Set how often it runs, then activate it.")) + "</p>" +
      '<div class="fields">' + fields + "</div>" +
      '<button type="submit" class="btn pri go" data-act="activate" data-id="' + w.id + '"' + (s.busy ? ' disabled aria-busy="true"' : "") + ">" +
      icon("play") + esc(T("启用监控", "Activate monitor")) + "</button></form>";
  }

  function intervalCell(w, s) {
    if (needsInterval(w)) return esc(T("未设置", "Not set"));
    if (s.edit === "interval") return '<form class="edit" data-id="' + w.id + '" novalidate>' + intervalInput(w, s, true) + saveCancel("interval", w.id) + "</form>";
    return esc(fmtEvery(w.interval_sec)) + linkBtn("edit-interval", w.id, T("修改", "Change"));
  }
  function keyCell(w, s) {
    if (s.edit === "key") return '<form class="edit" data-id="' + w.id + '" novalidate>' + keyInput(w, s, true) + saveCancel("key", w.id) + "</form>";
    if (w.key_status === "locked") {
      return '<span style="color:var(--warn)" title="' + esc(T("输入主密钥后即可使用", "Enter the master key to use it")) + '">' +
        esc(T("已加密 · 已锁定", "Encrypted · locked")) + "</span>" + linkBtn("edit-key", w.id, T("更换", "Replace"));
    }
    if (w.key_status === "unreadable") {
      return '<span style="color:var(--warn)" title="' + esc(T("主密钥已丢失或更换，无法解密已保存的密钥", "The master key was lost or changed, so the stored key cannot be decrypted")) + '">' +
        esc(T("无法读取，请重新输入", "Unreadable – re-enter")) + "</span>" + linkBtn("edit-key", w.id, T("输入", "Enter"));
    }
    return esc(w.has_key ? T("已加密保存", "Stored encrypted") : T("无", "None")) + linkBtn("edit-key", w.id, T("更换", "Replace"));
  }
  function hooksCell(w, s) {
    if (s.edit === "hooks") {
      var v = s.vals.hooks != null ? s.vals.hooks : (w.webhooks || []).join("\n");
      return '<form class="edit" data-id="' + w.id + '" novalidate><textarea class="in" rows="3" spellcheck="false" autocapitalize="off"' +
        ' id="hk-' + w.id + '" data-act="f-hooks" data-id="' + w.id + '" placeholder="https://hooks.slack.com/services/…"' +
        ' aria-label="' + esc(T("Webhook 地址（每行一个）", "Webhook URLs (one per line)")) + '" aria-describedby="hke-' + w.id + '"' + invalid(s.errs.hooks) + ">" +
        esc(v) + "</textarea>" + err("hke-" + w.id, s.errs.hooks) + saveCancel("hooks", w.id) + "</form>";
    }
    return esc(hooksText((w.webhooks || []).length)) + linkBtn("edit-hooks", w.id, T("编辑", "Edit"));
  }
  // The profile pinned when the monitor was created: every run audits against
  // this fixed snapshot until the user re-pins it.
  function kbCell(w) {
    var kb = w.kb;
    if (!kb) {
      return esc(T("无匹配资料，每次运行使用当前知识库", "No profile matched — each run uses the current knowledge base"));
    }
    var out = "<code>" + esc(kb.provider + "/" + kb.model_id) + "</code>" +
      '<span class="aside">' + esc(Tf("固定于 {when}", "pinned {when}", { when: fmtTime(kb.pinned_at) })) + "</span>";
    if (w.kb_changed) {
      out += '<span class="aside" style="color:var(--warn)">' + esc(T("固定之后知识库已变化", "The knowledge base has changed since then")) + "</span>" +
        '<button type="button" class="btn sm" style="margin-top:6px" data-act="repin" data-id="' + w.id + '">' +
        icon("refresh") + esc(T("改用当前资料", "Use the current profile")) + "</button>";
    }
    return out;
  }

  // History link that pre-fills the relay / model / suite filters for this monitor.
  function historyHref(w, reportId) {
    var host = "";
    try { host = new URL(w.base_url).host; } catch (e) { host = w.base_url || ""; }
    var q = [["host", host], ["model", w.claimed_model || w.model || ""], ["suite", w.suite || ""]]
      .filter(function (p) { return p[1]; })
      .map(function (p) { return p[0] + "=" + encodeURIComponent(p[1]); }).join("&");
    return "/v2/history" + (q ? "?" + q : "") + "#r-" + reportId;
  }

  // Wire protocol: a forced one, or what "auto" detects for this endpoint.
  function protoCell(w) {
    var api = w.api_resolved || w.api || "auto";
    return "<code>" + esc(api) + "</code> · " +
      esc(w.api_auto ? T("自动识别", "auto-detected") : T("手动指定", "set manually"));
  }
  var STREAM = {
    stream: ["流式", "Streaming"],
    non_stream: ["非流式", "Non-streaming"],
    both: ["流式 + 非流式", "Streaming + non-streaming"],
  };
  function streamCell(w) {
    var m = STREAM[w.stream_mode] || STREAM.stream;
    return esc(T(m[0], m[1]));
  }

  function card(w) {
    var s = st(w.id);
    var name = w.name || "watch";
    var draft = needsSetup(w);
    var claimed = w.claimed_model && w.claimed_model !== w.model
      ? '<span class="aside">' + esc(T("声称的模型", "Claimed model")) + " <code>" + esc(w.claimed_model) + "</code></span>"
      : "";
    var lastParts = [];
    if (!draft || w.last_run_ts) {
      lastParts.push("<span>" + esc(T("上次运行", "Last run")) + ": <b>" + esc(fmtTime(w.last_run_ts)) + "</b></span>");
    }
    if (w.last_score != null) {
      lastParts.push("<span>" + esc(T("评分", "Score")) + " <b>" + esc(fmtScore(w.last_score)) + "</b>/100</span>");
    }
    if (w.last_report_id != null) {
      lastParts.push('<a href="' + esc(historyHref(w, w.last_report_id)) + '">' + esc(T("在检测历史中查看", "Open in history")) + " →</a>");
    }
    if (w.source_report_id != null) {
      lastParts.push('<a href="' + esc(historyHref(w, w.source_report_id)) + '">' + esc(Tf("来自运行 #{n}", "From run #{n}", { n: w.source_report_id })) + " →</a>");
    }
    var running = isRunning(w);
    if (!running) s.stopping = false;
    var waiting = !running && !draft && w.enabled;
    var actions;
    if (s.confirm) {
      actions =
        '<span class="ask" id="ask-' + w.id + '">' + esc(T("删除这个监控？", "Delete this monitor?")) + "</span>" +
        '<button type="button" class="btn sm danger" data-act="del-yes" data-id="' + w.id + '" aria-describedby="ask-' + w.id + '">' + icon("trash") + esc(T("删除", "Delete")) + "</button>" +
        '<button type="button" class="btn sm" data-act="del-no" data-id="' + w.id + '">' + esc(T("取消", "Cancel")) + "</button>";
    } else {
      // A draft can run once right away; the interval is only for the schedule.
      var run =
        running
          ? '<button type="button" class="btn sm danger" data-act="stop" data-id="' + w.id + '"' + (s.stopping ? ' disabled aria-busy="true"' : "") + ">" +
            icon("x") + esc(s.stopping ? T("正在取消…", "Cancelling…") : T("取消运行", "Cancel run")) + "</button>"
          : '<button type="button" class="btn sm' + (draft ? "" : " pri") + '" data-act="run" data-id="' + w.id + '">' +
            icon("play") + esc(T("立即运行", "Run now")) + "</button>";
      actions = run +
        '<button type="button" class="btn sm danger" data-act="del" data-id="' + w.id + '"' + (running ? " disabled" : "") + ">" + icon("trash") + esc(T("删除", "Delete")) + "</button>";
    }
    var stateLine = running
      ? '<span>' + esc(T("状态", "Status")) + ': <b>' + esc(w.queued
          ? T("排队中：等待该中转站上的另一项检测结束", "Queued: waiting for another audit of this relay to finish")
          : T("正在运行", "Running now")) + "</b></span>"
      : waiting ? '<span>' + esc(T("状态", "Status")) + ': <b>' + esc(T("等待下次计划运行", "Waiting for next scheduled run")) + "</b></span>" : "";
    if (stateLine) lastParts.unshift(stateLine);
    var pct = Math.max(0, Math.min(100, Number(w.progress) || 0));
    var progress = running
      ? '<div class="mon-prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"' +
        ' aria-label="' + esc(Tf("{name} 的运行进度", "Progress of {name}", { name: name })) + '"><span style="width:' + pct + '%"></span></div>' +
        "<b>" + pct + "%</b></div>"
      : "";
    var langLabel = T("告警语言", "Alert language");
    var thrLabel = T("告警阈值", "Alert threshold");
    var swText = draft ? T("待设置", "Needs setup") : w.enabled ? T("启用中", "Enabled") : T("已暂停", "Paused");
    return (
      '<article class="card mon' + (w.enabled ? "" : " off") + '" id="w-' + w.id + '" data-id="' + w.id + '" aria-labelledby="mn-' + w.id + '">' +
        '<div class="mon-top">' +
          '<div class="mon-title"><h3 class="mon-name" id="mn-' + w.id + '">' + esc(name) + "</h3>" + badge(w) + "</div>" +
          '<label class="switch"><input type="checkbox" role="switch" data-act="enabled" data-id="' + w.id + '"' + (w.enabled ? " checked" : "") +
            (draft ? " disabled" : "") + ' aria-describedby="mn-' + w.id + '"><span></span> <em class="sw-t">' + esc(swText) + "</em></label>" +
        "</div>" +
        '<div class="mon-body">' +
          '<div class="mon-url">' + esc(w.base_url || "") + "</div>" +
          '<dl class="mon-meta">' +
            meta(T("请求的模型", "Model to request"), "<code>" + esc(w.model || "?") + "</code>" + claimed) +
            meta(T("测试套件", "Test suite"), "<code>" + esc(w.suite || "standard") + "</code>" +
              (w.suite === "custom" && (w.dimensions || []).length ? " <code>" + esc(w.dimensions.join(", ")) + "</code>" : "")) +
            meta(T("协议", "Protocol"), protoCell(w)) +
            meta(T("性能探测请求", "Performance probe requests"), streamCell(w)) +
            meta(T("检测间隔", "Check interval"), intervalCell(w, s)) +
            meta(T("API 密钥", "API key"), keyCell(w, s)) +
            meta(thrLabel, '<select class="in" data-act="alert" data-id="' + w.id + '" aria-label="' + esc(thrLabel + " — " + name) + '">' + thresholdOptions(w.alert_on || "medium") + "</select>") +
            meta(T("Webhook", "Webhooks"), hooksCell(w, s)) +
            meta(langLabel, '<select class="in" data-act="lang" data-id="' + w.id + '" aria-label="' + esc(langLabel + " — " + name) + '">' + langOptions(w.language) + "</select>") +
            meta(T("知识库资料", "Knowledge profile"), kbCell(w)) +
          "</dl>" +
          (lastParts.length ? '<div class="mon-last">' + lastParts.join("") + "</div>" : "") +
        "</div>" +
        progress +
        (draft ? setupBox(w, s) : "") +
        '<div class="mon-msg ' + (s.msgKind || "") + '" role="status">' + (s.msg ? esc(s.msg()) : "") + "</div>" +
        '<div class="mon-act">' + actions + "</div>" +
      "</article>"
    );
  }

  var flashId = null, focusSetup = false;
  function render() {
    var list = $("list");
    if (loadErr && !watches) {
      $("count").textContent = "";
      list.innerHTML = '<p class="empty boxed">' + esc(T("加载失败，请刷新重试。", "Failed to load — please refresh and try again.")) + "</p>";
      return;
    }
    if (!watches) return;
    var n = watches.length;
    $("count").textContent = n ? (n === 1 ? T("共 1 项", "1 monitor") : Tf("共 {n} 项", "{n} monitors", { n: n })) : "";
    if (!n) {
      list.innerHTML =
        '<div class="empty boxed">' + icon("bell") +
        "<p>" + esc(T("还没有任何监控。", "No monitors yet.")) + "</p>" +
        '<p><a href="/v2/history">' + esc(T("在检测历史中选择一次运行，设为监控 →", "Pick a run in History and schedule it as a monitor →")) + "</a></p></div>";
      return;
    }
    // keep focus on the same control across a re-render
    var a = document.activeElement, keep = null, caret = null;
    if (a && list.contains(a) && a.getAttribute("data-act")) {
      keep = [a.getAttribute("data-act"), a.getAttribute("data-id")];
      try { caret = a.selectionStart; } catch (e) { caret = null; }
    }
    list.innerHTML = watches.map(card).join("");
    if (window.ZingSecret) window.ZingSecret.enhance(list);
    if (keep) {
      var alt = { del: "del-no", "del-no": "del", "del-yes": "del", run: "stop", stop: "run" }[keep[0]] || keep[0];
      var el = list.querySelector('[data-act="' + keep[0] + '"][data-id="' + keep[1] + '"]') ||
        list.querySelector('[data-act="' + alt + '"][data-id="' + keep[1] + '"]');
      if (el) {
        el.focus();
        if (caret != null) { try { el.setSelectionRange(caret, caret); } catch (e) { /* number inputs */ } }
      }
    }
    if (flashId != null) {
      var c = list.querySelector('.mon[data-id="' + flashId + '"]');
      if (c) {
        c.classList.add("flash");
        if (focusSetup) {
          c.scrollIntoView({ block: "center" });
          var first = c.querySelector(".setup .in:not(.sr-only)");
          if (first) first.focus({ preventScroll: true });
        }
      }
      flashId = null;
      focusSetup = false;
    }
  }

  // Runs started by the scheduler (or another tab) finish without the page
  // knowing, so refresh while any monitor is running. Paused while the tab is
  // hidden: a poll that comes due then is only marked (pollDue) and runs as
  // soon as the tab is visible again.
  var pollTimer = null, pollDue = false;
  function schedulePoll() {
    clearTimeout(pollTimer);
    pollTimer = null;
    pollDue = false;
    if ((watches || []).some(isRunning)) pollTimer = setTimeout(poll, 2000);
  }
  function poll() {
    pollTimer = null;
    if (document.hidden) pollDue = true;
    else load();
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && pollDue) {
      pollDue = false;
      load();
    }
  });

  function load() {
    return fetch("/api/watches")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (rows) {
        watches = Array.isArray(rows) ? rows : [];
        loadErr = false;
        render();
        schedulePoll();
      })
      .catch(function () {
        loadErr = true;
        render();
      });
  }

  // Saving or using an API key may need the master key first: ZingMasterKey
  // turns a 423 into the create / unlock dialog, then retries once.
  function withKey(doFetch) {
    return window.ZingMasterKey ? window.ZingMasterKey.withKey(doFetch) : doFetch();
  }
  function patch(id, body) {
    return withKey(function () {
      return fetch("/api/watches/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) {
          var e = new Error((j && j.error) || "HTTP " + r.status);
          e.server = j && j.error;
          throw e;
        }
        return j;
      });
    });
  }
  function failMsg(id, e) {
    var s = st(id), text = e && e.server;
    s.msgKind = "bad";
    s.msg = function () {
      return text ? T("无法更新这个监控", "Could not update the monitor") + ": " + L.server(text)
        : T("无法更新这个监控，请重试。", "Could not update the monitor — please try again.");
    };
  }
  function byId(id) {
    return (watches || []).filter(function (w) { return String(w.id) === String(id); })[0];
  }
  function focusAct(act, id) {
    var el = $("list").querySelector('[data-act="' + act + '"][data-id="' + id + '"]');
    if (el) el.focus();
    return !!el;
  }
  function closeEdit(id, back) {
    var s = st(id);
    s.edit = null;
    s.vals = {};
    s.errs = {};
    render();
    if (back) focusAct(back, id);
  }

  // Draft: validate the missing fields, then set them and switch it on in one PATCH.
  function activate(id) {
    var w = byId(id), s = st(id);
    if (!w) return;
    var body = { enabled: true }, first = null;
    s.errs = {};
    if (needsInterval(w)) {
      s.errs.interval = checkInterval(s.vals.interval);
      if (s.errs.interval) first = first || "f-interval";
      else body.interval_sec = minutesOf(s.vals.interval) * 60;
    }
    if (String(s.vals.key || "").trim()) body.api_key = s.vals.key.trim();
    s.msg = null;
    if (first) {
      render();
      focusAct(first, id);
      return;
    }
    s.busy = true;
    render();
    patch(id, body).then(function () {
      var every = body.interval_sec || w.interval_sec;
      s.vals = {};
      s.msgKind = "ok";
      s.msg = function () { return Tf("监控已启用，将{every}运行一次。", "Monitor activated — it runs {every}.", { every: fmtEvery(every) }); };
      return load();
    }, function (e) {
      failMsg(id, e);
      render();
    }).then(function () {
      s.busy = false;
      render();
      focusAct("enabled", id);
    });
  }

  function saveEdit(id, what) {
    var s = st(id), body = {}, fieldAct = "f-" + what;
    s.errs = {};
    if (what === "interval") {
      s.errs.interval = checkInterval(s.vals.interval != null ? s.vals.interval : ($("iv-" + id) || {}).value);
      if (!s.errs.interval) body.interval_sec = minutesOf(s.vals.interval != null ? s.vals.interval : $("iv-" + id).value) * 60;
    } else if (what === "key") {
      s.errs.key = checkKey(s.vals.key);
      if (!s.errs.key) body.api_key = s.vals.key.trim();
    } else if (what === "hooks") {
      var raw = s.vals.hooks != null ? s.vals.hooks : ($("hk-" + id) || {}).value;
      s.errs.hooks = checkHooks(raw);
      if (!s.errs.hooks) body.webhooks = hooksOf(raw);
    }
    if (s.errs[what]) {
      render();
      focusAct(fieldAct, id);
      return;
    }
    patch(id, body).then(function () {
      s.msgKind = "ok";
      s.msg = { interval: function () { return T("检测间隔已保存。", "Check interval saved."); },
        key: function () { return T("API 密钥已更换。", "API key replaced."); },
        hooks: function () { return T("Webhook 已保存。", "Webhooks saved."); } }[what];
      s.edit = null;
      s.vals = {};
      return load().then(function () { focusAct("edit-" + what, id); });
    }, function (e) {
      failMsg(id, e);
      render();
    });
  }

  // typed values survive re-renders (another card's load() repaints the whole list)
  $("list").addEventListener("input", function (ev) {
    var t = ev.target, act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (!id || !/^f-/.test(act || "")) return;
    var s = st(id), field = act.slice(2);
    s.vals[field] = t.value;
    // re-check a flagged field as the user fixes it
    if (s.errs[field]) {
      var fn = { interval: checkInterval, key: checkKey, hooks: checkHooks }[field](t.value);
      if (!fn) {
        s.errs[field] = null;
        t.removeAttribute("aria-invalid");
        var box = $({ interval: "ive-", key: "ke-", hooks: "hke-" }[field] + id);
        if (box) { box.hidden = true; box.textContent = ""; }
      }
    }
  });

  $("list").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target, id = f.getAttribute("data-id");
    if (f.classList.contains("setup")) return activate(id);
    var s = st(id);
    if (s.edit) saveEdit(id, s.edit);
  });

  $("list").addEventListener("click", function (ev) {
    var t = ev.target.closest("button[data-act]");
    if (!t) return;
    var id = t.getAttribute("data-id"), act = t.getAttribute("data-act"), s = st(id);
    if (act === "activate") {
      ev.preventDefault();
      activate(id);
    } else if (/^edit-/.test(act)) {
      s.edit = act.slice(5);
      s.vals = {};
      s.errs = {};
      s.msg = null;
      render();
      focusAct("f-" + s.edit, id);
    } else if (/^save-/.test(act)) {
      ev.preventDefault();
      saveEdit(id, act.slice(5));
    } else if (act === "cancel") {
      closeEdit(id, "edit-" + s.edit);
    } else if (act === "run") {
      s.running = true;
      s.msg = null;
      render();
      focusAct("stop", id);
      // pick up the server's progress soon; polling carries on from there
      setTimeout(load, 500);
      withKey(function () { return fetch("/api/watches/" + id + "/run", { method: "POST" }); })
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
        })
        .then(function (res) {
          if (!res.ok) {
            var e = res.body && res.body.error;
            if (res.status === 409) { s.msg = null; return; }
            if (res.status === 423) {
              s.msgKind = "bad";
              s.msg = function () { return T("主密钥已锁定：请先输入主密钥。", "The master key is locked — enter it first."); };
              return;
            }
            s.msgKind = "bad";
            s.msg = function () { return e ? T("运行失败", "Run failed") + ": " + L.server(e) : T("运行失败", "Run failed"); };
            return;
          }
          if (res.body && res.body.cancelled) {
            s.msgKind = "";
            s.msg = function () { return T("运行已取消。", "Run cancelled."); };
            return;
          }
          var rep = res.body && res.body.report;
          var score = rep && rep.verdict ? rep.verdict.overall_score : null;
          if (rep && score != null) {
            s.msgKind = "ok";
            s.msg = function () { return Tf("运行完成，评分 {score}/100。", "Run finished — score {score}/100.", { score: fmtScore(score) }); };
          } else if (rep) {
            s.msgKind = "ok";
            s.msg = function () { return T("运行完成。", "Run finished."); };
          } else {
            s.msgKind = "bad";
            s.msg = function () { return T("运行结束但没有生成报告，请检查中转站地址和密钥。", "The run produced no report — check the relay URL and key."); };
          }
        })
        .catch(function () {
          s.msgKind = "bad";
          s.msg = function () { return T("运行失败", "Run failed"); };
        })
        .then(function () {
          s.running = false;
          s.stopping = false;
          return load().then(function () {
            // the Cancel button went away and dropped focus to <body>: put it back
            var a = document.activeElement;
            if (!a || a === document.body) focusAct("run", id);
          });
        });
    } else if (act === "stop") {
      s.stopping = true;
      s.msg = null;
      render();
      fetch("/api/watches/" + id + "/cancel", { method: "POST" })
        .then(function (r) {
          // 409: it finished on its own meanwhile — nothing to report
          if (r.ok) {
            s.msgKind = "";
            s.msg = function () { return T("运行已取消。", "Run cancelled."); };
          } else if (r.status !== 409) {
            throw new Error("HTTP " + r.status);
          }
        })
        .catch(function () {
          s.msgKind = "bad";
          s.msg = function () { return T("无法取消运行，请重试。", "Could not cancel the run — please try again."); };
        })
        .then(function () {
          // a run this tab started clears `running` when its request returns
          return load().then(function () {
            var a = document.activeElement;
            if (!a || a === document.body) focusAct("run", id) || focusAct("stop", id);
          });
        });
    } else if (act === "repin") {
      t.disabled = true;
      patch(id, { repin: true }).then(function () {
        s.msgKind = "ok";
        s.msg = function () { return T("已固定为当前资料。", "Pinned to the current profile."); };
        return load();
      }, function (e) {
        failMsg(id, e);
        render();
      });
    } else if (act === "del") {
      s.confirm = true;
      render();
      focusAct("del-no", id);
    } else if (act === "del-no") {
      s.confirm = false;
      render();
      focusAct("del", id);
    } else if (act === "del-yes") {
      t.disabled = true;
      fetch("/api/watches/" + id, { method: "DELETE" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          delete ui[id];
          return load().then(function () { $("list-title").focus(); });
        })
        .catch(function () {
          s.confirm = false;
          failMsg(id);
          render();
        });
    }
  });

  $("list").addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    var t = ev.target.closest("[data-id]");
    if (!t) return;
    var id = t.getAttribute("data-id"), s = ui[id];
    if (!s) return;
    if (s.confirm) {
      s.confirm = false;
      render();
      focusAct("del", id);
    } else if (s.edit) {
      closeEdit(id, "edit-" + s.edit);
    }
  });

  $("list").addEventListener("change", function (ev) {
    var t = ev.target, act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (!id) return;
    var s = st(id);
    s.msg = null;
    if (act === "enabled") {
      var on = t.checked;
      patch(id, { enabled: on }).then(load, function (e) {
        t.checked = !on;
        failMsg(id, e);
        render();
      });
    } else if (act === "lang" || act === "alert") {
      var body = act === "lang" ? { language: t.value } : { alert_on: t.value };
      patch(id, body).then(function () {
        s.msgKind = "ok";
        s.msg = act === "lang"
          ? function () { return T("告警语言已保存。", "Alert language saved."); }
          : function () { return T("告警阈值已保存。", "Alert threshold saved."); };
        return load();
      }, function (e) {
        failMsg(id, e);
        load();
      });
    }
  });

  // /v2/watches#w-<id>: arriving from History's "Schedule as monitor"
  var m = /^#w-(\d+)$/.exec(location.hash || "");
  if (m) {
    flashId = m[1];
    focusSetup = true;
  }

  $("lock-icon").innerHTML = icon("lock");
  if (window.ZingMasterKey) window.ZingMasterKey.mountBar($("mk-bar"), function () { load(); });
  // language switch: re-render everything in place
  window.addEventListener("zing:lang", render);
  load();
})();
</script>
</body>
</html>
