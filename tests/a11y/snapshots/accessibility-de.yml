    - heading "Wie die Schritte geprüft werden" [level=3]
    - list:
      - listitem: Automatisch 27 von 44 · 61,4 %
      - listitem: Teilweise automatisch 17 von 44 · 38,6 %
      - listitem: Manuell 0 von 44 · 0 %
      - listitem: Nicht anwendbar 6
    - heading "Ergebnisse" [level=3]
    - list:
      - listitem: Bestanden 27 von 44 · 61,4 %
      - listitem: Fehlgeschlagen 0 von 44 · 0 %
      - listitem: Manuelle Prüfung ausstehend 17 von 44 · 38,6 %
      - listitem: Nicht geprüft 0 von 44 · 0 %
      - listitem: Nicht anwendbar 6
    - paragraph: Die Prozentwerte beziehen sich auf die anwendbaren Schritte; Schritte zu Audio und Video sind nicht anwendbar, weil die Oberfläche keine enthält.
    - paragraph: "Über WCAG hinaus geprüft: Benutzereinstellungen: erzwungene Farben (EN 301549 Abschnitt 11.7) — Bestanden"
