      - listitem: Automatique 27 sur 44 · 61,4 %
    - heading "Humain Une personne seule" [level=3]
    - list:
      - listitem: Manuel 0 sur 44 · 0 %
    - heading "Machine Humain D'abord la suite de tests, puis une personne" [level=3]
    - list:
      - listitem: Partiellement automatique 17 sur 44 · 38,6 %
      - listitem: Revu 6 sur 17 Revue manuelle en attente 11 sur 17
    - paragraph: L'anneau montre les 50 étapes. Les étapes sur l'audio et la vidéo ne s'appliquent pas, car l'interface n'en contient pas ; tous les autres chiffres portent sur les 44 étapes applicables.
    - paragraph: "Également vérifié au-delà des WCAG : Préférences de l'utilisateur : mode couleurs forcées (EN 301549 clause 11.7) — Réussi"
