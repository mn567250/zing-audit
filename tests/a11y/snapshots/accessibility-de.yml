- main:
  - heading "Konformitätsbericht Barrierefreiheit" [level=1]
  - paragraph: "Jeder Prüfschritt der BITV 2.0 und der EN 301549 (Kapitel 9, entspricht WCAG 2.1 Stufe A und AA): wie er geprüft wird und das letzte Ergebnis der automatisierten Barrierefreiheitstests."
  - region "Status":
    - heading "Status" [level=2]
    - paragraph: Teilweise vereinbar
    - paragraph: Von 44 anwendbaren Schritten sind 27 bestanden, 0 nicht bestanden, 17 warten auf eine manuelle Prüfung und 0 sind noch nicht geprüft.
    - term: Erstellt
    - definition: <report date>
    - term: Commit
    - definition:
      - code: <id>
    - term: zing-Version
    - definition: 0.18.0
    - term: axe-core-Version
    - definition: 4.13.0
