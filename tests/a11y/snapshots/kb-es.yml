  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "Interfaz clásica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automático"
    - option "Claro" [selected]
    - option "Oscuro"
  - combobox "Idioma":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español" [selected]
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - navigation "Navegación principal":
    - link "Auditoría":
