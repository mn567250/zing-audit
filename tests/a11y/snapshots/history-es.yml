- main:
  - heading "Historial y tendencias de auditorías" [level=1]
  - paragraph: Todas las verificaciones que ha ejecutado en este equipo, agrupadas por «intermediario + modelo declarado», con una línea de tendencia de la puntuación de salud; haga clic en una fila para desplegar ese informe.
  - paragraph:
    - text: El historial solo se guarda en un archivo SQLite local en
    - code: ~/.zing
    - text: ; no se envía nada.
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: Buscar
    - searchbox "Buscar"
    - text: Tipo de endpoint
    - combobox "Tipo de endpoint":
      - option "Todos" [selected]
      - option "Chat"
    - text: Relay / proveedor
    - combobox "Relay / proveedor":
      - option "Todos" [selected]
      - option "127.0.0.1:9099"
      - option "gateway.a-very-long-relay-hostname.example.org"
      - option "relay.example.com"
    - text: Modelo declarado
