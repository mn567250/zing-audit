    - text: zing.
  - link "Interface classique":
    - /url: "?ui=v1"
  - combobox "Thème":
    - option "Automatique"
    - option "Clair" [selected]
    - option "Sombre"
  - combobox "Langue":
    - option "English"
    - option "中文"
    - option "Français" [selected]
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - navigation "Navigation principale":
    - link "Audit":
      - /url: /v2/
    - link "Outils":
      - /url: /v2/tools
    - link "Historique":
      - /url: /v2/history
    - link "Surveillances":
