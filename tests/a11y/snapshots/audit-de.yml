  - paragraph: Läuft lokal · Schlüssel verlassen nie das Gerät
- main:
  - list "Audit-Fortschritt":
    - listitem: Konfigurieren
    - listitem: Scan
    - listitem: Bericht
  - region "Liefert dieses Relay das echte Modell?":
    - heading "Liefert dieses Relay das echte Modell?" [level=1]
    - paragraph: Geben Sie die Adresse des Relays und das Modell ein, das es angeblich liefert. zing führt auf Ihrem Rechner eine vollständige Black-Box-Testsuite aus und erstellt einen verständlichen, belegten Prüfbericht.
    - text: Relay-URL base_url
    - textbox "Relay-URL base_url":
      - /placeholder: https://relay.example.com/v1
    - text: API-Schlüssel Unterstützt env:VAR / file:/pfad
    - textbox "API-Schlüssel":
      - /placeholder: sk-... oder env:ZING_API_KEY
      - text: env:ZING_API_KEY
    - button "Schlüssel anzeigen" [pressed]
    - text: Angefragtes Modell model
    - combobox "Angefragtes Modell Anbieter":
      - option "Anbieter wählen…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "Benutzerdefiniert (vom Relay)"
    - button "Modelle abrufen" [disabled]
    - status
    - combobox "Angefragtes Modell Modell" [disabled]:
      - option "Modell wählen…" [selected]
    - button "Freie Eingabe"
    - text: Angegebenes Modell claimed_model Optional
    - textbox "Angegebenes Modell claimed_model Optional":
      - /placeholder: Leer = wie angefragtes Modell
    - text: Nur wenn das Relay es unter anderem Namen verkauft — zing prüft die Antworten gegen dieses Modell. Angegebener Anbieter declared_provider Optional
    - textbox "Angegebener Anbieter declared_provider Optional":
      - /placeholder: z. B. openai / deepseek
    - text: Hilft zing, das richtige Modellprofil zu wählen, wenn der Modellname allein nicht eindeutig ist. Die Auswahl eines Modells aus der Liste füllt es aus. Protokoll
    - group "Protokoll":
      - button "Auto" [pressed]
      - button "OpenAI"
      - button "Anthropic"
      - button "Responses"
    - text: Testsuite
    - group "Testsuite":
      - button "smoke"
      - button "standard" [pressed]
      - button "deep"
      - button "full"
      - button "benutzerdefiniert"
    - text: Anfragen der Leistungsmessung
    - group "Anfragen der Leistungsmessung":
      - button "Streaming" [pressed]
      - button "Ohne Streaming"
    - text: Bei standard läuft die Messung nur mit einer Referenz; sonst werden die Anfragen der Prüfung selbst verwendet.
    - button "Mit vertrauenswürdiger Referenz vergleichen compare" [expanded]
    - paragraph: Geben Sie einen Endpunkt desselben Modells an, dem Sie vertrauen (z. B. die offizielle API). zing nutzt ihn, um das Verhalten des Ziels zu bestätigen, und macht Urteile über Austausch/Herabstufung zuverlässiger — Qualitätsbewertung und Manipulationserkennung erreichen ihre höchste Stufe nur mit einer Referenz.
    - text: Referenz-URL base_url
    - textbox "Referenz-URL base_url":
      - /placeholder: https://api.openai.com/v1
    - text: Referenz-API-Schlüssel
    - textbox "Referenz-API-Schlüssel":
      - /placeholder: sk-... oder env:OPENAI_API_KEY
    - button "Schlüssel anzeigen"
    - text: Referenzmodell model
    - combobox "Referenzmodell Anbieter":
      - option "Anbieter wählen…" [selected]
      - option "Anthropic"
      - option "DeepSeek"
      - option "Google"
      - option "Zhipu AI"
      - option "Moonshot AI"
      - option "OpenAI"
      - option "Alibaba Cloud"
      - option "Benutzerdefiniert (vom Relay)"
    - button "Modelle abrufen" [disabled]
    - status
    - combobox "Referenzmodell Modell" [disabled]:
      - option "Modell wählen…" [selected]
    - button "Freie Eingabe"
    - text: Referenzprotokoll
    - group "Referenzprotokoll":
      - button "Auto" [pressed]
      - button "OpenAI"
      - button "Anthropic"
      - button "Responses"
    - button "Prüfung starten"
    - text: Die Tests werden von Ihrem lokalen zing-Server gesendet; der Schlüssel dient nur der Verbindung zum Ziel-Relay und wird nie an Dritte übertragen.
    - alert
    - status
    - text: zing liefert reproduzierbare Belege für Risiken und Abweichungen, kein rechtliches Urteil.
