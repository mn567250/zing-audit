      - listitem: 9.3.3.3 Sugerencias ante errores
      - listitem: 9.4.1.3 Mensajes de estado
    - heading "Cómo se evaluó" [level=3]
    - paragraph:
      - text: "Autoevaluación: en cada cambio, la batería de pruebas automatizadas de"
      - code: tests/a11y
      - text: comprueba cada página de la interfaz web v2 en un navegador real (Chromium, con axe-core y comprobaciones propias) en todos los idiomas de la interfaz y en los temas claro y oscuro. Cada prueba indica los pasos de prueba que decide.
    - paragraph: "Última ejecución de pruebas: 4 de octubre de 2026, 19:42. Aún no se ha hecho una revisión manual, incluidos lectores de pantalla."
    - heading "Comentarios" [level=3]
    - paragraph:
      - text: "¿Ha encontrado una barrera o algo es difícil de usar con tecnologías de apoyo? Díganoslo:"
      - link "informar de un problema de accesibilidad en GitHub":
