- banner:
  - link "跳到主要内容":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "经典界面":
    - /url: "?ui=v1"
  - combobox "主题":
    - option "跟随系统"
    - option "浅色" [selected]
    - option "深色"
  - combobox "动画":
    - option "动画开" [selected]
    - option "动画关"
  - combobox "语言":
    - option "English"
    - option "中文" [selected]
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "无障碍":
    - /url: /v2/accessibility
  - navigation "主导航":
    - link "检测":
      - /url: /v2/
    - link "检测历史":
      - /url: /v2/history
    - link "分析":
      - /url: /v2/analytics
    - link "监控":
      - /url: /v2/watches
    - link "知识库":
      - /url: /v2/kb
- main:
  - heading "检测分析" [level=1]
  - paragraph: 用 zing 在本机测得的数据，按时间对比各中转站与模型：健康分、速度、成功率与计费。
  - paragraph:
    - text: 基于
    - code: ~/.zing
    - text: 下的本地历史计算，不会上传。
  - status: 已更新：此范围内 14 次检测。
  - region "筛选":
    - button "筛选" [expanded]
    - text: 时间范围
    - group "时间范围":
      - button "最近 7 天"
      - button "最近 30 天" [pressed]
      - button "最近 90 天"
      - button "全部时间"
      - button "自定义"
    - text: 接口类型
    - combobox "接口类型":
      - option "对话" [selected]
    - text: 套件
    - combobox "套件":
      - option "全部"
      - option "standard" [selected]
    - text: 探测请求
    - combobox "探测请求":
      - option "全部"
      - option "流式" [selected]
    - text: 协议
    - combobox "协议":
      - option "全部" [selected]
      - option "openai"
    - text: 来源
    - combobox "来源":
      - option "全部" [selected]
      - option "手动"
      - option "监控"
    - text: 中转站
    - combobox "中转站":
      - option "全部" [selected]
      - option "Example Relay"
      - option "https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1"
      - option "http://127.0.0.1:9099/v1"
    - text: 声称模型
    - combobox "声称模型":
      - option "全部" [selected]
      - option "model-a"
      - option "model-b"
      - option "gpt-4o"
    - text: 历史中共 15 次检测（4 次由监控产生）。
  - button "复制此视图的链接"
  - tablist "分析视图":
    - tab "概览" [selected]
    - tab "趋势"
    - tab "可靠性"
    - tab "模型真实性"
    - tab "计费"
  - tabpanel "概览":
    - tablist "概览":
      - tab "关键指标" [selected]
      - tab "排行榜"
    - tabpanel "关键指标":
      - heading "关键指标" [level=2]
      - paragraph: 2026/9/2 – 2026/10/1，与之前同样长度的一段时间（2026/8/3 – 2026/9/1）对比。
      - list:
        - listitem: 检测次数 14 +14
        - listitem: 中转站 2 +2
        - listitem: 模型 2 +2
        - listitem: 健康分中位数 79 上一周期无数据
        - listitem: 高风险占比 21.4% 上一周期无数据
        - listitem: 成功率 100% 上一周期无数据
        - listitem: 首字延迟 p50 <duration> 上一周期无数据
        - listitem: 输出速度 62.9 tok/s 上一周期无数据
        - listitem: 计费比（输入） 103% 上一周期无数据 9 / 14 次检测有此数据
        - listitem: 计费比（输出） 102% 上一周期无数据 9 / 14 次检测有此数据
