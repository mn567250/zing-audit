- main:
  - heading "Cronologia e tendenze delle verifiche" [level=1]
  - paragraph: Tutte le verifiche eseguite su questa macchina, raggruppate per «intermediario + modello dichiarato», con una linea di tendenza del punteggio di salute; fai clic su una riga per espandere il rapporto.
