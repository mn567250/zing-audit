      - option "流式"
      - option "（未知）"
    - text: 风险
    - combobox "风险":
      - option "全部" [selected]
      - option "一致（疑似真货）"
      - option "基本可信"
      - option "货不对板"
    - text: 最低健康分
    - spinbutton "最低健康分"
    - text: 时间范围
