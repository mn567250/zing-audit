  - paragraph: 本地运行 · 密钥不经手
- main:
  - heading "zing 用来比对的知识库" [level=1]
  - paragraph:
    - text: 每次检测都会把中转站与其声称模型的资料比对：上下文窗口、输出上限、能力、身份与行为指纹。你可以在这里浏览这些资料并添加自己的模型——无需编写 YAML 文件或可编辑安装。你的条目保存在本机的 kb.db 中，网页界面和
    - code: zing check
    - text: 都会使用。
  - region "添加模型":
    - heading "添加模型" [level=2]
    - paragraph: 让 AI 助手调研该模型，然后在这里检查它的回答，再保存。
    - heading "1 复制调研提示词" [level=3]
    - text: 模型 ID id
    - textbox "模型 ID id":
      - /placeholder: 例如 example-large-2
    - text: 厂商 可选
    - textbox "厂商 可选":
      - /placeholder: 例如 openai / deepseek
    - button "复制提示词"
    - status
    - group:
      - text: 查看提示词
      - textbox "提示词"
    - paragraph: 把它粘贴到你选择的 AI 助手中，它会返回一份 YAML 文档。
    - heading "2 上传或粘贴 YAML" [level=3]
    - text: 资料 YAML
    - textbox "资料 YAML":
      - /placeholder: "provider: …\nmodels:\n- id: …"
    - text: 选择 .yaml 文件
    - heading "3 检查并保存" [level=3]
    - paragraph: 检查会校验结构与上限、标记不安全的正则表达式、列出 zing 将发送给中转站的所有提示词，并显示哪些模型 ID 的匹配结果会改变。保存之前不会写入任何内容。
    - button "检查"
    - button "保存到知识库" [disabled]
  - region "某个模型 ID 会使用哪份资料？":
    - heading "某个模型 ID 会使用哪份资料？" [level=2]
    - textbox "模型 ID":
      - /placeholder: 例如 gpt-4o
    - button "查询"
    - status
  - heading "你的条目" [level=2]
  - link "导出为 YAML":
    - /url: /api/kb/export
  - paragraph: 还没有你自己的条目。用上面的步骤添加第一个模型。
  - heading "全部资料 98 个模型" [level=2]
  - searchbox "筛选"
