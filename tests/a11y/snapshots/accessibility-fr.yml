- main:
  - heading "Rapport de conformité d'accessibilité" [level=1]
  - paragraph: "Chaque étape de test du BITV 2.0 et de l'EN 301549 (chapitre 9, identique aux WCAG 2.1 niveaux A et AA) : comment elle est testée et le dernier résultat des tests d'accessibilité automatisés."
  - region "Statut":
    - heading "Statut" [level=2]
    - paragraph: Partiellement conforme
    - paragraph: Sur 44 étapes applicables, 33 sont réussies, 0 échouent, 11 attendent une revue manuelle et 0 ne sont pas encore testées.
