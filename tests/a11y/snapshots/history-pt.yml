- main:
  - heading "Histórico e tendências das auditorias" [level=1]
  - paragraph: Todas as verificações que executou neste computador, agrupadas por «intermediário + modelo declarado», com uma linha de tendência da pontuação de saúde; clique numa linha para expandir esse relatório.
  - paragraph:
    - text: O histórico fica apenas num ficheiro SQLite local em
    - code: ~/.zing
    - text: — nada é enviado.
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: Pesquisar
    - searchbox "Pesquisar"
    - text: Tipo de endpoint
    - combobox "Tipo de endpoint":
      - option "Todos" [selected]
      - option "Chat"
    - text: Relay / provedor
    - combobox "Relay / provedor":
