- banner:
  - link "Vai al contenuto principale":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - navigation "Navigazione principale":
    - link "Verifica":
      - /url: /v2/
    - link "Strumenti":
      - /url: /v2/tools
    - link "Cronologia":
      - /url: /v2/history
    - link "Monitor":
      - /url: /v2/watches
    - link "Modelli":
      - /url: /v2/kb
  - link "Interfaccia classica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automatico"
    - option "Chiaro" [selected]
    - option "Scuro"
  - combobox "Lingua":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano" [selected]
    - option "Deutsch"
  - paragraph: Esecuzione locale · le chiavi non escono mai
- main:
  - heading "La base di conoscenza usata da zing" [level=1]
  - paragraph:
    - text: "Ogni audit confronta un relay con il profilo del modello dichiarato: finestra di contesto, limite di output, capacità, identità e impronte comportamentali. Sfoglia qui i profili e aggiungi i tuoi modelli, senza file YAML né installazione modificabile. Le tue voci sono salvate in kb.db su questa macchina e usate sia dall’interfaccia web sia da"
    - code: zing check
    - text: .
  - region "Aggiungi un modello":
    - heading "Aggiungi un modello" [level=2]
    - paragraph: Lascia che un assistente IA si documenti sul modello, poi verifica qui la risposta prima di salvarla.
    - heading "1 Copia il prompt di ricerca" [level=3]
    - text: ID del modello id
    - textbox "ID del modello id":
      - /placeholder: es. example-large-2
    - text: Fornitore Facoltativo
    - textbox "Fornitore Facoltativo":
      - /placeholder: ad es. openai / deepseek
    - button "Copia prompt"
    - status
    - group:
      - text: Mostra il prompt
      - textbox "Prompt"
    - paragraph: Incollalo nell’assistente IA che preferisci. Risponde con un documento YAML.
    - heading "2 Carica o incolla lo YAML" [level=3]
    - text: YAML del profilo
    - textbox "YAML del profilo":
      - /placeholder: "provider: …\nmodels:\n- id: …"
    - text: Scegli un file .yaml
    - heading "3 Verifica e salva" [level=3]
    - paragraph: La verifica convalida schema e limiti, segnala le espressioni regolari non sicure, elenca ogni prompt che zing invierebbe ai relay e mostra quali ID di modello verrebbero risolti diversamente. Nulla viene salvato finché non salvi.
    - button "Controllo"
    - button "Salva nella base" [disabled]
  - region "Quale profilo usa un ID di modello?":
    - heading "Quale profilo usa un ID di modello?" [level=2]
    - textbox "ID del modello":
      - /placeholder: es. gpt-4o
    - button "Cerca"
    - status
  - heading "Le tue voci" [level=2]
  - link "Esporta come YAML":
    - /url: /api/kb/export
  - paragraph: Non hai ancora voci tue. Usa i passaggi sopra per aggiungere il tuo primo modello.
  - heading "Tutti i profili 98 modelli" [level=2]
  - searchbox "Filtra"
  - group:
