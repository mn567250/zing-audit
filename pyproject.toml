[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zing-audit"
version = "0.17.2"
description = "LLM relay reality check — a CLI that audits whether an API relay actually serves the model it claims (货不对板检测)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "zing contributors" }]
keywords = [
    "llm",
    "openai",
    "api",
    "relay",
    "proxy",
    "audit",
    "model-fingerprinting",
    "context-window",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # PDF reports: pure Python, BSD-licensed, no system libraries.
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Accurate tokenizer-based billing audit for OpenAI-family encodings.
tokenizers = ["tiktoken>=0.7"]
# Local web UI: `zing serve`.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Encrypts the API keys stored for monitors (zing/secretbox.py).
    "cryptography>=42",
]
# Accessibility tests of the web UI (tests/a11y, `pytest -m a11y`): a real
# browser via Playwright; run `playwright install chromium` once.
a11y = ["playwright>=1.47"]
# PDF reports are part of the core install now; the empty extra keeps
# `pip install 'zing-audit[pdf]'` from older instructions working.
pdf = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # parallel runs: pytest -n auto (the a11y suite keeps one report per worker)
    "pytest-xdist>=3.5",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # reads exported PDFs back in the tests
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/cenbonew/zing"
Repository = "https://github.com/cenbonew/zing"
Issues = "https://github.com/cenbonew/zing/issues"

[project.scripts]
zing = "zing.cli:app"

[tool.hatch.build.targets.wheel]
# packages=["zing"] already bundles zing/knowledge/data/*.yaml (data/ is a real
# subpackage). Do NOT also force-include them — that adds a second file at the same
# archive path and aborts the wheel build.
packages = ["zing"]

[tool.hatch.build.targets.sdist]
# Ship the source the package needs; keep scratch/reference material out of the
# sdist (there is no .git here, so hatchling can't infer it from VCS).
include = [
    "/zing",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/README.zh-CN.md",
    "/README.fr.md",
    "/README.es.md",
    "/README.pt.md",
    "/README.it.md",
    "/README.de.md",
    "/DEVELOPER_GUIDE.md",
    "/DEVELOPER_GUIDE.zh-CN.md",
    "/DEVELOPER_GUIDE.fr.md",
    "/DEVELOPER_GUIDE.es.md",
    "/DEVELOPER_GUIDE.pt.md",
    "/DEVELOPER_GUIDE.it.md",
    "/DEVELOPER_GUIDE.de.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "a11y: browser accessibility tests of web UI v2 (BITV 2.0 / EN 301 549 / WCAG 2.1 AA); need the a11y extra",
    "bitv(*steps): the BITV 2.0 / EN 301 549 test steps (\"9.1.4.3\", …) an a11y test decides (axe=True: only through axe rule results); feeds the conformance report (tests/a11y/results.py)",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
